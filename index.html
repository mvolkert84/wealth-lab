/* Keep chapter metadata on separate lines in narrow mobile layouts. */
.module-title,.module-sub,.module-meter{display:block}
.module-body{overflow:hidden}
.module-title,.module-sub{overflow-wrap:anywhere}

/* Foundation and Mortgage deep dives (v1.1); native details remain functional offline. */
.article .deep-dive{border-top:1px solid #d8ddcc;margin:21px 0 9px;padding-top:20px}
.deep-marker{font-size:10px;font-weight:800;letter-spacing:1.25px;color:#3a7658}
.article .deep-head h3{font:700 23px/1.15 Georgia,serif;color:#163b30;margin:8px 0}
.article .deep-head p{font-size:calc(var(--reader-size) - 1px);line-height:1.65;color:#395849;margin:0 0 13px}
.deep-steps{border-radius:13px;background:#eff2e9;border:1px solid #d2ddcb;padding:4px 12px 5px}
.deep-step{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #dce2d7}
.deep-step:last-child{border-bottom:0}
.step-num{flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:#1b684b;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.step-text{min-width:0;display:flex;flex-direction:column;gap:3px}
.step-text strong{color:#234e3c;font-size:12px}
.step-text b{color:#0f3428;font-size:17px;line-height:1.2}
.step-text small{color:#547064;font-size:12px;line-height:1.4}
.deep-more{border:1px solid #d3ddce;background:#f8f8f2;border-radius:13px;margin:10px 0;overflow:hidden}
.deep-more summary{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:13px 14px;font-size:13px;font-weight:750;color:#1b543d;cursor:pointer;list-style:none}
.deep-more summary::-webkit-details-marker{display:none}
.deep-more[open] summary{border-bottom:1px solid #d9e0d6}
.deep-inner{padding:13px 14px;color:#335747;font-size:13px;line-height:1.55}
.deep-inner>strong{display:block;margin-bottom:9px;color:#244b3b}
.deep-inner>p{margin:0}
.deep-row{display:flex;gap:11px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #e0e3d9;padding:10px 0}
.deep-row:last-child{border-bottom:0}
.deep-row>span{flex:1;color:#214638;font-size:13px}
.deep-row small{display:block;color:#62766a;font-size:11px;margin-top:3px}
.deep-row b{flex:0 0 auto;color:#104a34;font-size:13px;text-align:right;max-width:48%}
.deep-footnote{margin-top:12px!important;color:#557363}
.deep-prompt{background:#173a2d;color:#f0ecdc;padding:15px;border-radius:13px;margin-top:13px}
.deep-prompt span{font-size:10px;letter-spacing:1.1px;color:#d8bd85;font-weight:800}
.deep-prompt p{font-size:14px;line-height:1.6;margin:7px 0 0;color:#e6eddf}


/* Wealth Lab state explorer: nationwide research, still local-first */
.state-page .state-hero{background:linear-gradient(135deg,#173f32,#08261f 68%);border:1px solid #39674d;border-radius:18px;padding:20px 17px;margin:16px 0;color:#f9f3e8}.state-hero h2{font:30px/1.1 Georgia,serif;margin:11px 0 10px;max-width:290px}.state-hero p{font-size:13px;line-height:1.65;color:#c9d7ca}.state-select-label{display:block;margin:16px 0 6px;font-size:12px;font-weight:700;color:#c0e6ce}.state-select{width:100%;font-size:16px;background:#f9f5e9;border:1px solid #cabf9d;color:#18392d;padding:12px 10px;border-radius:11px}.state-region{display:flex;align-items:center;gap:14px;margin:17px 0 10px}.state-region h2{margin:3px 0;font:27px Georgia,serif}.state-big-code{width:65px;height:65px;display:grid;place-items:center;border-radius:16px;background:#204c39;color:#e9d4a7;border:1px solid #6b845f;font:27px Georgia,serif;flex-shrink:0}.state-agency{background:#f7f2e5;color:#17382a;border:1px solid #d6ceb7;border-radius:15px;padding:17px;margin:11px 0}.state-agency h3{color:#123e2e;font:22px/1.2 Georgia,serif;margin:9px 0}.state-agency p{font-size:13px;line-height:1.55;color:#476152}.state-link{display:inline-block;background:#176245;color:#fff!important;text-decoration:none;border-radius:10px;padding:12px 14px;font-size:12px;font-weight:750;margin-top:8px}.state-agency .eyeline{color:#426a4c}.state-check{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid #355444}.state-check:last-child{border:0}.state-check span{color:#6de0a3;font-weight:bold;font-size:16px}.state-check strong{font-size:13px}.state-check p{font-size:12px;line-height:1.55;color:var(--muted);margin:4px 0 0}.state-loan{border-top:1px solid #31503f;padding:13px 0}.state-loan strong{font-size:14px}.state-loan p{color:var(--muted);font-size:12px;line-height:1.55;margin:6px 0}.state-loan a,.state-links a,.state-underlink{font-size:12px;color:#8fdfb1}.state-rates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.state-rates>div{background:#173a30;border:1px solid #365b49;border-radius:12px;padding:14px}.state-rates small{display:block;font-size:11px;color:#c2d1c1}.state-rates strong{display:block;font:30px Georgia,serif;margin-top:7px;color:#f1d49b}.state-links a{display:block;padding:11px 0;border-bottom:1px solid #345340}.state-chat{border:1px solid #927a49;background:linear-gradient(135deg,#1b4132,#142e27);border-radius:17px;padding:19px 16px;margin-top:15px}.state-chat strong{font:22px Georgia,serif}.state-chat p{font-size:12px;line-height:1.55;color:#d4dac7}.state-chat a{display:block;text-align:center;margin-top:13px;color:#d9c197;font-size:12px}.state-tool-link{display:block;width:100%;text-align:center;background:#224b37;color:#c9f2d9;padding:13px 10px;border:1px solid #51735b;border-radius:12px;font-weight:750;font-size:13px;margin:12px 0}.state-teaser{margin:15px 0}.state-page .panel{margin-top:13px}

/* State assistance research catalog — Wealth Lab v1.3 */
.program-panel{margin-top:14px;padding:16px 14px}
.program-panel .program-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.program-panel .program-heading h3{font:24px/1.17 Georgia,serif;margin:7px 0 4px;color:#f6f1e6}
.program-panel .program-count{white-space:nowrap;background:#183f34;border:1px solid #406651;color:#c9ead7;padding:7px 9px;border-radius:11px;font-weight:750;font-size:12px}
.program-hint{font-size:12px;line-height:1.6;color:#b8cfc1;margin:6px 0 13px}
.program-card{border:1px solid #406851;background:linear-gradient(155deg,#103a2e,#092b23);border-radius:15px;padding:15px 13px;margin:10px 0}
.program-card-title{font-size:17px;line-height:1.2;margin:0;color:#f3e9d1;font-weight:750;letter-spacing:-.3px}
.program-tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.program-tag{border:1px solid #4b745d;border-radius:20px;padding:5px 8px;font-size:10px;color:#d4e5d4;background:#1c4839}
.program-tag.closure{color:#f0cf9c;border-color:#8a6b3e;background:#423424}
.program-amount{font:21px/1.3 Georgia,serif;color:#efd5a0;margin:12px 0 7px}
.program-detail{font-size:12px;line-height:1.7;color:#d0ded3;margin:0 0 12px}
.program-source{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid #315543;padding-top:12px;margin-top:12px}
.program-source a{font-size:12px;font-weight:750;color:#70e0a7}
.program-source small{font-size:10px;color:#a2bead;line-height:1.4}
.program-glossary{border:1px solid #406751;background:#112f27;border-radius:12px;padding:12px;margin:13px 0 0}
.program-glossary summary{cursor:pointer;color:#e9d5a4;font-size:12px;font-weight:700}
.program-glossary p{color:#c8d6c9;font-size:12px;line-height:1.6;margin:10px 0}
.program-smallprint{font-size:11px;line-height:1.6;color:#acc4b6;margin-top:12px}
.program-panel.compact .program-card{padding:12px}
.program-panel.compact .program-card-title{font-size:15px}

/* Wealth Lab v2.1 — state-by-state comparison */
.state-selector-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.state-selector-grid .state-select{width:100%;min-width:0;padding:12px 7px;font-size:12px}
.state-selector-grid .state-select-label{font-size:11px;letter-spacing:0;display:block;margin-bottom:7px}
.state-compare-actions{display:flex;gap:9px;margin:12px 0 0;flex-wrap:wrap}
.state-compare-actions button{flex:1;min-width:125px}
.state-compare-actions button:disabled{opacity:.4;cursor:not-allowed}
.state-mode-label{font-size:11px;letter-spacing:.55px;color:#a8debd;font-weight:700;margin:12px 0 0;line-height:1.45}
.compare-summary{margin-top:16px}
.compare-summary h2,.compare-heading h2{margin:7px 0;font:25px Georgia,serif}
.comparison-table{border:1px solid #3c6352;border-radius:12px;overflow:hidden;margin:13px 0}
.compare-grid-row{display:grid;grid-template-columns:minmax(72px,.77fr) repeat(2,minmax(0,1fr));align-items:stretch}
.compare-grid-row>div{padding:10px 8px;min-width:0;font-size:11px;line-height:1.5;overflow-wrap:anywhere;border-top:1px solid #31503f}
.compare-grid-row>div+div{border-left:1px solid #31503f}

  {title:'A hypothetical monthly breakdown',lines:[['Principal and interest','$1,501'],['Property taxes','$530'],['Homeowners insurance','$150'],['Mortgage insurance','$95'],['Total before maintenance','$2,276']],bottom:'Amounts are illustrative, not quotes. Actual property taxes vary by state and locality; these are teaching numbers.'},
  {q:'Which cost may be missing from a quoted “principal and interest” payment?',options:['Only principal','Only interest','Property tax and homeowners insurance','The loan balance'],answer:2,feedback:'The full housing cost includes property taxes, insurance, and possibly mortgage insurance, HOA charges, and maintenance.'},['payment','cfpb'],'Open Tools → Mortgage Payment to see your own breakdown.'),
  S('L2.S4','Property Taxes by Location','A Connecticut mill-rate example',
  'Property tax rules differ widely by state, county, city, and parcel. Connecticut uses a mill-rate system: this is just one example. Always check the selected property’s official local assessment and bill.',
  [ ['Assessed value','The value recorded by the town assessor for taxation, which is not necessarily the sale price.'],['Mill rate','The local tax rate per $1,000 of assessment.'],['Formula','Annual tax = (assessed value × mill rate) ÷ 1,000.'],['Practical step','Before making an offer, look up the parcel assessment, current town mill rate, and whether revaluation or district taxes may affect the bill.'] ],
  {title:'Illustrative Connecticut calculation',lines:[['Assessed value','$175,000'],['Example mill rate','36.00'],['Annual property tax','$6,300'],['Monthly equivalent','$525']],bottom:'The 36.00 mill rate is a round-number illustration, not a verified current Vernon rate. Use the town and parcel records for the real bill.'},
  {q:'A parcel is assessed at $200,000 and the tax rate is 30 mills. What is the annual tax?',options:['$600','$3,000','$6,000','$60,000'],answer:2,feedback:'$200,000 × 30 ÷ 1,000 = $6,000 per year.'},['ct']),
  S('L2.S5','State Assistance, Refinancing & Trusts','One strategy can affect another',
  'Most states have a housing finance agency that may provide affordable mortgage or assistance options. This section uses Connecticut’s CHFA as a case study, not a nationwide offer. Verify the selected state’s current rules.',
  [ ['Time To Own','CHFA publishes a 0% forgivable assistance loan for eligible borrowers alongside a CHFA first mortgage, with annual forgiveness under program terms.'],['Possible restrictions','Occupancy, resale, refinance, and transfer provisions may affect repayment or permission. Read the actual loan documents.'],['Trust complication','Do not assume you can transfer a home into a trust without consequences for an assistance loan or mortgage. Get lender/servicer and attorney confirmation before changing title.'],['Better sequence','Check purchase eligibility → obtain and review loan documents → discuss estate plan with an attorney licensed in the property state → obtain written approvals where required.'] ],
  {title:'A tempting plan that needs checking',lines:[['First mortgage','CHFA-qualified loan'],['Possible assistance','Up to program limits'],['Later change','Refinance or deed transfer'],['Potential issue','Repayment / consent terms']],bottom:'The example is about sequencing, not disqualification. Program terms and individual circumstances control; do not transfer title based on a generic online claim.'},
  {q:'Before transferring a home with assistance financing into a trust, what is the sensible first step?',options:['Assume trusts are always exempt','Change the deed without telling anyone','Review the loan terms and obtain professional/lender guidance','Stop paying property tax'],answer:2,feedback:'Financing and assistance documents may include restrictions. Confirm the actual requirements before transferring property.'},['chfa','cfpb'],'Save a question for a lender about future refinancing and trust transfers.')
 ]},
 {id:'M3',title:'Trusts & Inheritance',short:'Plan for the next generation',deck:'The difference between building assets and legally transferring them.',symbol:'♧',sections:[
  S('L3.S1','A Trust Is Not a Money Machine','The people and the property',
  'A trust is a legal relationship: someone establishes it, a trustee administers assets under its terms, and beneficiaries may benefit. A trust is not automatically a tax shelter or a shield against all creditors.',
  [ ['Grantor / settlor','The person creating and funding the trust.'],['Trustee','The person or institution with the legal duty to manage assets under the trust terms.'],['Beneficiary','The person or group who can receive benefits under the trust.'],['Funding','A trust document alone is not enough if an asset was never properly transferred or assigned where required.'],['Costs','Creating, administering, maintaining, and occasionally filing for a trust may involve ongoing costs.'] ],
  {title:'A simple family illustration',lines:[['Parent','Creates trust'],['Trustee','Manages trust assets'],['Daughter','Named beneficiary'],['Property','Transferred only if legally appropriate']],bottom:'The arrangement must be drafted to fit the actual circumstances, title documents, lenders, and other legal requirements.'},
  {q:'What does a trustee generally do?',options:['Guarantees investment returns','Manages assets following trust terms and duties','Eliminates every tax','Owns the assets for personal use'],answer:1,feedback:'A trustee has legal obligations to administer the trust in accordance with its terms and applicable law.'},['irstrust','probate']),
  S('L3.S2','Revocable vs. Irrevocable','Control, flexibility, and tradeoffs',
  'A revocable living trust can typically be amended or revoked by its creator during life. An irrevocable trust generally gives up meaningful control. The legal and tax results depend on detailed terms and applicable law.',
  [ ['Revocable trust','Commonly used for management, continuity, and estate administration. It generally does not shield the creator’s assets from the creator’s creditors.'],['Irrevocable trust','Can serve specific planning objectives but may sacrifice flexibility and involve complicated gift, income, estate, or benefit rules.'],['Tax trap','The IRS generally treats a revocable trust as a grantor trust. Trust ownership does not automatically create an income-tax deduction.'],['Professional checkpoint','Have a Connecticut estate-planning attorney assess actual beneficiary needs, family dynamics, and financing terms.'] ],
  {title:'Choosing the right question',lines:[['Goal','Make inheritance simpler'],['Potential tool','Revocable living trust'],['Goal','Specialized asset protection'],['Potential tool','Possibly an irrevocable arrangement']],bottom:'These are broad examples, not recommendations for a particular trust. Different goals call for different legal instruments.'},
  {q:'Does moving cash into your own revocable trust automatically eliminate income tax on its earnings?',options:['Yes, always','No, generally not','Only if the home is paid off','Only in Connecticut'],answer:1,feedback:'The IRS generally treats a revocable living trust as a grantor trust for income-tax purposes.'},['irstrust']),
  S('L3.S3','Planning for a Daughter','The inheritance is more than a deed',
  'Passing an asset means deciding who receives it, when, how it will be managed, and who pays ongoing expenses. A clear plan can be more valuable than a sophisticated-sounding trust.',
  [ ['Who','Identify intended beneficiaries and backups.'],['When','Decide whether distribution should be immediate, staged, or managed over time.'],['How','Plan for property taxes, insurance, repairs, sale decisions, and co-owners.'],['Contingencies','Consider disability-benefit eligibility, minor beneficiaries, incapacity, divorce, and creditor claims where applicable.'],['Coordination','Review wills, trust provisions, insurance beneficiaries, bank account designations, and deeds together.'] ],
  {title:'An inherited home still has bills',lines:[['Estimated yearly property taxes','$6,300'],['Insurance (illustrative)','$1,800'],['Repairs reserve (illustrative)','$3,000'],['Annual cash needed','$11,100']],bottom:'A mortgage-free home can still cost $925/month in this example. It matters how the beneficiary will pay those bills.'},
  {q:'What is an important question when leaving a mortgage-free home to a child?',options:['Can they afford ongoing taxes and repairs?','Will all taxes disappear?','Is insurance no longer needed?','Can a trustee ignore the deed?'],answer:0,feedback:'Even without a mortgage, the beneficiary must address property taxes, insurance, and upkeep.'},['probate'])
 ]},
 {id:'M4',title:'Investing & Growth',short:'Make long-term decisions',deck:'Build diversified growth without confusing predictions for promises.',symbol:'↗',sections:[
  S('L4.S1','Stocks, Funds, and Ownership','What exactly are you buying?',
  'A share of stock represents an ownership interest in a company. A fund can own many securities, letting investors buy a portfolio rather than only one company.',
  [ ['Individual stock','Concentrated exposure to one company’s performance.'],['Index fund','A fund designed to track a specified market index; performance, fees, and tracking can differ.'],['ETF','Exchange-traded fund; a wrapper that can hold stocks, bonds, or other assets and trades on an exchange.'],['Risk','Diversification can reduce some company-specific risk, not remove the possibility of market losses.'] ],
  {title:'Concentration vs. diversification',lines:[['Single-company portfolio','1 company'],['Broad index example','Hundreds or thousands'],['Guaranteed return','None']],bottom:'A diversified fund can still lose value during a broad market decline.'},
  {q:'Which generally spreads company-specific risk across more businesses?',options:['Owning one stock only','A broad diversified stock index fund','Borrowing to buy one stock','Keeping all money in one company'],answer:1,feedback:'Owning many companies spreads the impact of any single company’s results, although overall market risk remains.'},['investor','diversify']),
  S('L4.S2','Risk, Time, and Liquidity','Match money to its job',
  'Money needed for a down payment soon has a different job from retirement investments decades away. A high expected return is not useful if a sudden loss ruins the purchase plan.',
  [ ['Short horizon','Prioritize accessible, low-volatility funds for near-term obligations.'],['Long horizon','A diversified investment mix may be appropriate, depending on risk capacity and goals.'],['Emergency savings','A buffer for unexpected expenses should generally be liquid.'],['Volatility','The price of an investment can move sharply before you need to sell.'] ],
  {title:'One savings goal, two jobs',lines:[['House closing in 12 months','Needs stability'],['Retirement in 25 years','Can evaluate long-term growth'],['Emergency fund','Needs ready access']],bottom:'How soon you need the money often matters more than the most exciting potential return.'},
  {q:'Where is money for a house closing next month generally better placed?',options:['A highly speculative stock','Liquid, stable savings appropriate for the goal','One volatile cryptocurrency','An illiquid long-term investment'],answer:1,feedback:'Short-horizon money must be available when needed; large price swings can jeopardize closing.'},['investor']),
  S('L4.S3','Investing with Tax Advantages','Different accounts, different rules',
  'A tax-advantaged account can change when or how investments are taxed. It does not guarantee returns, and eligibility and contribution limits vary by year.',
  [ ['Traditional retirement accounts','Contributions may receive a tax benefit subject to rules; future withdrawals may be taxable.'],['Roth accounts','Contributions are generally after-tax; qualifying withdrawals can be tax-free under applicable conditions.'],['Employer match','If available, may add funds to retirement savings; vesting and plan rules matter.'],['Taxable brokerage','Usually flexible access but investment income and gains may create taxes.'] ],
  {title:'Same investment, different wrapper',lines:[['Investment','Diversified fund'],['Account A','Taxable brokerage'],['Account B','Eligible retirement account'],['Result','Different tax treatment']],bottom:'Check current IRS limits, filing status, income eligibility, and employer plan rules before contributing.'},
  {q:'What is the main role of a Roth IRA?',options:['Guaranteeing a fixed investment return','Providing qualifying tax advantages to retirement investing','Avoiding all stock-market risk','Replacing homeowners insurance'],answer:1,feedback:'A Roth IRA is an account with particular tax rules; its investments can still gain or lose value.'},['taxes','investor'])
 ]},
 {id:'M5',title:'Insurance & Protection',short:'Protect what you build',deck:'Understand risk transfer and the actual job of insurance.',symbol:'⬡',sections:[
  S('L5.S1','Term vs. Permanent Life Insurance','Protection first, product second',
  'Life insurance is primarily meant to provide a death benefit to beneficiaries. Some permanent policies also build cash value; they have more moving parts and costs.',
  [ ['Term insurance','Coverage for a defined period, often with lower initial premiums for the same death benefit. Typically no cash value.'],['Permanent insurance','Coverage designed to remain in force subject to premiums and policy terms; some products build cash value.'],['Policy loan','Usually borrows against available cash value; interest and unpaid debt can reduce the death benefit or jeopardize the policy.'],['Opportunity cost','Money spent on insurance premiums cannot simultaneously fund other goals. Compare protection, fees, and alternatives.'] ],
  {title:'A common marketing claim',lines:[['Claim','Borrow from your own policy'],['Missing detail','You still owe interest'],['Potential downside','Reduced death benefit / lapse risk'],['Decision','Compare policy illustration and alternatives']],bottom:'Never assume borrowing is free, untaxed in every circumstance, or a shortcut to a mortgage down payment.'},
  {q:'What can happen to a permanent policy if a loan is not managed properly?',options:['Debt is always forgiven with no effect','Policy lapse or reduced benefit is possible','The policy becomes a savings account insured by FDIC','Mortgage interest stops'],answer:1,feedback:'Unpaid policy loans and interest may erode cash value, reduce proceeds, or contribute to lapse.'},['term']),
  S('L5.S2','Protecting a Home and a Family','Match coverage to real risks',
  'Property ownership introduces hazards: damage, liability, illness, loss of income, and death. Different insurance policies address different risks and exclusions.',
  [ ['Homeowners policy','May cover certain property losses and liability subject to limits, exclusions, and deductibles.'],['Flood insurance','Flood damage is commonly excluded from standard homeowners policies; separate protection may be needed.'],['Life insurance','May replace lost income or pay debts for surviving family members.'],['Disability coverage','May replace some income if disability prevents work, subject to definitions and limits.'],['Emergency reserves','Insurance does not replace accessible cash for deductibles, smaller repairs, and waiting periods.'] ],
  {title:'Start from what could go wrong',lines:[['Roof damage','Property insurance + deductible'],['Income lost','Income replacement plan'],['Death of earner','Beneficiary needs assessment'],['Unexpected repair','Cash reserves']],bottom:'The useful coverage is the coverage that pays for the particular loss—subject to the policy contract.'},
  {q:'Which statement about homeowners insurance is generally accurate?',options:['It covers every type of loss','It removes the need for emergency savings','It has terms, exclusions, and deductibles','It pays off every mortgage automatically'],answer:2,feedback:'Policy terms determine which losses are covered, how much is paid, and what you must pay yourself.'},['term','homeowner'])
 ]},
 {id:'M6',title:'Taxes & Advanced Strategies',short:'Learn the fine print',deck:'Understand how rules, incentives, and legal structures interact.',symbol:'⚖',sections:[
  S('L6.S1','Taxes: The Rules of the Game','Deduction is not a rebate',
  'A tax deduction can reduce income subject to tax under applicable rules. A tax credit can reduce tax liability more directly. Neither necessarily makes a purchase free.',
  [ ['Marginal rate','The rate applying to the next dollar of taxable income within a bracket.'],['Deduction','May reduce taxable income; its value depends on tax circumstances.'],['Credit','May reduce the tax owed, with different refundability and eligibility rules.'],['Tradeoff','Paying $1 solely to deduct a fraction of it still costs money.'] ],
  {title:'The $1,000 deduction example',lines:[['Qualifying deduction','$1,000'],['Illustrative marginal rate','22%'],['Potential federal tax reduction','$220'],['Net cost before other effects','$780']],bottom:'Simplified illustration; actual eligibility, itemization, limits, and state taxation change the outcome.'},
  {q:'At a hypothetical 22% marginal rate, what is the simplified tax value of a $1,000 deductible expense?',options:['$1,000','$780','$220','$22'],answer:2,feedback:'$1,000 × 22% = $220 in simplified income-tax savings if the deduction applies as assumed.'},['taxes']),
  S('L6.S2','The High-Stakes Fine Print','Where clever strategies go wrong',
  'A strategy involving property, a mortgage, insurance, a trust, and taxes must work under all of those systems—not just the one someone is advertising.',
  [ ['Financing documents','Review transfer, refinance, due-on-sale, assistance, and occupancy terms.'],['Tax treatment','Determine whose tax is affected, when tax applies, and what basis or reporting changes occur.'],['Estate planning','Confirm title, beneficiary designations, trust funding, and management instructions line up.'],['Benefit eligibility','Some programs count assets or trusts differently. Obtain specialized advice where public benefits are involved.'],['Written verification','Ask for contracts, independent legal/tax review, and a numerical comparison with simpler alternatives.'] ],
  {title:'Before saying yes to a strategy',lines:[['1. Benefit','What dollars could it save?'],['2. Cost','Fees, premiums, taxes, lost flexibility'],['3. Worst case','What could go wrong?'],['4. Authority','Where are the rules written?']],bottom:'If a salesperson cannot explain downside scenarios in plain language, that is a reason to slow down.'},
  {q:'Which is the best test of a sophisticated wealth strategy?',options:['It uses the most legal entities','It sounds tax-free','It works financially and legally after costs and risks','A stranger claims rich people use it'],answer:2,feedback:'A useful strategy survives full cash-flow, tax, legal, and downside analysis—not only a persuasive sales pitch.'},['chfa','irstrust','cfpb'])
 ]}
];
