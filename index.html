// A completed reading unit is NOT automatically a mastered unit. Mastery requires
// all 12 part questions and all 4 chapter checks answered with >=80% total and >=75% chapter.
function masteryFor(s){
 if(!TEXTBOOK[s.id])return {eligible:false,mastered:false,answered:0,total:0,correct:0};
 const id=s.id,parts=PART_CHECKS[id]||[],finals=TEXTBOOK_CHECKS[id]||[];
 let answered=0,correct=0,chapterAnswered=0,chapterCorrect=0;
 for(let p=0;p<parts.length;p++)for(let q=0;q<parts[p].length;q++){
  const value=state.partAnswers[id+':'+p+':'+q];
  if(value!==undefined){answered++;if(value===parts[p][q].answer)correct++}
 }
 const orig=state.quiz[id];if(orig!==undefined){answered++;chapterAnswered++;if(orig===s.quiz.answer){correct++;chapterCorrect++}}
 for(let i=0;i<finals.length;i++){
  const value=state.chapterAnswers[id+'#'+i];
  if(value!==undefined){answered++;chapterAnswered++;if(value===finals[i].answer){correct++;chapterCorrect++}}
 }
 const total=parts.reduce((n,a)=>n+a.length,0)+finals.length+1;
 const chapterTotal=finals.length+1,score=total?Math.round(correct/total*100):0;
 const ready=total>0&&answered===total;
 const mastered=ready&&score>=80&&chapterCorrect/chapterTotal>=.75;
 return {eligible:true,answered,correct,total,chapterAnswered,chapterCorrect,chapterTotal,score,mastered,ready};
}

function toolContent(){const c=state.calc,p=payment();if(state.tool==='mortgage')return `<div class="panel tool-panel"><span class="eyeline">TOOL 01 · COMPLETE MORTGAGE PAYMENT</span><h2 style="margin:9px 0">What does the house really cost?</h2><p class="muted small">Adjust the assumptions. This is not a mortgage quote.</p>${range('House price','price',150000,600000,5000,'money')}${range('Down payment','down',3,30,1,'percent')}${range('Illustrative fixed rate','rate',3,10,0.25,'percent')}${range('Mortgage term','years',15,30,15,'years')}${range('Monthly property taxes','tax',0,1200,25,'money')}${range('Homeowners insurance / month','insurance',50,500,10,'money')}${range('Mortgage insurance / month','pmi',0,250,5,'money')}${range('Maintenance reserve / month','maint',0,600,10,'money')}<div id="tool-live">${mortgageLive()}</div><p class="help">Property taxes and insurance vary. Mortgage insurance is a manual assumption, not a lender quote. HOA, utilities, and transaction costs are excluded.</p></div>`;
if(state.tool==='equity')return `<div class="panel tool-panel"><span class="eyeline">TOOL 02 · HOME EQUITY</span><h2 style="margin:9px 0">How much of the home is yours?</h2>${range('Estimated current value','value',100000,700000,10000,'money')}${range('Remaining mortgage','balance',0,650000,5000,'money')}<div id="tool-live">${equityLive()}</div><p class="help">This represents value minus the mortgage balance before selling fees, other liens, or taxes. Negative equity is possible.</p></div>`;

return `<div class="panel tool-panel"><span class="eyeline">TOOL 04 · AFFORDABILITY LENS</span><h2 style="margin:9px 0">Does the payment fit the budget?</h2>${range('Monthly take-home income','homeIncome',1000,12000,100,'money')}${range('Other monthly debt payments','homeDebt',0,2500,50,'money')}<div id="tool-live">${affordLive()}</div><p class="help">This is a cash-flow view, not a lender qualification or a debt-to-income calculation. Lenders generally evaluate gross income, credit, debts, assets, and program rules.</p></div>`}
function mortgageLive(){let p=payment();return `<hr class="divider"><div class="value-box"><div><div class="value-label">Estimated mortgage + escrow / month</div><div class="value-big">${money(p.total)}</div></div><div class="pill">${money(p.pr)} loan</div></div>${moneyBreakdown(p)}<div class="value-box"><div class="value-label">Including maintenance reserve</div><strong style="color:var(--gold);font-size:20px">${money(p.all)}/mo</strong></div><div class="value-box"><div class="value-label">Total scheduled interest over ${state.calc.years} years</div><strong>${money(p.interest)}</strong></div><div class="small-warning">A low advertised mortgage payment can leave out thousands in annual ownership expenses.</div>`}
function equityLive(){let c=state.calc,e=c.value-c.balance,pct=Math.max(0,Math.min(100,e/c.value*100));return `<hr class="divider"><div class="value-label">Estimated home equity</div><div class="value-big">${money(e)}</div><div class="breakdown"><span style="width:${pct}%;background:${COLORS[0]}"></span></div><p class="muted small">Equity as share of estimated value: ${pct.toFixed(1)}%. ${e<0?'The mortgage exceeds the estimated property value.':'Equity is not the same as cash available to spend.'}</p>`}
function investLive(){let c=compound();return `<hr class="divider"><div class="value-label">Illustrative future balance</div><div class="value-big">${money(c.total)}</div><div class="breakdown"><span style="width:${c.total?c.principal/c.total*100:0}%;background:#84aa9b"></span><span style="width:${c.total?c.gain/c.total*100:0}%;background:${COLORS[0]}"></span></div><div class="breakline"><span>Money contributed</span><strong>${money(c.principal)}</strong></div><div class="breakline"><span>Illustrative growth</span><strong>${money(c.gain)}</strong></div><div class="small-warning">Returns may be negative for extended periods. Fees, taxes, inflation and market timing alter actual outcomes.</div>`}
function affordLive(){let c=state.calc,p=payment(),remaining=c.homeIncome-p.all-c.homeDebt,share=p.all/c.homeIncome*100;return `<hr class="divider"><div class="value-label">Illustrative monthly housing cost + maintenance</div><div class="value-big">${money(p.all)}</div><div class="breakline"><span>Share of take-home pay</span><strong>${share.toFixed(1)}%</strong></div><div class="breakline"><span>Income left after housing and other debt</span><strong>${money(remaining)}</strong></div><p class="muted small">This leaves out food, transport, utilities, healthcare, and saving. Adjust mortgage assumptions under the Mortgage tool.</p>`}

function handleClick(e){const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.learnTab){state.learnTab=d.learnTab;if(d.learnTab==='all'){state.learnTopic='';state.learnCourse='';state.learnLevel='all'}render(false);return}if(d.learnLevelButton){state.learnTab='all';state.learnLevel=d.learnLevelButton;state.learnStatus='all';state.learnTopic='';state.learnCourse='';state.learnQuery='';render(false);return}if(d.learnStatus){state.learnStatus=d.learnStatus;render(false);return}if(d.learnTopic){state.learnTopic=d.learnTopic;state.learnCourse='';state.learnLevel='all';state.learnStatus='all';state.learnQuery='';state.learnTab='all';render(false);return}if(d.learnClearGroup!==undefined){state.learnCourse='';state.learnTopic='';render(false);return}if(d.learnFilterStatus){state.learnStatus=d.learnFilterStatus;state.learnCourse='';state.learnTopic='';state.learnLevel='all';state.learnTab='all';state.learnQuery='';render(false);return}if(d.learnShortcut){const lesson=SECTION_BY_ID[state.section]||bestNext();if(d.learnShortcut==='tools'){state.view='tools';render();return}if(d.learnShortcut==='practice'){routeSection(lesson.id,'Try It');return}if(d.learnShortcut==='cases'){routeSection(lesson.id,'Examples');return}routeSection(lesson.id,'Learn');return}if(d.go==='practice'){routeSection((SECTION_BY_ID[state.section]||bestNext()).id,'Try It');return}if(d.go){state.view=d.go;render();return}if(d.module){routeModule(d.module);return}if(d.section){routeSection(d.section,d.tabNext||'Learn');return}if(d.tab){state.tab=d.tab;render(false);return}if(d.tool){state.tool=d.tool;render(false);return}if(d.filter){state.noteFilter=d.filter;render(false);return}if(d.chat){chatDialog(d.chat);return}if(d.chapterPage!==undefined){let id=activeSection().id,chapter=TEXTBOOK[id];if(chapter){let n=Number(d.chapterPage);if(Number.isInteger(n)&&n>=0&&n<chapter.pages.length){state.chapterPages[id]=n;render(false);document.querySelector('#textbook-reading')?.scrollIntoView({block:'start',behavior:'instant'});}}return}if(d.partCheck!==undefined){const s=activeSection(),page=textbookPageIndex(s),questions=PART_CHECKS[s.id]?.[page]||[],idx=Number(d.partCheck),choice=Number(d.partChoice);if(Number.isInteger(idx)&&Number.isInteger(choice)&&questions[idx]&&choice>=0&&choice<questions[idx].options.length){state.partAnswers[partAnswerKey(s,page,idx)]=choice;persist();const region=document.querySelector('.part-quiz');if(region)region.outerHTML=partExercises(s,page);const counter=document.querySelector('.book-counter span');if(counter)counter.textContent=Math.round((page+1)/TEXTBOOK[s.id].pages.length*100)+'% through chapter · '+partScore(s,page).correct+'/'+partScore(s,page).total+' practice correct';}return}if(d.chapterAnswer!==undefined){let id=activeSection().id,q=TEXTBOOK_CHECKS[id]?.[Number(d.chapterAnswer)];if(q){state.chapterAnswers[id+'#'+Number(d.chapterAnswer)]=Number(d.chapterChoice);persist();const el=document.querySelector('.textbook-practice');if(el)el.outerHTML=textbookPractice(activeSection());}return}if(d.localCopy){localChatCopy(d.localCopy);return}if(d.answer!==undefined){let s=activeSection();state.quiz[s.id]=Number(d.answer);persist();const parent=t.closest('.article');if(parent){parent.outerHTML=articlePractice(s)}return}if(!d.action)return;switch(d.action){case 'complete':{let s=activeSection();state.completed[s.id]=!state.completed[s.id];render(false);toast(state.completed[s.id]?'Section complete.':'Section marked as incomplete.');break}case 'bookmark':{let id=activeSection().id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];render(false);toast(state.bookmarks.includes(id)?'Bookmarked.':'Bookmark removed.');break}case 'font':{state.font=state.font===16?18:state.font===18?20:16;render(false);toast('Reading text set to '+state.font+'px');break}case 'copy-chat':doChatCopy();break;case 'state-chat':stateChatCopy();break;case 'local-apply':{for(const e of document.querySelectorAll('[data-local-input]')){state.localAreas[e.dataset.localInput]=e.value.trim().slice(0,90)}persist();render(false);toast('Local research areas saved. Expand the local results within each state.');break}case 'state-swap':{if(state.stateCode&&state.compareStateCode&&state.stateCode!==state.compareStateCode){const tmp=state.stateCode;state.stateCode=state.compareStateCode;state.compareStateCode=tmp;render(false);toast('State A and State B swapped.')}break}case 'state-clear-compare':{state.compareStateCode='';render(false);toast('Single-state view restored.');break}case 'state-to-mortgage':state.tool='mortgage';state.view='tools';render();break;case 'close-chat':$('#chatDialog')?.remove();break;case 'export':exportBackup();break;case 'import':$('#importFile')?.click();break;case 'reset':{if(window.confirm('Remove ALL saved notes, bookmarks, and progress from this browser? Export a backup first.')){localStorage.removeItem(STORE);state=clone(defaults);render();toast('Local learning data cleared.')}break}case 'resources':state.view='more';render();setTimeout(()=>$('.panel a')?.scrollIntoView({behavior:'smooth',block:'center'}),80);break;}}
$('#app').addEventListener('click',handleClick);
document.addEventListener('click',e=>{if(e.target.id==='chatDialog')$('#chatDialog')?.remove();if(e.target.closest('#chatDialog'))handleClick(e)});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.localInput){state.localAreas[t.dataset.localInput]=t.value.slice(0,90);persist()}else if(t.dataset.range){state.calc[t.dataset.range]=Number(t.value);persist();refreshTool()}else if(t.dataset.note){state.notes[t.dataset.note]=t.value;persist()}else if(t.hasAttribute('data-learn-search')){state.learnQuery=t.value;persist();wlLearnRefreshSearch()}else if(t.hasAttribute('data-search')){state.search=t.value;persist();/* Preserve cursor: filter matching note cards in place. */for(let card of document.querySelectorAll('.note-card')){let text=card.innerText.toLowerCase();card.style.display=text.includes(state.search.toLowerCase())?'':'none'}}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-learn-level')){state.learnLevel=e.target.value;render(false)}else if(e.target.hasAttribute('data-learn-sort')){state.learnSort=e.target.value;render(false)}else if(e.target.id==='importFile'){importBackup(e.target.files[0]);e.target.value=''}else if(e.target.dataset.statePick==='state-primary'){state.stateCode=e.target.value;persist();render(false)}else if(e.target.dataset.statePick==='state-compare'){state.compareStateCode=e.target.value;persist();render(false)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// Deep link to a lesson: index.html#L2.S3
const hash=decodeURIComponent(location.hash.slice(1));if(SECTION_BY_ID[hash]){state.section=hash;state.module=moduleOf(hash).id;state.tab='Learn';state.view='reader'}else if(hash==='states'){state.view='states'}
render(false);
})();
