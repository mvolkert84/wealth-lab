const ACADEMY_MODULES=[{"id":"M7","title":"Economics & Financial Math","short":"Know why prices, credit and markets move","deck":"Money, policy, growth, and calculation skills behind financial advice.","level":1,"symbol":"◇","lessons":[{"id":"L7.S1","title":"Inflation and Real Wealth","subtitle":"Why nominal dollars can mislead","lead":"Inflation means the general price level rises; future money can buy less even if the number of dollars grows.","points":[["Nominal return","The percentage increase before adjusting for inflation."],["Real return","Purchasing-power growth, approximately nominal return minus inflation for small rates."],["CPI","A price index for a basket of consumer goods and services, not a perfect index of your household."],["Planning implication","A future retirement balance has to support future prices, not today’s prices."]],"example":{"title":"Work through the numbers","lines":[["Savings starting value","$10,000"],["One-year nominal gain at 5%","$500"],["One-year inflation at 3%","About 3%"],["Approx. real growth","About 1.94%"]],"bottom":"Exact real return is (1.05 / 1.03) − 1 = about 1.94%; a 5% bank interest rate is not 5% additional buying power."},"quiz":{"q":"At a 5% nominal return and 3% inflation, what is the closest exact real return?","options":["5.00%","3.00%","1.94%","8.00%"],"answer":2,"feedback":"(1.05/1.03)−1 ≈ 1.94%; subtracting gives a useful approximation of 2%."},"academy":{"study":"Imagine $50,000 needed for tuition today. With 3% inflation for ten years it would cost approximately $67,196. A savings plan that ignores changing prices can fall behind even while its balance increases.","pitfall":"Inflation is not uniform; homeowners insurance, medical bills, and food may move differently from the headline CPI. Do not assume investments will beat inflation in any particular year.","assignment":"Estimate a future cost for a home repair using 2%, 3% and 5% annual inflation. Compare the amounts.","level":1,"minutes":18},"sourceKeys":["investor"]},{"id":"L7.S2","title":"Rates, Central Banks & Bonds","subtitle":"How the cost of money moves through the economy","lead":"Central-bank policy, lender funding costs, inflation expectations and risk influence interest rates, but do not determine every mortgage or savings quote.","points":[["Policy rate","A short-term rate target used by the Federal Reserve to influence financial conditions."],["Yield curve","Rates across maturities; long-term bond yields reflect expectations and term/risk premiums."],["Credit spread","Extra yield a riskier borrower pays over a benchmark."],["Transmission","Higher rates can make borrowing costly and may slow spending and investment."]],"example":{"title":"Work through the numbers","lines":[["Illustrative principal","$200,000"],["Loan A at 6% / 30 years","About $1,199 monthly P&I"],["Loan B at 7% / 30 years","About $1,331 monthly P&I"],["Monthly difference","About $132"]],"bottom":"A one-percentage-point rate change affects monthly affordability and long-run interest costs; taxes and insurance are additional."},"quiz":{"q":"Which change generally raises a fixed-rate new mortgage payment when other terms stay equal?","options":["A smaller principal","A lower interest rate","A longer term","A higher interest rate"],"answer":3,"feedback":"For the same principal and term, a higher rate requires a larger payment."},"academy":{"study":"Mortgage pricing is not set by a single official number. Investors buying mortgage bonds, inflation expectations, property and borrower risk, and lender margins all matter. Compare Loan Estimates on the same day using the same assumptions.","pitfall":"A shorter loan term may have a lower rate but a higher payment; never decide based on the advertised rate alone.","assignment":"Model a $250,000 mortgage at 5%, 6% and 7% over 30 years and explain the payment and interest differences.","level":1,"minutes":18},"sourceKeys":["cfpb","payment"]},{"id":"L7.S3","title":"The Time Value of Money","subtitle":"A dollar now versus later","lead":"A dollar available today can be invested or used to avoid borrowing; future cash flows must be compared using the same reference date.","points":[["Present value","What future money is worth today at a given discount rate."],["Future value","How money grows after a specified return and period."],["Discount rate","Rate reflecting opportunity cost and risk; choosing it matters."],["Compounding frequency","How often growth is applied changes final results."]],"example":{"title":"Work through the numbers","lines":[["Future payment","$10,000"],["Years until payment","5"],["Illustrative discount rate","5%"],["Present value","About $7,835"]],"bottom":"Present value = $10,000 / 1.05^5. A promised $10,000 in five years is not equivalent to $10,000 cash today."},"quiz":{"q":"What is the approximate present value of $10,000 in five years discounted at 5% yearly?","options":["$7,835","$10,500","$12,763","$5,000"],"answer":0,"feedback":"10,000 divided by 1.05 to the fifth power is about 7,835."},"academy":{"study":"The same tool helps compare buying now versus saving longer, life insurance premiums versus future benefits, and a rental property’s expected net receipts. When cash flows are risky, a low discount rate may be misleading.","pitfall":"Present value is a model, not a guarantee. Investors can use unrealistic discount assumptions to make expensive investments seem cheap.","assignment":"Calculate the present value of $20,000 received in 10 years at 3%, 6%, and 9%; explain the range.","level":1,"minutes":18},"sourceKeys":["investor"]},{"id":"L7.S4","title":"Economic Indicators and Cycles","subtitle":"GDP, jobs, recessions and expectations","lead":"An economy can grow while some households struggle, and markets price expectations rather than simply reacting to yesterday’s headline.","points":[["GDP","A measure of total output, not a report card on personal welfare."],["Unemployment","Share of the labor force without jobs and looking for work; it omits some forms of underemployment."],["Leading vs lagging","Some measures anticipate activity while others reflect conditions after they occur."],["Market response","A positive economic report may still hurt stocks if it implies tighter policy than investors expected."]],"example":{"title":"Work through the numbers","lines":[["Portfolio starting value","$20,000"],["Market falls 20%","− $4,000"],["Value after drop","$16,000"],["Gain needed to recover","25%"]],"bottom":"To return from $16,000 to $20,000 requires $4,000 / $16,000 = 25%. Declines and recoveries are mathematically asymmetric."},"quiz":{"q":"After a 20% loss, what percentage gain restores the portfolio to its original value?","options":["20%","25%","10%","40%"],"answer":1,"feedback":"A gain of 4,000 on the remaining 16,000 is 25%."},"academy":{"study":"Advisers use broad indicators to understand risks, but precise market timing is very difficult. A long-term plan should survive multiple business cycles and avoid relying on one prediction.","pitfall":"Headlines are not a strategy. A rapidly growing economy does not prove every stock is attractively priced.","assignment":"Find a GDP, inflation, and employment report from official sources and explain how each might influence a fixed-rate borrower.","level":1,"minutes":18},"sourceKeys":["investor"]}]},{"id":"M8","title":"Stock Markets & Company Analysis","short":"Read businesses instead of guessing prices","deck":"Ownership, company filings, earnings quality, valuation and dividends.","level":2,"symbol":"◇","lessons":[{"id":"L8.S1","title":"What a Stock Actually Owns","subtitle":"Equity shares, rights and risk","lead":"Buying common stock gives you a residual ownership interest in a business, not a guaranteed savings balance.","points":[["Common stock","Residual ownership after creditors; shareholders may vote and receive dividends."],["Market capitalization","Share price multiplied by shares outstanding."],["Volatility","Market prices can move without the business’s operations changing by the same amount."],["Concentration","One company can fail; diversification reduces company-specific exposure."]],"example":{"title":"Work through the numbers","lines":[["Shares outstanding","10 million"],["Price per share","$40"],["Market capitalization","$400 million"],["Your shares","25 (0.00025% ownership)"]],"bottom":"Market cap measures market value of equity, not the company’s bank cash or enterprise value."},"quiz":{"q":"A company has 10 million shares at $40 each. What is its market capitalization?","options":["$40 million","$400 million","$4 billion","$10 million"],"answer":1,"feedback":"Ten million shares multiplied by $40 each equals $400 million."},"academy":{"study":"A stock can produce gains through price changes and cash dividends. Shareholders are last in line if the firm is liquidated. Learn what you own before evaluating what price to pay.","pitfall":"A cheap share price does not mean a cheap business; share count matters. A $5 stock can be more richly valued than a $500 stock.","assignment":"Choose a public company and identify its ticker, total shares, market cap and latest Form 10-K.","level":2,"minutes":18},"sourceKeys":["investor"]},{"id":"L8.S2","title":"Reading the Three Statements","subtitle":"Profit is not the same as cash","lead":"Business analysis starts with an income statement, balance sheet, and cash flow statement; each answers a different question.","points":[["Income statement","Revenue minus expenses over a period leads to net income."],["Balance sheet","Assets = liabilities + equity at a point in time."],["Cash flow statement","Operating, investing and financing cash movements over the period."],["Free cash flow","Commonly operating cash flow less capital expenditure; definitions can vary."]],"example":{"title":"Work through the numbers","lines":[["Sales","$1,000,000"],["Operating expenses","− $800,000"],["Net income (simplified)","$200,000"],["Operating cash flow","$120,000"]],"bottom":"The $80,000 gap prompts research into receivables, inventories and noncash accounting items; it does not automatically prove fraud."},"quiz":{"q":"Which report shows a company’s financial position at one date?","options":["Income statement","Balance sheet","Cash flow statement","Statement of returns"],"answer":1,"feedback":"The balance sheet is a snapshot of assets, liabilities and equity on the reporting date."},"academy":{"study":"Imagine a manufacturer books sales on credit but has not collected cash. Its income statement may look strong while payroll and inventory drain available cash. Read the notes to statements, too.","pitfall":"Net income can include noncash expenses and estimated accruals; do not treat it as the same thing as cash in the bank.","assignment":"Download a public company 10-K and find revenue, net income, operating cash flow, total debt and cash.","level":2,"minutes":18},"sourceKeys":["investor"]},{"id":"L8.S3","title":"Valuing a Stock","subtitle":"Price is what you pay; value is an estimate","lead":"Investors use earnings, cash flow and growth expectations to estimate value. Every valuation depends on uncertain assumptions.","points":[["P/E ratio","Share price divided by earnings per share; meaningful only with appropriate earnings."],["Earnings yield","Earnings per share divided by share price; the reciprocal of a positive P/E."],["Enterprise value","Approximate total business value considering debt and cash, not just common stock."],["Margin of safety","Buying below a reasoned valuation estimate may provide a cushion, but not certainty."]],"example":{"title":"Work through the numbers","lines":[["Share price","$60"],["Annual earnings/share","$3"],["P/E ratio","20×"],["Earnings yield","5%"]],"bottom":"A 20× P/E is a price-to-earnings relationship, not a guaranteed 5% investment return."},"quiz":{"q":"A stock trades at $60 and earns $3 per share. What is its P/E?","options":["10×","15×","20×","30×"],"answer":2,"feedback":"Price divided by earnings per share: 60/3 = 20 times earnings."},"academy":{"study":"Two firms both trading at 20 times earnings can differ sharply in debt, revenue growth, cash flow quality and competitive threats. Compare businesses, not just headline multiples.","pitfall":"A low P/E can reflect deteriorating earnings. A high P/E can be a warning or reflect optimistic growth expectations. Neither alone decides value.","assignment":"Choose two companies in the same industry and compare P/E, debt, cash flow, and reasons for differing valuations.","level":2,"minutes":18},"sourceKeys":["investor"]},{"id":"L8.S4","title":"Dividends, Buybacks and Returns","subtitle":"Cash distributions versus share price movement","lead":"Shareholder return can come from dividends, changing prices or both; a company can also reinvest cash instead of distributing it.","points":[["Dividend yield","Annual dividends per share divided by current share price."],["Total return","Price change plus cash distributions, with assumptions about reinvestment."],["Buyback","Company repurchases stock, potentially changing shares outstanding."],["Ex-dividend date","A key date in determining which shareholders receive a declared dividend."]],"example":{"title":"Work through the numbers","lines":[["Initial share price","$50"],["Ending share price","$54"],["Cash dividend","$1.50"],["Simple holding-period return","11%"]],"bottom":"($54 − $50 + $1.50) / $50 = 11% before trading costs and taxes."},"quiz":{"q":"A stock rises from $50 to $54 and pays $1.50. What is its one-period simple total return?","options":["8%","11%","3%","15%"],"answer":1,"feedback":"Total dollar gain is $5.50 and $5.50/$50 = 11%."},"academy":{"study":"High dividend yield may look attractive but can rise because the stock price collapses. Examine whether earnings and cash flow support payments and whether the company needs capital for growth.","pitfall":"A dividend is not free money that appears in addition to an unchanged company value; ex-dividend pricing and taxes matter.","assignment":"Compare a growth stock and a dividend stock for a long-term account versus a taxable account.","level":2,"minutes":18},"sourceKeys":["investor","irs_cap"]}]},{"id":"M9","title":"Bonds, Funds & Alternatives","short":"Understand what each product pays and risks","deck":"Fixed income, fund structures, property exposure, and complex products.","level":2,"symbol":"◇","lessons":[{"id":"L9.S1","title":"Bonds and Yield","subtitle":"Lending money through securities","lead":"A bond typically promises interest and principal subject to issuer and contractual risks; its price changes as market yields move.","points":[["Coupon","Cash interest defined by the bond, often stated as a percentage of face value."],["Yield to maturity","A rate estimate incorporating purchase price and promised cash flows if held to maturity and payments occur."],["Duration","Sensitivity of a bond’s price to changes in yields."],["Credit risk","Issuer may pay late, default or restructure obligations."]],"example":{"title":"Work through the numbers","lines":[["Face value","$1,000"],["Annual coupon at 4%","$40"],["Market price","$950"],["Current yield","About 4.21%"]],"bottom":"Current yield = 40/950 ≈ 4.21%; yield to maturity also considers the gap between market price and principal repaid."},"quiz":{"q":"A $1,000 bond pays $40 annually and trades at $950. Approximately what is current yield?","options":["4.00%","4.21%","5.26%","9.50%"],"answer":1,"feedback":"Annual coupon divided by market price: 40/950 ≈ 4.21%."},"academy":{"study":"When interest rates rise, existing fixed-rate bonds generally fall in market price. Holding a default-free individual bond to maturity can be very different from needing to sell early.","pitfall":"Bond funds do not necessarily mature on a date when your original principal is returned. Do not equate all bonds with a bank deposit.","assignment":"Model a coupon payment and compare what happens if the bond is bought above or below face value.","level":2,"minutes":18},"sourceKeys":["investor"]},{"id":"L9.S2","title":"Savings, CDs and Treasuries","subtitle":"Where short-term money belongs","lead":"An emergency fund and a near-term down payment need liquidity and capital preservation more than an exciting projected return.","points":[["Insured bank deposits","FDIC or NCUA rules may protect deposits within applicable limits."],["CD","Deposit with a term and potential early withdrawal penalty."],["Treasury bills","Short-dated U.S. government obligations purchased at discount or otherwise auctioned."],["Money market fund","Investment fund, generally not FDIC-insured even when sold through a bank."]],"example":{"title":"Work through the numbers","lines":[["Savings held","$10,000"],["Illustrative annual yield","4%"],["Simple one-year interest","$400"],["Illustrative income tax at 22%","$88"]],"bottom":"After $88 tax on $400 of taxable interest the example retains $312; actual tax depends on taxpayer and account."},"quiz":{"q":"Which choice is generally an investment fund rather than an insured bank deposit?","options":["FDIC-insured checking account","NCUA-insured savings account","Money market mutual fund","FDIC-insured CD"],"answer":2,"feedback":"A money market mutual fund is a security rather than a bank deposit, so deposit insurance does not apply to it."},"academy":{"study":"Cash is an asset class with a purpose: availability when you need it. For someone buying within a year, stock-market losses could be more harmful than missing upside.","pitfall":"Compare after-tax yields and terms, not just headline APY. Municipal and Treasury interest can have different federal/state treatments.","assignment":"Find the published deposit insurance rules and build an emergency fund placement plan using three account options.","level":2,"minutes":18},"sourceKeys":["investor","irs_cap"]},{"id":"L9.S3","title":"ETFs, Mutual Funds and Indexes","subtitle":"Diversification with a single holding","lead":"Pooled funds give investors an interest in a portfolio, but the name of a fund does not prove it is diversified or low cost.","points":[["Index fund","Attempts to track a specified market index rather than select stocks one by one."],["ETF","Exchange-traded fund bought and sold during market hours; trading spread and price-to-NAV matter."],["Mutual fund","Fund generally bought or redeemed at end-of-day net asset value."],["Expense ratio","Annual fund operating expense expressed as a percentage of assets."]],"example":{"title":"Work through the numbers","lines":[["Initial portfolio","$20,000"],["Fund A fee at 0.10%","$20 / year initially"],["Fund B fee at 1.00%","$200 / year initially"],["Initial annual fee gap","$180"]],"bottom":"With compounding, higher ongoing expenses can meaningfully widen the performance gap over long periods."},"quiz":{"q":"On $20,000, what is the initial annual fee at a 1% expense ratio?","options":["$20","$100","$200","$2,000"],"answer":2,"feedback":"1% of $20,000 is $200; the charge is generally reflected in fund performance, not necessarily a bill."},"academy":{"study":"A fund tracking 500 companies may still be concentrated in a few large names. Compare holdings, geography, stock/bond exposure, fee, trading costs, and the account used.","pitfall":"An ETF is a wrapper, not a guarantee of safety. A leveraged or single-sector ETF can be much riskier than a broad index fund.","assignment":"Compare two ETFs for asset allocation, expense ratio, underlying index, top holdings, and tax considerations.","level":2,"minutes":18},"sourceKeys":["investor","diversify"]},{"id":"L9.S4","title":"REITs, Annuities and Alternatives","subtitle":"The tradeoffs of less familiar investments","lead":"Some products promise property exposure, retirement income or nontraditional returns; their liquidity, expenses and complexity differ widely.","points":[["REIT","Real estate investment trust holding income-producing real estate or financing."],["Annuity","Insurance contract with terms for accumulation and/or future payments."],["Private investments","May have limited reporting, restrictions, fees and long lockups."],["Liquidity risk","You may be unable to sell quickly without losing value or paying a penalty."]],"example":{"title":"Work through the numbers","lines":[["Investment principal","$50,000"],["Hypothetical annual distribution","$2,000"],["Cash distribution yield","4%"],["Capital change","Unknown"]],"bottom":"A 4% distribution does not establish a 4% total return; principal can rise or fall and some distributions can be return of capital."},"quiz":{"q":"A fund distributes $2,000 on a $50,000 investment. What does that prove?","options":["4% total profit","4% cash-distribution ratio","No loss of principal","A guaranteed return"],"answer":1,"feedback":"The distribution is 4% of the stated amount; total return requires price change, fees and possibly tax details."},"academy":{"study":"An investor can own real estate through a public REIT without handling tenants, yet may still experience public-market volatility. An annuity can address income longevity but may introduce surrender charges and complex riders.","pitfall":"A high advertised payout is not proof of high economic return. Ask how much is investment profit versus your own principal coming back.","assignment":"Pick one REIT and one annuity illustration and list liquidity, fees, tax treatment, ownership and counterparty risk.","level":2,"minutes":18},"sourceKeys":["investor","term"]}]},{"id":"M10","title":"Portfolio Design & Risk","short":"Turn investments into a coherent strategy","deck":"Allocation, statistical risks, fees, rebalancing and investment policy.","level":2,"symbol":"◇","lessons":[{"id":"L10.S1","title":"Asset Allocation and Goal Buckets","subtitle":"Different money deserves different risk","lead":"A portfolio should be built from goals, time horizon, cash needs and ability to endure losses—not the most exciting past return.","points":[["Asset allocation","How funds are divided across stocks, bonds, cash and other exposures."],["Time horizon","How soon money may need to be spent."],["Risk capacity","Financial ability to absorb a decline without missing obligations."],["Risk tolerance","Emotional willingness to face market losses; different from capacity."]],"example":{"title":"Work through the numbers","lines":[["Total investments","$40,000"],["Stock allocation 70%","$28,000"],["Bond allocation 20%","$8,000"],["Cash allocation 10%","$4,000"]],"bottom":"A 70/20/10 allocation describes exposure but must be justified by needs and risk—not treated as a universal formula."},"quiz":{"q":"At 70% stocks, how much of a $40,000 portfolio is in stocks?","options":["$7,000","$12,000","$28,000","$35,000"],"answer":2,"feedback":"0.70 × $40,000 = $28,000."},"academy":{"study":"A home purchase in 12 months and retirement in 25 years are different goals. It can make sense to hold them in different asset mixes even for the same person.","pitfall":"The popular phrase “stocks average X%” is not a promise; short-horizon losses can be severe.","assignment":"Create three buckets: emergency, house purchase, and long-term wealth. Specify horizon, liquidity and allowable drawdown.","level":2,"minutes":18},"sourceKeys":["diversify"]},{"id":"L10.S2","title":"Diversification and Correlation","subtitle":"What several holdings do together","lead":"A portfolio can own many securities yet still depend heavily on one risk factor; what matters is how exposures move together.","points":[["Systematic risk","Market-wide risk not eliminated simply by owning more individual shares."],["Specific risk","Company or sector exposures that diversification may reduce."],["Correlation","A measure of how asset returns move together, from −1 to +1."],["Concentration","A fund, employer stock or leveraged property can create hidden large exposures."]],"example":{"title":"Work through the numbers","lines":[["Fund A equities","60%"],["Fund B equities (same index)","40%"],["Total equity market exposure","100%"],["True diversification gain","Very limited"]],"bottom":"Two funds tracking the same index are not meaningfully diversified simply because they have different tickers."},"quiz":{"q":"A person holds two ETFs tracking the exact same index. What is the main issue?","options":["Funds are always tax-free","They may overlap almost completely","The funds guarantee gains","The investor has no equity risk"],"answer":1,"feedback":"Funds tracking the same market can hold nearly identical companies and leave overall exposure unchanged."},"academy":{"study":"Review the top ten holdings of each ETF. If both have the same large positions, the asset-allocation chart can look more varied than the actual business exposures.","pitfall":"Correlation changes during crises; diversification reduces some risks but cannot eliminate market losses.","assignment":"Draw a portfolio with five investments and identify overlapping industries, geography, and employer/income risks.","level":2,"minutes":18},"sourceKeys":["diversify"]},{"id":"L10.S3","title":"Rebalancing and Costs","subtitle":"Why disciplined adjustments matter","lead":"As prices move, portfolio weights drift; rebalancing restores your intended mix but can trigger taxes, trading costs and missed gains.","points":[["Drift","Actual asset weights move away from desired weights as returns differ."],["Rebalancing","Buy or sell exposures to return toward targets."],["Tax awareness","Selling appreciated holdings in taxable accounts may realize gains."],["Contribution method","New deposits can help correct drift without selling existing assets."]],"example":{"title":"Work through the numbers","lines":[["Initial portfolio","$10,000"],["Target stocks / bonds","60% / 40%"],["Later stocks / bonds","$8,000 / $4,000"],["Later stock percentage","66.7%"]],"bottom":"The total is now $12,000; target stocks are $7,200. Selling $800 in stocks and buying bonds would restore 60/40, before costs/taxes."},"quiz":{"q":"If stocks are $8,000 and bonds $4,000, what fraction of the portfolio is stocks?","options":["60%","66.7%","75%","80%"],"answer":1,"feedback":"8,000 / 12,000 = 66.7%."},"academy":{"study":"Periodic or threshold-based rebalancing is a process decision, not an attempt to predict tomorrow’s winner. Contributions and tax-advantaged accounts may simplify it.","pitfall":"Trading too frequently can incur costs and taxable events; rebalancing is not an automatic return booster.","assignment":"Compare annual rebalancing with a five-percentage-point drift threshold and describe tax implications.","level":2,"minutes":18},"sourceKeys":["diversify","irs_cap"]},{"id":"L10.S4","title":"Building an Investment Policy","subtitle":"Rules before emotions","lead":"An investment policy statement is a simple set of written rules connecting goals, allocation, risk, deposits, and review habits.","points":[["Goal","Identify amount needed, deadline and purpose."],["Constraints","Liquidity, taxes, restrictions, emergency reserves, debt and ethics."],["Implementation","Accounts, asset mix, low-cost vehicles, contributions and rebalancing thresholds."],["Review","Regular checks when life changes—not reacting to every market headline."]],"example":{"title":"Work through the numbers","lines":[["Emergency fund","$8,000"],["House fund target","$20,000 in 24 months"],["Retirement contribution","$250 per month"],["Review cadence","Every 6 months"]],"bottom":"The policy should specify which investments serve which goal and what actions are triggered by a major life change."},"quiz":{"q":"What belongs in an investment policy statement?","options":["Only last year’s top stocks","Goals, constraints and rebalancing rules","A guaranteed market forecast","A single favorite asset"],"answer":1,"feedback":"A useful policy defines measurable goals, constraints and an implementation/review process."},"academy":{"study":"Professional portfolio construction begins by understanding the person and the goal. A brilliant fund choice can be wrong for money needed for a down payment soon.","pitfall":"Risk questionnaires are imperfect. Financial capacity, willingness and the consequences of loss require conversation and scenario testing.","assignment":"Write a one-page investment policy for a hypothetical household saving for a home and retirement simultaneously.","level":2,"minutes":18},"sourceKeys":["diversify"]}]},{"id":"M11","title":"Income & Investment Taxes","short":"Understand the mechanics before strategies","deck":"Taxable income, brackets, gains, losses and federal-state differences.","level":3,"symbol":"◇","lessons":[{"id":"L11.S1","title":"From Income to Tax","subtitle":"Learn the structure of a return","lead":"Federal tax is calculated using income classification, adjustments, deductions, credits and several special rules; not all dollars face one rate.","points":[["Gross income","Starting categories such as wages, interest, dividends or business income."],["Adjusted gross income","Income after certain permitted adjustments."],["Taxable income","Amount after applicable deductions; exclusions and rules matter."],["Credits","Often reduce tax owed dollar for dollar, subject to limitations."]],"example":{"title":"Work through the numbers","lines":[["Illustrative gross income","$70,000"],["Illustrative adjustments","− $3,000"],["Illustrative deductions","− $15,000"],["Simplified taxable income","$52,000"]],"bottom":"This shows structure, not current-year filing law; real deductions, thresholds and tax calculations require the correct tax year and filing status."},"quiz":{"q":"A $1,000 nonrefundable tax credit, where fully usable, generally changes federal tax liability by how much?","options":["$100","$1,000","$10,000","$0"],"answer":1,"feedback":"A fully usable $1,000 credit ordinarily reduces tax liability by $1,000."},"academy":{"study":"Effective tax rate is total tax divided by a chosen income measure; the marginal rate applies to the next taxable dollar in its bracket. They are not interchangeable concepts.","pitfall":"Deductions reduce taxable income, while credits reduce computed tax. A $1,000 deduction does not usually save $1,000 in taxes.","assignment":"Sketch a federal tax return flow from wages and interest to AGI, deductions, taxable income and credits.","level":3,"minutes":18},"sourceKeys":["taxes"]},{"id":"L11.S2","title":"Marginal vs Effective Tax Rate","subtitle":"Why brackets do not swallow all income","lead":"Progressive federal brackets apply different rates to portions of taxable income; moving into a higher bracket generally does not re-tax all earlier income at that rate.","points":[["Marginal rate","Rate on the next dollar of taxable ordinary income, subject to special rules."],["Effective rate","Total tax divided by income, using a clearly stated income definition."],["Tax bracket","Band of taxable income taxed at a specified marginal rate."],["Tax planning","Control timing, deductions, credits and account types legally—not simply avoid any higher bracket."]],"example":{"title":"Work through the numbers","lines":[["Hypothetical first $20,000 taxed at 10%","$2,000"],["Next $10,000 taxed at 20%","$2,000"],["Total taxable income","$30,000"],["Total tax in toy example","$4,000"]],"bottom":"Average effective rate on that simplified $30,000 taxable income is 13.3%; last dollar is taxed at 20%. These are made-up brackets for teaching."},"quiz":{"q":"With a toy system charging 10% on first $20k and 20% on next $10k, tax on $30k is:","options":["$3,000","$4,000","$6,000","$5,000"],"answer":1,"feedback":"$2,000 + $2,000 = $4,000. The higher rate only applies to the top layer."},"academy":{"study":"This distinction matters when deciding whether to take more work, convert retirement dollars, realize investment income or defer a business payment. Some benefits and special rules create additional effects.","pitfall":"Tax brackets change with tax year and filing status. Never reuse old brackets for actual tax filing.","assignment":"Draw a staircase illustration of a progressive tax system and calculate marginal and effective rates at three incomes.","level":3,"minutes":18},"sourceKeys":["taxes"]},{"id":"L11.S3","title":"Capital Gains, Basis & Dividends","subtitle":"Selling an asset can create a taxable event","lead":"A stock’s sale proceeds minus adjusted tax basis determines realized gain or loss; holding period, account type and special rules affect taxes.","points":[["Cost basis","Generally what you paid, adjusted for applicable events and rules."],["Realized gain","Typically proceeds less adjusted basis when sold."],["Holding period","Can distinguish short-term and long-term capital transactions."],["Dividend income","Dividends may be taxable even if automatically reinvested in a taxable account."]],"example":{"title":"Work through the numbers","lines":[["Shares purchased","10 at $50"],["Original basis","$500"],["Shares sold","10 at $70"],["Illustrative realized gain","$200"]],"bottom":"Realized gain is $700 proceeds minus $500 basis. The tax rate is NOT necessarily your ordinary rate, especially for long-term gains."},"quiz":{"q":"What is realized gain when an investment with $500 adjusted basis sells for $700 before fees?","options":["$500","$700","$200","$1,200"],"answer":2,"feedback":"Proceeds of $700 less basis of $500 equals $200."},"academy":{"study":"Stocks inside an IRA and stocks in a regular brokerage account are subject to different timing and reporting rules. Reinvested taxable dividends may also increase basis in newly purchased shares.","pitfall":"An unrealized gain usually differs from a realized sale for income-tax timing. Estate/inheritance basis rules can change the eventual result; learn them separately.","assignment":"Create a three-lot share purchase log and work out potential gain on the sale of selected lots.","level":3,"minutes":18},"sourceKeys":["irs_cap"]},{"id":"L11.S4","title":"Tax-Loss Harvesting and State Taxes","subtitle":"Legal tax planning has constraints","lead":"A loss may help offset certain gains and limited ordinary income, but wash-sale and basis rules can affect whether and when the loss counts.","points":[["Tax-loss harvesting","Realizing investment losses for possible tax benefits while preserving an appropriate portfolio."],["Wash sale","Certain purchases of substantially identical securities within the statutory window can defer a loss."],["Federal vs state","Different jurisdictions may treat retirement income, interest, gains or credits differently."],["Location","Property taxes, transfer taxes and local benefits can outweigh a narrow income-tax advantage."]],"example":{"title":"Work through the numbers","lines":[["Security purchased","$5,000"],["Sold for","$4,000"],["Realized capital loss","$1,000"],["Automatic tax savings","Not necessarily $1,000"]],"bottom":"Actual tax value depends on offsetting gains, deduction rules, individual circumstances and wash-sale restrictions."},"quiz":{"q":"Which is the best description of a $1,000 realized stock loss?","options":["A guaranteed $1,000 refund","A loss with possible tax effects subject to rules","An amount the broker always reimburses","A deduction from property tax automatically"],"answer":1,"feedback":"Tax losses may offset certain gains or other income under applicable limits, but are not dollar-for-dollar refunds."},"academy":{"study":"Suppose you move from a high-income-tax state to a low-income-tax state. Housing, property tax, insurance, salaries and state tax treatment can change the real benefit. Model the entire picture.","pitfall":"Wash-sale rules may apply across related accounts and automatic dividend reinvestment. Not every loss produces an immediate tax saving.","assignment":"Compare two hypothetical states by after-tax income plus housing, insurance and property-tax costs.","level":3,"minutes":18},"sourceKeys":["irs_cap","taxes"]}]},{"id":"M12","title":"Retirement & Tax-Advantaged Accounts","short":"Use account rules to keep more of what grows","deck":"Work plans, Roth/traditional tradeoffs, income and withdrawal risk.","level":3,"symbol":"◇","lessons":[{"id":"L12.S1","title":"401(k), Employer Match and Vesting","subtitle":"Understanding compensation beyond the paycheck","lead":"Workplace retirement plans may allow pre-tax or Roth contributions, employer matching and investment choices subject to plan rules.","points":[["Employee deferral","Money you elect to contribute; payroll and tax treatment depend on the election."],["Employer match","Additional contribution under the plan’s formula, if offered."],["Vesting","When employer-contributed funds become nonforfeitable."],["Fees","Plan investment and administrative charges reduce results."]],"example":{"title":"Work through the numbers","lines":[["Annual salary","$50,000"],["Employee contribution 4%","$2,000"],["Employer match 50% of first 4%","$1,000"],["Total annual additions","$3,000"]],"bottom":"Formula is illustrative. An employer can match differently, have eligibility rules and a vesting schedule."},"quiz":{"q":"Employer matches half of the first 4% of pay. On $50,000 salary, what match results from a 4% employee contribution?","options":["$500","$1,000","$2,000","$4,000"],"answer":1,"feedback":"Employee puts in $2,000; matching half equals $1,000."},"academy":{"study":"The matching contribution can significantly improve retirement saving, but it is not always immediately owned if it is subject to vesting. Contribute within a realistic budget and understand debt/emergency tradeoffs.","pitfall":"Contribution limits and employer policies change. A match is not automatically paid on every paycheck without checking the plan document.","assignment":"Read a hypothetical 401(k) summary and calculate match dollars and vested dollars under three tenure scenarios.","level":3,"minutes":18},"sourceKeys":["irs_ira","investor"]},{"id":"L12.S2","title":"Traditional and Roth Accounts","subtitle":"When you pay tax changes the outcome","lead":"Traditional and Roth accounts generally differ in when tax benefits apply; access, deductibility, distribution rules and eligibility can differ.","points":[["Traditional IRA","Contributions may be deductible; qualifying withdrawals are generally taxed under traditional IRA rules."],["Roth IRA","Contributions use after-tax dollars; qualified distributions can be tax-free."],["Tax bracket timing","Current versus future tax rates affect the arithmetic."],["Withdrawal restrictions","Early distributions and special holding periods can create taxes or penalties."]],"example":{"title":"Work through the numbers","lines":[["Money available before current tax","$5,000"],["Illustrative marginal rate now","22%"],["After-tax amount for Roth","$3,900"],["Traditional pre-tax contribution","$5,000"]],"bottom":"The same $5,000 before tax is not the same current out-of-pocket cost for both options. Compare after-tax retirement value using equal economic cost."},"quiz":{"q":"Which statement best describes qualified Roth IRA distributions?","options":["Always ordinary-income taxed","May be federal income-tax free under Roth rules","Always subject to 10% penalty","Taxed based on the stock market index"],"answer":1,"feedback":"Qualified Roth IRA distributions are generally federal income-tax free when statutory requirements are met."},"academy":{"study":"Investing in the same index fund inside different accounts creates different tax timing. The account matters as much as the asset for withdrawal and reporting decisions.","pitfall":"A Roth account is not an unrestricted checking account. Eligibility, five-year rules and distribution ordering require attention.","assignment":"Build a traditional vs Roth comparison using one expected current and future tax rate, and explain uncertainty.","level":3,"minutes":18},"sourceKeys":["irs_ira","taxes"]},{"id":"L12.S3","title":"Social Security and Retirement Income","subtitle":"Planning for spending, not just accumulation","lead":"Retirement planning is a cash-flow problem: benefits, portfolio withdrawals, expenses, health costs and longevity must be considered together.","points":[["Social Security","Benefits reflect eligibility and earnings history; claiming age changes monthly benefits."],["Withdrawal plan","Portfolio withdrawals must cover the gap between expenses and other income."],["Inflation","Retirement spending often rises over time; purchasing power matters."],["Longevity risk","Outliving assets or experiencing high costs late in life."]],"example":{"title":"Work through the numbers","lines":[["Monthly retirement spending","$4,000"],["Illustrative monthly benefit","$2,200"],["Portfolio gap per month","$1,800"],["Annual gap","$21,600"]],"bottom":"The $21,600 is a starting withdrawal need before taxes and one-time costs—not a prediction of safe sustainable withdrawals."},"quiz":{"q":"If retirement spending is $4,000/month and reliable income is $2,200/month, annual portfolio gap is:","options":["$1,800","$12,000","$21,600","$48,000"],"answer":2,"feedback":"Monthly gap is $1,800; multiply by 12 for $21,600 a year."},"academy":{"study":"Claiming Social Security early versus later should consider health, work, spouse benefits, taxes and longevity. A high investment balance is useless if retirement withdrawals are poorly planned.","pitfall":"A single “4% rule” is a historical planning heuristic with assumptions and limitations; it is not an income guarantee.","assignment":"Make an annual retirement budget and estimate how much must come from a portfolio after other income.","level":3,"minutes":18},"sourceKeys":["investor"]},{"id":"L12.S4","title":"Sequence Risk and Withdrawals","subtitle":"Market losses hurt differently in retirement","lead":"The order of portfolio returns matters when money is withdrawn; early retirement losses can permanently reduce the principal available to recover.","points":[["Sequence-of-returns risk","Same average investment return can produce different retirement outcomes due to withdrawal timing."],["Withdrawal rate","Annual portfolio withdrawal divided by starting or current balance, depending on method."],["Cash reserve","May reduce forced stock sales in downturns but has opportunity cost."],["Required distributions","Certain tax-advantaged accounts may require distributions under age and beneficiary rules."]],"example":{"title":"Work through the numbers","lines":[["Starting portfolio","$500,000"],["Year-one decline 20%","− $100,000"],["Withdrawal for living costs","− $25,000"],["Ending before later returns","$375,000"]],"bottom":"The year begins with a decline and withdrawal; reversing this damage requires larger percentage gains on a smaller capital base."},"quiz":{"q":"A $500,000 portfolio declines 20%, then $25,000 is withdrawn. What remains?","options":["$400,000","$375,000","$475,000","$350,000"],"answer":1,"feedback":"After market loss it is $400,000; withdraw $25,000 to leave $375,000."},"academy":{"study":"An accumulation-phase investor may benefit from buying at lower prices with new deposits. A retiree selling the same assets to pay bills experiences the opposite cash-flow pattern.","pitfall":"Never project steady 7% every year when designing withdrawal safety; volatility and spending flexibility must be stress-tested.","assignment":"Model a retirement portfolio with early losses versus late losses using the same annual return set and $20,000 withdrawals.","level":3,"minutes":18},"sourceKeys":["irs_ira"]}]},{"id":"M13","title":"Insurance & Estate Design","short":"Protect assets and plan what passes on","deck":"Income protection, policy loans, beneficiaries, and trust tradeoffs.","level":3,"symbol":"◇","lessons":[{"id":"L13.S1","title":"How to Calculate Insurance Needs","subtitle":"Cover a risk instead of chasing a product","lead":"Insurance planning starts with potential losses and resources, not with a sales brochure claiming a policy builds wealth.","points":[["Human capital","Present value of future earnings and household contributions."],["Life insurance need","Needs such as debts, dependents, education and income replacement less available resources."],["Disability protection","Income protection when illness or injury prevents work."],["Risk pooling","Premiums pay for contractual protections based on insurer underwriting."]],"example":{"title":"Work through the numbers","lines":[["Remaining home loan","$220,000"],["Income replacement target","$250,000"],["Available savings to offset","− $40,000"],["Illustrative coverage gap","$430,000"]],"bottom":"This simple needs analysis excludes additional details such as existing policies, survivor income, education and final expenses."},"quiz":{"q":"What is the illustrative insurance need for $220k debt + $250k support − $40k existing resources?","options":["$430,000","$510,000","$210,000","$470,000"],"answer":0,"feedback":"220,000 + 250,000 − 40,000 = $430,000."},"academy":{"study":"A person with dependents, a large mortgage and limited savings may need affordable large death-benefit protection; a young person with no dependents can have very different priorities.","pitfall":"Cash-value life insurance is not always an appropriate replacement for retirement investing or emergency savings.","assignment":"Create a protection-needs worksheet for a hypothetical family with a child, mortgage and two earners.","level":3,"minutes":18},"sourceKeys":["term"]},{"id":"L13.S2","title":"Whole Life, Universal Life & Policy Loans","subtitle":"Why borrowing from a policy is not free","lead":"Permanent life insurance can build contract cash value, but premiums, charges, loan interest and lapse risk can complicate its use.","points":[["Term insurance","Temporary death-benefit protection, usually no policy cash value."],["Whole life","Lifetime-policy form with contract guarantees subject to insurer strength and premium obligations."],["Universal life","Policy with flexible elements and cash-value/charge mechanics that require monitoring."],["Policy loan","Borrowing against policy value accrues interest and reduces available benefits; lapse can create tax consequences."]],"example":{"title":"Work through the numbers","lines":[["Policy cash value","$25,000"],["Illustrative loan","$15,000"],["Illustrative loan rate","7%"],["One-year simple interest","$1,050"]],"bottom":"The policy loan creates debt; it is not new income from nowhere. Terms, capitalized interest and potential dividends affect real outcomes."},"quiz":{"q":"A $15,000 policy loan at 7% simple annual interest incurs approximately how much first-year interest?","options":["$105","$1,050","$7,000","$15,700"],"answer":1,"feedback":"15,000 × 0.07 = $1,050 before compounding and policy-specific details."},"academy":{"study":"Insurance agents sometimes describe policy borrowing as “paying yourself interest.” Actual loans can charge the insurer’s contractual rate, with possible dividend adjustments. Read an in-force illustration and alternatives.","pitfall":"A policy in a trust is not automatically protected, tax-free or available for a home down payment; owner, beneficiary and trustee roles matter.","assignment":"Request a policy illustration showing guarantees, non-guaranteed projections, total premiums, cash surrender value, and loan lapse stress.","level":3,"minutes":18},"sourceKeys":["term","irstrust"]},{"id":"L13.S3","title":"Deeds, Beneficiaries and Probate","subtitle":"Assets transfer in different ways","lead":"What happens at death depends on property title, beneficiaries, marital rules, probate and whether a trust actually owns an asset.","points":[["Probate","Court-supervised process that may handle assets passing through an estate."],["Beneficiary designation","Can transfer certain accounts outside the will or probate process."],["Joint title","May carry survivorship consequences, but state laws and deed language matter."],["Funding a trust","Actually transferring suitable assets or naming beneficiaries as appropriate; merely signing a trust may not accomplish it."]],"example":{"title":"Work through the numbers","lines":[["Home market value","$300,000"],["Mortgage balance","− $200,000"],["Equity before selling costs","$100,000"],["Net inherited value","Depends on debts, costs, title and estate"]],"bottom":"A beneficiary does not automatically inherit a debt-free $300,000 house."},"quiz":{"q":"What is usually required for a living trust to control a deeded home?","options":["Only talking about a trust","Properly completing required ownership/transfer steps","Buying life insurance","Opening a brokerage account"],"answer":1,"feedback":"Appropriate legal transfer or other valid arrangement is needed; signing a trust alone does not necessarily move title."},"academy":{"study":"Changing title can conflict with assistance loans, property tax exemptions, homestead rules, Medicaid planning or mortgages. Estate strategy must begin with the actual deed and contracts.","pitfall":"A will does not always override beneficiary designations. Review every account and title separately.","assignment":"Make an asset map: home, bank accounts, IRA, insurance, vehicle. Identify how each would pass and what documents govern.","level":3,"minutes":18},"sourceKeys":["probate","irstrust"]},{"id":"L13.S4","title":"Estate Tax, Basis & Trust Types","subtitle":"Avoid assuming every trust saves tax","lead":"Revocable trusts generally do not remove assets from the creator’s taxable estate; specialized irrevocable strategies have tradeoffs and state-specific consequences.","points":[["Revocable trust","Can help management and probate planning; creator usually retains control and tax attribution."],["Irrevocable trust","Can change control and estate-treatment outcomes depending on terms, transfers and applicable rules."],["Income tax basis","Inherited asset basis can differ from gifted asset basis; exceptions matter."],["Estate and gift tax","Different from income tax; federal and certain state regimes may apply."]],"example":{"title":"Work through the numbers","lines":[["Original property cost basis","$150,000"],["Property value at death","$300,000"],["Hypothetical sale proceeds","$310,000"],["Illustrative gain if basis adjusted to $300k","$10,000"]],"bottom":"Basis adjustments depend on ownership, inclusion and law; the example is not a guarantee. A lifetime gift might retain older basis under different rules."},"quiz":{"q":"If inherited asset basis is $300,000 and it sells for $310,000 before costs, what is the gain?","options":["$160,000","$310,000","$10,000","$150,000"],"answer":2,"feedback":"310,000 − 300,000 = $10,000 on the assumptions given."},"academy":{"study":"Estate plans often prioritize a smooth transfer and stable stewardship of property, not just minimizing an estate tax that may not apply to a particular family. Trust administration has costs.","pitfall":"A trust does not make creditors, mortgages, taxes or benefit-eligibility issues disappear. Consult local counsel before transferring ownership.","assignment":"Compare a lifetime gift, an inheritance through an estate and a funded revocable trust using title, basis, probate and control.","level":3,"minutes":18},"sourceKeys":["irstrust","probate","taxes"]}]},{"id":"M14","title":"Rental Property & Real Estate Investing","short":"Analyze property as an operating business","deck":"Net operating income, financing, maintenance, tax and exit scenarios.","level":3,"symbol":"◇","lessons":[{"id":"L14.S1","title":"Rentals: Revenue vs Cash Flow","subtitle":"Gross rent can be misleading","lead":"An investment rental is a small operating business with rent collections, vacancy, taxes, insurance, upkeep, management and financing.","points":[["Gross scheduled rent","Contracted rent if fully occupied and paid."],["Vacancy and credit loss","Expected empty periods and unpaid rent."],["Operating expenses","Taxes, insurance, maintenance, utilities or management paid by owner."],["Cash flow after debt","Operating cash left after loan principal and interest payments."]],"example":{"title":"Work through the numbers","lines":[["Gross rent $1,800/month","$21,600 per year"],["Vacancy allowance","− $1,300"],["Operating costs","− $7,500"],["Annual NOI","$12,800"]],"bottom":"NOI excludes mortgage payments and typically capital expenditures; actual cash flow could be much lower."},"quiz":{"q":"Rent is $21,600 per year, vacancy $1,300, operating expense $7,500. What is NOI?","options":["$21,600","$14,100","$12,800","$20,300"],"answer":2,"feedback":"21,600 − 1,300 − 7,500 = 12,800."},"academy":{"study":"Suppose the property’s annual debt payments are $14,000. Despite positive NOI of $12,800, cash flow before major capital expenses is negative $1,200. Appreciation cannot pay a current shortfall.","pitfall":"Ignoring vacancy and large repairs makes an investment property appear safer than it is.","assignment":"Underwrite a property with rent, property tax, insurance, repairs, vacancy, management and mortgage; compute cash flow.","level":3,"minutes":18},"sourceKeys":["homeowner"]},{"id":"L14.S2","title":"Cap Rate, Cash-on-Cash and Leverage","subtitle":"Compare a property independent of financing","lead":"Properties can be evaluated through capitalization rates and cash-on-cash return, but these metrics answer different questions.","points":[["Cap rate","NOI divided by property value; an unlevered operating yield measure."],["Cash-on-cash return","Pre-tax annual cash flow divided by cash invested."],["Loan-to-value","Loan balance divided by property value."],["Debt-service coverage","NOI divided by annual debt service; below 1 indicates NOI does not cover debt payments."]],"example":{"title":"Work through the numbers","lines":[["Annual NOI","$12,000"],["Purchase price","$200,000"],["Cap rate","6%"],["Annual debt service","$10,000"]],"bottom":"Debt-service coverage is 12,000/10,000 = 1.20. Cap rate excludes financing effects and ignores property price growth."},"quiz":{"q":"Annual NOI $12,000 divided by $200,000 purchase price is:","options":["4%","6%","8%","12%"],"answer":1,"feedback":"12,000 / 200,000 = 6%."},"academy":{"study":"The same property can have an attractive cap rate but weak cash-on-cash return with expensive financing. Negative leverage is especially dangerous when rates rise or rents disappoint.","pitfall":"Cap rates based on optimistic seller expenses can be overstated; audit line items before accepting an offer.","assignment":"Compare a 5%-cap property with 7%-cap property after reserves, financing, taxes and management.","level":3,"minutes":18},"sourceKeys":["homeowner"]},{"id":"L14.S3","title":"Repairs, Reserves and Stress Testing","subtitle":"What happens when the furnace breaks","lead":"Investment returns depend on realistic reserves for recurring repairs, vacancies and large capital expenditures, not just average months.","points":[["Maintenance","Regular fixes that keep property functional."],["Capex","Long-lived replacements such as roof, HVAC or major systems."],["Reserves","Cash set aside for unexpected repairs and vacancies."],["Stress test","Model adverse rent, interest, property tax or occupancy outcomes."]],"example":{"title":"Work through the numbers","lines":[["Annual rent collected","$21,600"],["Base cash flow before major repairs","$3,000"],["Emergency roof cost","− $9,000"],["Cash flow after roof","− $6,000"]],"bottom":"A single capital event can turn a seemingly positive year into a cash deficit."},"quiz":{"q":"A property has $3,000 annual cash flow before a $9,000 roof replacement. Net after repair:","options":["$12,000","$6,000","− $6,000","− $12,000"],"answer":2,"feedback":"3,000 − 9,000 = −6,000."},"academy":{"study":"A reserve protects the property and the household from having to use credit cards or sell during a vacancy. Inspection reports, systems ages and local regulation affect the reserve needed.","pitfall":"Never count a security deposit or expected appreciation as a substitute for repair reserves.","assignment":"Run a two-month vacancy, 20% tax increase, and a $7,000 repair scenario on the same rental.","level":3,"minutes":18},"sourceKeys":["homeowner"]},{"id":"L14.S4","title":"Selling, Exchanges and Property Taxes","subtitle":"When a good investment may still trigger taxes","lead":"Selling real estate involves transaction costs, loan payoff, possible gain/depreciation rules, and special reinvestment procedures.","points":[["Adjusted basis","Original basis with qualifying capital improvements and depreciation adjustments."],["Depreciation","Tax deduction for eligible rental building basis over applicable periods."],["1031 exchange","Potential gain deferral if strict conditions for qualifying business/investment real estate are met."],["After-tax proceeds","Sale price less costs, debt payoff, and applicable taxes."]],"example":{"title":"Work through the numbers","lines":[["Illustrative sale price","$300,000"],["Selling costs","− $18,000"],["Mortgage payoff","− $170,000"],["Before-tax cash proceeds","$112,000"]],"bottom":"The $112,000 is not equal to taxable gain. Gains depend on adjusted basis, depreciation and other rules."},"quiz":{"q":"A $300,000 property sale with $18,000 selling costs and $170,000 loan payoff leaves cash before tax of:","options":["$130,000","$112,000","$170,000","$282,000"],"answer":1,"feedback":"300,000 − 18,000 − 170,000 = 112,000."},"academy":{"study":"A tax-deferred exchange is not a free cash withdrawal; there are identification and closing deadlines and qualified intermediary requirements. It generally does not apply to a personal residence.","pitfall":"Avoid the claim that forming an LLC or trust automatically eliminates real-estate gain or transfer tax.","assignment":"Make a sale worksheet showing cash proceeds separately from taxable gain and compare sale vs hold.","level":3,"minutes":18},"sourceKeys":["taxes","homeowner"]}]},{"id":"M15","title":"Business Ownership & Complex Strategies","short":"Evaluate entrepreneurship and “wealth hacks”","deck":"Cash flow statements, financing, legal structures and product scrutiny.","level":3,"symbol":"◇","lessons":[{"id":"L15.S1","title":"Business Profit and Owner Cash","subtitle":"Revenues are not personal income","lead":"Business owners must track revenue, variable expenses, overhead, cash conversions, working capital, taxes and owner compensation.","points":[["Gross margin","Revenue less direct cost of goods or service, divided by revenue."],["Operating profit","What remains after operating costs, before certain financing/tax items."],["Working capital","Cash committed to receivables, inventory and supplier terms."],["Owner distribution","Cash taken out of a business; not automatically equivalent to deductible salary."]],"example":{"title":"Work through the numbers","lines":[["Business sales","$150,000"],["Direct costs","− $90,000"],["Operating overhead","− $40,000"],["Operating profit","$20,000"]],"bottom":"A $150,000-sales business might generate only $20,000 in operating profit before taxes, capital needs and financing."},"quiz":{"q":"Business revenue $150k, direct costs $90k, overhead $40k. Operating profit is:","options":["$150,000","$60,000","$20,000","$40,000"],"answer":2,"feedback":"150,000 − 90,000 − 40,000 = 20,000."},"academy":{"study":"A business selling fast but offering long payment terms can be profitable on paper while short on payroll cash. Owner wealth also depends on marketable business value and debts.","pitfall":"Revenue growth is not automatically healthy growth. Track cash collections and returns on invested capital.","assignment":"Read a sample small-business P&L and calculate gross margin, net operating margin and cash buffer.","level":3,"minutes":18},"sourceKeys":["taxes"]},{"id":"L15.S2","title":"LLCs, Corporations and Asset Protection","subtitle":"An entity is a legal framework, not a magic shield","lead":"Business structures can change liability, administration and taxation, but personal guarantees, misconduct and compliance obligations remain.","points":[["Sole proprietorship","Owner and business generally not separate legal persons."],["LLC","State-law entity offering potential liability separation with conditions and costs."],["S corporation","A federal tax election/status with eligibility and payroll rules; not a universal entity type."],["Personal guarantee","Owner personally promises repayment; often survives an LLC ownership structure."]],"example":{"title":"Work through the numbers","lines":[["Rental loan balance","$180,000"],["LLC holds title","Entity form alone"],["Owner signs personal guarantee","Owner risk remains"],["Annual admin and insurance","Still required"]],"bottom":"Forming an LLC does not automatically erase mortgage debt or the owner’s guarantee."},"quiz":{"q":"Which fact may expose an owner personally despite an LLC?","options":["An LLC owns property","The owner signed a personal loan guarantee","The company pays bills","The entity files reports"],"answer":1,"feedback":"A personal guarantee is a separate obligation undertaken by the guarantor."},"academy":{"study":"Compare entity insurance and ownership choices with a local attorney and tax professional. Moving a mortgaged home into an LLC can also affect a loan and homeowner-assistance conditions.","pitfall":"A trust and an LLC are not interchangeable; one manages assets and distributions while the other is generally a legal business entity.","assignment":"Draw owner → LLC → property → mortgage → insurer and mark which contractual obligations attach to each.","level":3,"minutes":18},"sourceKeys":["taxes","probate"]},{"id":"L15.S3","title":"Debt Strategies and Arbitrage Claims","subtitle":"When borrowing to invest fails","lead":"Borrowing to invest only improves results when the true after-tax, risk-adjusted return exceeds financing and operating costs.","points":[["Leverage","Borrowed funds amplify gains and losses."],["Spread","Difference between investment return and all-in borrowing rate."],["Margin call","Lender may require cash or sale of collateral after a drop."],["Counterparty risk","Other party in a contract may not perform or may impose restrictions."]],"example":{"title":"Work through the numbers","lines":[["Amount borrowed","$50,000"],["Loan rate 8%","− $4,000 annual simple cost"],["Investment return 5%","$2,500 illustrative gain"],["Pre-tax spread","− $1,500"]],"bottom":"Borrowing at 8% to earn 5% loses $1,500 before fees, taxes and market risk on the stated assumptions."},"quiz":{"q":"Borrow $50,000 at 8%, earn 5% for a year. Simple pre-tax spread is:","options":["+$1,500","− $1,500","+$6,500","$0"],"answer":1,"feedback":"Investment return is $2,500; interest cost $4,000; net spread −$1,500."},"academy":{"study":"Schemes described as infinite banking, tax-free real estate borrowing, or guaranteed 12% cash flow must be deconstructed into contracts, rates, capital, fees and downside cases.","pitfall":"Borrowing is not automatically taxable income, but debt forgiveness, failed collateral, and policy lapse can create tax consequences.","assignment":"Audit a hypothetical “borrow against insurance to buy property” pitch using loan interest, premiums, reserve and downside assumptions.","level":3,"minutes":18},"sourceKeys":["term","irs_cap"]},{"id":"L15.S4","title":"Comparing Wealth-Building Vehicles","subtitle":"Cash, stocks, property, business and insurance","lead":"Every strategy has a role and a cost. Choose tools by objectives, liquidity, risk, tax treatment and the work required to maintain them.","points":[["Return source","Interest, dividends, profit, appreciation, risk transfer or tax timing."],["Liquidity","How reliably funds can be accessed when needed."],["Ongoing burden","Management time, maintenance, insurance, legal administration and reporting."],["Hidden costs","Fees, taxes, spreads, interest, commissions and opportunity cost."]],"example":{"title":"Work through the numbers","lines":[["Option A: savings","$10,000 liquid"],["Option B: stock ETF","$10,000 exposed to markets"],["Option C: property down payment","$10,000 illiquid equity"],["Option D: policy premium","$10,000 for contract protection/cash-value mechanics"]],"bottom":"Identical cash outlay does not create interchangeable assets: the availability, protections and risks differ."},"quiz":{"q":"Which feature is most important for a six-month emergency reserve?","options":["Maximum expected volatility","Immediate accessible liquidity","Illiquid appreciation potential","Longest lock-up"],"answer":1,"feedback":"An emergency reserve must be available when needed; illiquid gains do not pay immediate bills."},"academy":{"study":"The sophisticated approach is not the strategy with the most tax code citations. It is the combination that meets the goal at acceptable cost and risk. Document what you need before selecting a product.","pitfall":"Reject comparisons that cherry-pick one product’s advantages and ignore the alternatives’ fees, time requirements or downside risks.","assignment":"Create a decision matrix ranking five assets on liquidity, risk, fees, effort, taxation and time horizon.","level":3,"minutes":18},"sourceKeys":["investor","taxes"]}]},{"id":"M16","title":"Financial Adviser Practice & Capstone","short":"Think like an analyst; act like a fiduciary","deck":"Client discovery, professional conduct, rigorous analysis and integrated planning.","level":4,"symbol":"◇","lessons":[{"id":"L16.S1","title":"Fiduciary Duty and Conflicts","subtitle":"Who is paid and whose interests matter","lead":"Financial planning advice depends on standards of care, compensation, conflicts, scope and the client’s actual goals.","points":[["Fiduciary obligation","Under applicable standards, act in the client’s best interest and manage conflicts appropriately."],["Compensation models","Fees, asset-based percentages, commissions and indirect revenue may create different incentives."],["Disclosure","Explanation of material conflicts and services; not a substitute for understanding."],["Verification","Check registration and disciplinary information in official databases."]],"example":{"title":"Work through the numbers","lines":[["Portfolio balance","$200,000"],["Adviser fee 1% of assets","$2,000/year at current size"],["Additional fund fees 0.50%","$1,000/year initially"],["Total illustration","$3,000/year"]],"bottom":"The combined $3,000 equals 1.5% of the portfolio at the starting balance, before other costs and changes in asset value."},"quiz":{"q":"On $200,000, a 1% advisory fee plus 0.5% fund fee initially totals:","options":["$1,000","$2,000","$3,000","$5,000"],"answer":2,"feedback":"1.5% × 200,000 = $3,000 for the initial annual amount."},"academy":{"study":"Commission-based products can be legitimate but may reward product sales. A capable adviser should be able to explain fees, alternatives, conflicts and why a recommendation fits the client.","pitfall":"Someone calling themselves a “financial advisor” is not proof of a specific license, fiduciary obligation or CFP certification. Verify the role and registration.","assignment":"Compare two hypothetical adviser compensation disclosures and identify conflicts, total cost and questions you would ask.","level":4,"minutes":18},"sourceKeys":["fiduciary","investor"]},{"id":"L16.S2","title":"The Financial Planning Process","subtitle":"Start with goals and data, not products","lead":"A professional plan moves from the client’s circumstances to analysis, recommendations, implementation and monitoring.","points":[["Discovery","Identify goals, priorities, values, documents, income, assets, liabilities and risks."],["Analysis","Stress-test cash flow, taxes, insurance, assets and future needs."],["Recommendations","Compare alternatives with explicit rationale and costs."],["Monitoring","Revisit assumptions and adjust for changed circumstances or law."]],"example":{"title":"Work through the numbers","lines":[["Annual net income","$48,000"],["Annual baseline spending","− $42,000"],["Annual surplus","$6,000"],["Potential savings rate","12.5% of net income"]],"bottom":"A $6,000 surplus is not a recommendation to invest all of it; reserves and near-term needs determine allocation."},"quiz":{"q":"On $48,000 net income and $42,000 spending, what percent of net income is available before further decisions?","options":["6%","12.5%","15%","20%"],"answer":1,"feedback":"6,000/48,000 = 12.5%."},"academy":{"study":"If a client asks which life insurance product to buy before providing income, dependents, debt, health and existing coverage, the correct first step is information gathering, not product selection.","pitfall":"A recommendation based only on investment returns ignores legal ownership, insurance, estate transfer and tax considerations.","assignment":"Design an intake checklist for a couple planning a first home, protection for a child and retirement savings.","level":4,"minutes":18},"sourceKeys":["fiduciary"]},{"id":"L16.S3","title":"Regulation and Adviser Due Diligence","subtitle":"Understanding roles, registration and the law","lead":"Financial advice can involve different regulatory frameworks depending on services, compensation, registration and jurisdiction.","points":[["Investment adviser","Person or firm meeting statutory definitions and registration requirements."],["Broker-dealer","Securities intermediary under a different framework with its own standards."],["Series 65","Examination covering investment-adviser laws, investment vehicles and recommendations; passing alone does not confer all permissions."],["Disciplinary history","Public databases can help consumers examine firm and professional records."]],"example":{"title":"Work through the numbers","lines":[["Question to adviser","How are you compensated?"],["Question to adviser","Are you registered, and where?"],["Question to adviser","What standard applies to this recommendation?"],["Question to adviser","Are there surrender fees or lockups?"]],"bottom":"The questions are qualitative; an impressive title or certificate is not enough to evaluate financial advice."},"quiz":{"q":"Which is the best way to verify an investment adviser’s background?","options":["Only social media","Official registration records and disclosures","A company slogan","An advertisement saying “fiduciary”"],"answer":1,"feedback":"Official records and disclosures are appropriate verification starting points."},"academy":{"study":"Learn the distinction between a planning credential, an examination, an employer role and a state or federal registration. Wealth Lab is a self-study course and does not grant any of these.","pitfall":"Never assume all “tax-free”, “guaranteed” or “asset protected” claims are factual without the written contract and statutory basis.","assignment":"Investigate an example Form ADV brochure and identify its services, compensation, conflicts and disciplinary disclosures.","level":4,"minutes":18},"sourceKeys":["fiduciary","investor"]},{"id":"L16.S4","title":"Comprehensive Financial Plan Capstone","subtitle":"Put all the systems together","lead":"A real planning exercise combines the budget, investing, taxes, housing, protection and transfer strategy into one defensible plan.","points":[["Assumptions","Make current figures, forecasts and uncertainties explicit."],["Cash flow","A purchase must leave realistic monthly spending capacity and reserves."],["Risk","Consider job loss, market drawdown, death, disability and home repair."],["Implementation","Prioritize steps with owners, deadlines, professional verification and monitoring."]],"example":{"title":"Work through the numbers","lines":[["Household annual take-home pay","$65,000"],["Annual core expenses","$48,000"],["Annual remaining before goals","$17,000"],["Cash reserves","$10,000"]],"bottom":"The case is hypothetical. A 250k home, child’s future needs and retirement goals compete for the same limited cash; solve as a system."},"quiz":{"q":"Before allocating all $17,000 annual surplus to investments, a planner should first check:","options":["Stock tips only","Liquidity, goals, debt and risk exposures","A single tax deduction","Last year’s market leaderboard"],"answer":1,"feedback":"Liquidity, near-term needs, debts and protection determine whether the surplus is really investable."},"academy":{"study":"Capstone file: fictional household with one child, $65,000 annual take-home income, $48,000 annual expenses, $10,000 liquid assets, a possible $250,000 property purchase, and $7,000 credit-card debt at 22%. Design a 5-year plan with a reserve, debt payoff, mortgage estimate, insurance review, asset allocation, and estate/beneficiary steps. Explain the opportunity costs.","pitfall":"An elegant spreadsheet is not a plan if it assumes no repairs, perfect investment returns, guaranteed assistance or no unexpected medical expenses.","assignment":"Write a 1–2 page investment and homeownership plan with three scenarios: base, income disruption, and housing-cost surprise. Justify every priority.","level":4,"minutes":18},"sourceKeys":["fiduciary","investor","cfpb","irs_cap"]}]}];

const TEXTBOOK={"L1.S1":{"title":"The Wealth Equation","pages":[{"heading":"Three different questions about money","concept":"Wealth is a balance-sheet idea, not a paycheck.","paragraphs":["Income measures money received over a period. Cash flow measures what comes in and goes out over the same period. Net worth measures what remains after subtracting liabilities from assets at a particular moment. A person can have strong income but weak net worth after years of spending; another can own a valuable property yet struggle to buy groceries.","Imagine two pictures. The first is a snapshot of everything you own and owe on October 31. That is the balance sheet. The second is a movie showing each paycheck, insurance bill, grocery purchase, debt payment, and savings deposit throughout October. That is cash flow. A financial planner needs both to understand what a person can afford and what risks they face.","The goal is not automatically to maximize net worth today. A sensible plan considers access to cash, stability of income, the timing of bills, and future obligations. A single net-worth total can hide a dangerous situation."],"example":[["Assets","Cash $8,000 + retirement $12,000 + car $10,000 = $30,000"],["Liabilities","Car loan $7,000 + cards $3,000 = $10,000"],["Net worth","$30,000 − $10,000 = $20,000"]],"pitfall":null,"exercise":"Try writing a balance sheet using broad categories only. Do not confuse an asset value with cash available tomorrow."},{"heading":"How assets and liabilities interact","concept":"Assets have different quality, costs, and liquidity.","paragraphs":["An asset is anything with economic value you control or own, but owning it does not guarantee a return. Cash may be stable in dollar terms but lose purchasing power to inflation. A car helps you travel and may be necessary for work, yet its market value typically declines and maintenance consumes cash. A stock offers partial ownership of a business, with uncertain future profits and prices. A home can appreciate, stagnate, or decline while generating ongoing tax, insurance, and repair bills.","A liability is an obligation, not a judgment about whether borrowing was smart. A low-rate mortgage can help a family acquire an asset; a high-interest revolving balance may reduce future options. But both impose future payments, and the benefit depends on what was financed, terms, resilience and opportunity cost.","A useful personal balance sheet records each asset at a realistic estimated market value and each liability at its payoff balance. Do not count a home at its original price forever or list a retirement account at a value that ignores its market movements."],"example":null,"pitfall":"A vehicle worth $14,000 with a $17,000 loan contributes negative $3,000 to net worth. Monthly payments do not prove the asset is worth what you owe.","exercise":null},{"heading":"Buying a home does not create instant wealth","concept":"Follow every dollar through a purchase.","paragraphs":["Suppose a buyer starts with $25,000 in cash and no debt. Their net worth is $25,000. They purchase a $250,000 home with a $12,500 down payment, borrow $237,500 and incur $7,500 of assumed costs. Immediately afterward, they have $5,000 cash and a house worth $250,000, offset by $237,500 of mortgage debt.","The new net worth is $17,500: $5,000 cash plus $12,500 equity. The purchase did not create $250,000 of wealth. Under these simplified assumptions, $7,500 in transaction costs reduced net worth. Actual accounting can vary with prepaid costs, property valuation and items that retain economic value.","Equity is home value minus mortgage debt. Equity can increase through principal repayment or appreciation, but appreciation is never guaranteed. Moreover, selling usually costs money. You should not equate appraised equity with proceeds you could put into your bank account today."],"example":[["Starting wealth","$25,000 cash"],["Closing cash used","$12,500 down + $7,500 costs = $20,000"],["After purchase","$5,000 cash + $12,500 equity = $17,500 net worth"]],"pitfall":"If the home value falls 10% before meaningful principal payments, the $25,000 price decline more than wipes out the initial equity.","exercise":null},{"heading":"Cash flow can make you property-rich and cash-poor","concept":"Owning an asset creates obligations.","paragraphs":["Suppose the same household takes home $4,000 per month. Housing consumes $2,350 after taxes and insurance, and all other essential costs consume $1,450. The monthly margin is $200. On paper, their equity may grow as the mortgage is paid down, but a $3,000 furnace repair could require fifteen months of that entire surplus.","That is why planners distinguish solvency from liquidity. Solvency asks whether total assets exceed total debts. Liquidity asks how quickly money can cover a bill. Your financial position can be positive but fragile if most assets are inaccessible without penalties, borrowing, sale costs or market risk.","Emergency savings are not wasted just because a mortgage down payment could have been larger. The cash reserve can prevent expensive borrowing or forced asset sales. A home purchase is a collection of decisions about price, financing, insurance, monthly cash margin and reserves—not just whether a lender offers approval."],"example":[["Net monthly income","$4,000"],["Housing and other essentials","$2,350 + $1,450 = $3,800"],["Monthly margin","$200"],["$3,000 repair","15 months of that margin"]],"pitfall":null,"exercise":"Calculate how many months your available cash could cover core expenses if income stopped."},{"heading":"Changes in net worth have several causes","concept":"Distinguish progress from market movement.","paragraphs":["If a $200,000 investment portfolio rises 8%, its value goes up $16,000 without new savings. If the market then falls 20%, the same portfolio might be worth $172,800. Neither change tells you what cash the owner earned from work. Conversely, depositing $500 a month can inc
