function notebook(){let all=ALL_SECTIONS.filter(s=>state.notes[s.id]&&state.notes[s.id].trim()),items=state.noteFilter==='saved'?all:state.noteFilter==='bookmarks'?ALL_SECTIONS.filter(s=>state.bookmarks.includes(s.id)):ALL_SECTIONS.filter(s=>s.id.toLowerCase().includes(state.search.toLowerCase())||s.title.toLowerCase().includes(state.search.toLowerCase()));return `<section class="page"><div class="top-intro"><div class="eyebrow">YOUR PRIVATE RESEARCH</div><h1>My Notebook</h1><p class="muted">Save insights, bookmark important sections, and carry your questions into ChatGPT.</p></div><div class="segmented" role="tablist">${[['all','All sections'],['saved','My notes'],['bookmarks','Bookmarks']].map(([id,label])=>`<button role="tab" aria-selected="${state.noteFilter===id}" data-filter="${id}">${label}</button>`).join('')}</div>${state.noteFilter==='all'?`<input class="searchbox" aria-label="Search lesson sections" placeholder="Search topics or section IDs..." data-search value="${escapeHtml(state.search)}">`:''}${items.length===0?'<div class="empty"><strong>Nothing here yet.</strong>Read a section, add a note, or bookmark an idea to start your research notebook.</div>':items.map(s=>`<div class="note-card"><div class="progress-row"><span class="tag">${s.id}</span><button class="linkish" data-section="${s.id}">Open ↗</button></div><h3 style="margin-top:9px">${escapeHtml(s.title)}</h3>${state.notes[s.id]?`<p>${escapeHtml(state.notes[s.id])}</p>`:'<p>This section is ready for your notes and questions.</p>'}<div class="note-actions"><button class="secondary mini-btn" data-section="${s.id}" data-tab-next="Notes">✎ ${state.notes[s.id]?'Edit':'Add'} note</button><button class="secondary mini-btn" data-chat="${s.id}">◉ Discuss</button></div></div>`).join('')}<button class="secondary wide" style="margin-top:15px" data-action="export">↓ Export notes and progress</button><p class="help" style="margin-top:9px">Your notes and progress are stored on this device/browser only. They do not sync with ChatGPT or GitHub automatically.</p></section>`}
function more(){return `<section class="page"><div class="top-intro"><div class="eyebrow">YOUR WEALTH LAB</div><h1>Settings & Resources</h1><p class="muted">Control the reading experience and keep a backup of your work.</p></div><div class="panel"><h3>State homebuying explorer</h3><p class="muted small">All 50 states and Washington, D.C. · 81 named assistance programs · official agency links.</p><button class="primary wide" data-go="states" style="margin-top:12px">Select a state →</button></div><div class="panel" style="margin-top:14px"><h3>Reading preferences</h3><div class="settings-row"><span>Lesson text size</span><button class="toggle" data-action="font">${state.font}px · Change</button></div><div class="settings-row"><span>Completed sections</span><strong>${totalDone()}/${ALL_SECTIONS.length}</strong></div><div class="settings-row"><span>Saved notes</span><strong>${Object.values(state.notes).filter(x=>x.trim()).length}</strong></div><div class="settings-row" style="border:0"><span>Bookmarked sections</span><strong>${state.bookmarks.length}</strong></div></div><div class="panel" style="margin-top:14px"><h3>Keep your work safe</h3><p class="muted" style="margin-top:9px;font-size:12px">Data stays in this browser's local storage. If you clear site data or change phones, it may be lost unless you export a backup.</p><div class="note-actions"><button class="primary mini-btn" data-action="export">↓ Export backup</button><button class="secondary mini-btn" data-action="import">↑ Import backup</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><button class="linkish" style="margin-top:12px" data-action="reset">Clear local learning data (confirmation required)</button></div><div class="panel" style="margin-top:14px"><h3>Verified source library</h3><p class="muted small" style="margin-top:9px">Official agencies are linked below. Verify current rules before any financial decision.</p>${Object.values(SOURCES).map(x=>`<div class="settings-row"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12px">${escapeHtml(x.name)} ↗</a></div>`).join('')}</div><div class="install-tip"><strong>Install on Android</strong><br>Once Wealth Lab is hosted over HTTPS, open it in Chrome and choose “Install app” or “Add to Home screen” from the browser menu. The downloaded HTML file can be previewed locally but cannot be installed as a full PWA from a file link.</div><div class="panel"><h3>Curriculum details</h3><p class="muted small" style="margin-top:9px">Version 1.3.1 · 16 courses · 59 structured lessons · no tracking, ads, accounts, or external JavaScript.</p><p class="help">Lessons are general financial education and not a substitute for legal, tax, lending, insurance, or investment advice. Calculator values are hypothetical by default.</p></div><p class="footer-note">Made for learning deeply, deciding carefully, and building a lasting foundation.</p></section>`}
const STATE_REFERENCE_DATE='October 29, 2026';
function chosenState(code){return STATE_HFAS.find(x=>x[0]===code)||null}
function statePicker(current,attr,placeholder){return `<label class="state-select-label" for="${attr}">${placeholder}</label><select id="${attr}" class="state-select" data-state-pick="${attr}"><option value="">Choose a state</option>${STATE_HFAS.map(x=>`<option value="${x[0]}" ${x[0]===current?'selected':''}>${escapeHtml(x[1])}</option>`).join('')}</select>`}
function hfaPanel(x,compact=false){return `<div class="state-agency"><div class="eyeline">${compact?'COMPARISON STATE':'OFFICIAL STATE HOUSING AGENCY'}</div><h3>${escapeHtml(x[2])}</h3><p>For ${escapeHtml(x[1])}, start here to investigate first-time homebuyer loans, down-payment help, closing-cost assistance and participating lenders. Individual programs and funds must be checked.</p><a href="${escapeHtml(x[3])}" target="_blank" rel="noopener noreferrer" class="state-link">Visit ${escapeHtml(x[1])} housing agency ↗</a></div>`}
function programPanel(s, compact=false){
 const programs=(window.WL_STATE_PROGRAMS||{})[s[0]]||[];
 const labels={repayable:'Repayable loan',deferred:'Deferred loan',forgivable:'Forgivable loan',grant:'Grant',varies:'Terms vary',shared:'Shared appreciation',mortgage:'Mortgage program'};
 if(!programs.length)return `<div class="panel"><h3>Program research unavailable</h3><p class="muted">Check the agency's official program directory.</p></div>`;
 return `<div class="panel program-panel ${compact?'compact':''}"><div class="program-heading"><div><div class="eyeline">STATE HOMEOWNERSHIP RESEARCH · OCT 2026</div><h3>${compact?'Highlighted programs':'Actual programs in '+escapeHtml(s[1])}</h3></div><span class="program-count">${programs.length} listed</span></div><p class="program-hint">Named assistance and mortgage programs to investigate. Amounts are advertised ceilings or snapshots, not money you're approved for. Loan rates, funding and eligibility must be checked with the agency or a participating lender.</p>${programs.slice(0,compact?2:20).map(p=>`<article class="program-card"><h4 class="program-card-title">${escapeHtml(p.name)}</h4><div class="program-tags"><span class="program-tag">${escapeHtml(labels[p.type]||'Assistance')}</span><span class="program-tag ${/closed/i.test(p.status)?'closure':''}">${escapeHtml(p.status)}</span></div><div class="program-amount">${escapeHtml(p.amount||'Ask agency for current amount')}</div><p class="program-detail">${escapeHtml(p.note)}</p><div class="program-source"><a href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">Official program information ↗</a><small>${p.evidence==='official'?'Agency terms reviewed':'Agency confirmation needed'}</small></div></article>`).join('')}${!compact?`<details class="program-glossary"><summary>What do these assistance types really mean?</summary><p><strong>Grant:</strong> usually does not require repayment if conditions are met. <strong>Forgivable loan:</strong> repayment can be waived after a required period, but moving or refinancing early may trigger it. <strong>Deferred loan:</strong> payment is delayed, not erased. <strong>Repayable loan:</strong> usually adds a second monthly debt payment. <strong>Shared appreciation:</strong> repayment may include some of the home's future price gain. Terms vary by contract.</p></details><p class="program-smallprint">Compiled from agency materials and DPA Finder's open program directory (CC BY 4.0), checked in October 2026. Some listings are research leads rather than independently verified funding offers. Local city/county programs may provide additional help. <a href="https://dpafinder.org/data/" target="_blank" rel="noopener noreferrer">Data and attribution ↗</a></p>`:''}</div>`;
}
const COMPARE_TYPES={repayable:'Repayable second loan',deferred:'Deferred loan',forgivable:'Forgivable loan',grant:'Grant',shared:'Shared appreciation',mortgage:'Mortgage program',varies:'Terms vary'};
function statePrograms(x){return ((window.WL_STATE_PROGRAMS||{})[x[0]]||[])}
function compareTypes(x){const types=[...new Set(statePrograms(x).map(p=>p.type))];return types.length?types.map(t=>COMPARE_TYPES[t]||'Other').join(', '):'No current catalog entries'}
function stateResearchChecklist(s){return `<div class="panel compare-checklist"><div class="eyeline">QUESTIONS TO VERIFY · ${escapeHtml(s[0])}</div><h3>Before using any of these offers</h3><div class="state-checks">${[['First-time buyer rules','Confirm the specific program’s definition of first-time buyer and any exceptions.'],['Income, price and credit limits','Check household income, purchase price, debt-to-income ratio, credit and required education.'],['Funding and participating lenders','Confirm open enrollment and how to apply through an approved lender.'],['Repayment and transfer conditions','Ask what happens when selling, refinancing, renting, moving or transferring title into a trust.'],['Local costs and programs','Research county/city assistance, property taxes, homeowners insurance and closing costs.']].map(([title,desc])=>`<div class="state-check"><span>✓</span><div><strong>${title}</strong><p>${desc}</p></div></div>`).join('')}</div></div>`}
function compareSummary(a,b){
 const summary=[
  ['Programs listed',`${statePrograms(a).length} research entries`,`${statePrograms(b).length} research entries`],
  ['Local programs',localArea(a)?`${localMatches(a).length} indexed for ${localArea(a)}`:'Select city or county',localArea(b)?`${localMatches(b).length} indexed for ${localArea(b)}`:'Select city or county'],
  ['Assistance structures',compareTypes(a),compareTypes(b)],
  ['Advertised amount','See individual program cards','See individual program cards'],
  ['Availability','Confirm with each agency','Confirm with each agency'],
  ['Buyer eligibility','Program-specific','Program-specific'],
  ['State mortgage rates','Request lender Loan Estimates','Request lender Loan Estimates'],
  ['Property taxes','County / municipality / parcel','County / municipality / parcel'],
  ['Trust / deed transfer','State law + loan terms','State law + loan terms']
 ];
 const cell=x=>escapeHtml(x);
 return `<div class="panel compare-summary" id="comparison-summary"><div class="eyeline">DIRECT COMPARISON · RESEARCH SNAPSHOT</div><h2>At a glance</h2><p class="muted small">These are program-directory comparisons, not a ranking or eligibility decision. Two programs with different repayment terms cannot be compared by dollar amount alone.</p><div class="comparison-table" role="table" aria-label="Side by side state homebuyer comparison"><div class="compare-grid-row compare-grid-head" role="row"><div role="columnheader">Decision point</div><div role="columnheader"><span class="compare-letter">A</span>${cell(a[1])}</div><div role="columnheader"><span class="compare-letter">B</span>${cell(b[1])}</div></div><div class="compare-grid-row" role="row"><div role="rowheader">Housing agency</div><div role="cell"><a href="${cell(a[3])}" target="_blank" rel="noopener noreferrer">${cell(a[2])} ↗</a></div><div role="cell"><a href="${cell(b[3])}" target="_blank" rel="noopener noreferrer">${cell(b[2])} ↗</a></div></div>${summary.map(([label,av,bv])=>`<div class="compare-grid-row" role="row"><div role="rowheader">${cell(label)}</div><div role="cell">${cell(av)}</div><div role="cell">${cell(bv)}</div></div>`).join('')}</div><p class="help">“Programs listed” means catalog entries, not active awards. Loan rates need individualized quotes. Benefits, maximum amounts and eligibility must be verified against each official program page.</p></div>`
}

function localList(x){return LOCAL_PROGRAMS.filter(p=>p.state===x[0]);}
function localArea(s){return (state.localAreas||{})[s[0]]||'';}
function normalizedLocal(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function localMatches(s){const q=normalizedLocal(localArea(s));if(!q)return [];return localList(s).filter(p=>[p.area,...p.aliases].some(a=>normalizedLocal(a)===q));}
function localResearchControls(a,b){const choices=[a,b].filter(Boolean),inputs=choices.map((s,i)=>{
 const id='local-area-'+s[0];const options=[...new Set(localList(s).map(p=>p.area))].sort();return `<label for="${id}">State ${i===0?'A':'B'} · ${escapeHtml(s[1])}<input id="${id}" maxlength="90" placeholder="City or county" data-local-input="${s[0]}" list="choices-${s[0]}" value="${escapeHtml(localArea(s))}" autocomplete="off"><datalist id="choices-${s[0]}">${options.map(n=>`<option value="${escapeHtml(n)}"></option>`).join('')}</datalist></label>`;
 });
 const chosen=choices.map(s=>localArea(s)?`${escapeHtml(s[0])}: ${escapeHtml(localArea(s))}`:'').filter(Boolean).join(' · ');
 return `<details class="local-lookup"><summary><span>Explore city &amp; county programs</span><small>${chosen||'Optional · no extra clutter'}</small></summary><div class="local-body"><div class="local-picker-grid">${inputs.join('')}</div><p class="local-help">Enter an actual city or county, not a ZIP code. Suggestions show indexed locations, but you can research any area. Some county programs exclude certain cities.</p><button type="button" class="secondary mini-btn" data-action="local-apply">Show local research</button><p class="local-help">Local catalog is a small verified starting set, not every U.S. municipality. Unlisted areas are <strong>not</strong> proof that no assistance exists.</p></div></details>`;
}
function localPanel(s){const area=localArea(s);if(!area.trim())return '';
 const matches=localMatches(s); const label=escapeHtml(area);
 return `<details class="local-results"><summary><span>⌖ Local help · ${label}</span><small>${matches.length?`${matches.length} program lead${matches.length>1?'s':''}`:'Research needed'} ▾</small></summary><div class="local-content"><p class="local-note">Only programs matching the selected local-area name are shown. Confirm the exact property address, jurisdiction and available funds before assuming eligibility.</p>${matches.length?matches.map(p=>`<article class="local-card"><div class="local-type">${escapeHtml(p.kind)} program · ${escapeHtml(p.type)} · reviewed October 31, 2026</div><h4>${escapeHtml(p.name)}</h4><div class="local-amount">${escapeHtml(p.amount)}</div><p>${escapeHtml(p.note)}</p><a target="_blank" rel="noopener noreferrer" href="${escapeHtml(p.url)}">Official local program page ↗</a></article>`).join(''):`<p class="local-note">We haven't indexed a verified program for <strong>${label}</strong> yet. That does not mean there are none. Try a city/county housing office or copy a location-specific ChatGPT research question.</p>`}<p class="local-note">These are dated research leads, not current funding awards or eligibility determinations. County services may exclude incorporated cities.</p><a target="_blank" rel="noopener noreferrer" class="state-underlink" href="https://www.consumerfinance.gov/find-a-housing-counselor/">Find a HUD-approved housing counselor ↗</a> <button type="button" class="secondary mini-btn" data-local-copy="${s[0]}">Research this locality in ChatGPT</button></div></details>`;
}
async function localChatCopy(code){const s=chosenState(code);if(!s)return;const area=localArea(s);const programs=localMatches(s);const text=`Wealth Lab local homebuyer research: ${area}, ${s[1]} (${code}). Verify the exact city/county jurisdiction and currently available first-time-homebuyer programs including grants, forgivable loans, deferred loans, income/credit/property limits, approved lenders, funding, program stacking, occupancy, refinance and transfer restrictions. ${programs.length?'Catalog leads: '+programs.map(p=>`${p.name}: ${p.amount}; ${p.note}; ${p.url}`).join(' | '):'No program for this locality is currently indexed in Wealth Lab; that is not evidence none exist.'} Check local government, state HFA and official program sources. Use up-to-date citations and be careful of outdated funding claims.`;let ok=await copyText(text);toast(ok?'Local research question copied. Paste it into ChatGPT.':'Copy unavailable; try again in your browser.');}
function compareColumn(s,letter){return `<div class="compare-detail-column"><div class="compare-detail-heading"><span class="compare-letter">${letter}</span><div><span class="eyeline">STATE ${letter} · FULL DETAILS</span><h3>${escapeHtml(s[1])}</h3></div></div>${hfaPanel(s)}${programPanel(s)}${localPanel(s)}${stateResearchChecklist(s)}</div>`}
function comparisonView(a,b){return `${compareSummary(a,b)}<div class="panel compare-heading"><div class="eyeline">PROGRAMS & SOURCES · TWO STATES</div><h2>Full program details, side by side</h2><p class="muted small">Both columns include the complete state agency information, all listed program cards, repayment details, status notes and source links. <strong>On a phone, swipe the columns left or right</strong> to read the other state.</p></div><div class="compare-horizontal" role="region" tabindex="0" aria-label="Scrollable side-by-side program comparison"><div class="compare-two-columns">${compareColumn(a,'A')}${compareColumn(b,'B')}</div></div><details class="panel compare-full-reading"><summary>Prefer full-width reading? Open both state profiles</summary><div class="compare-readable-details"><h3>State A · ${escapeHtml(a[1])}</h3>${hfaPanel(a)}${programPanel(a)}${localPanel(a)}${stateResearchChecklist(a)}<h3>State B · ${escapeHtml(b[1])}</h3>${hfaPanel(b)}${programPanel(b)}${localPanel(b)}${stateResearchChecklist(b)}</div></details><p class="help compare-note">No state has been declared “better.” The right choice depends on location, qualifying income, credit, approved lender, total housing costs, repayment conditions and available funding.</p>`}
function stateExplorer(){
 const s=chosenState(state.stateCode),cmp=chosenState(state.compareStateCode),name=s?s[1]:'your state';
 const compare=!!(s&&cmp&&s[0]!==cmp[0]);
 return `<section class="page state-page"><div class="top-intro"><div class="eyebrow">WEALTH LAB · NATIONWIDE</div><h1>State Explorer</h1><p class="muted">81 researched homebuyer and assistance program entries covering all 50 states and Washington, D.C.</p></div>
 <div class="state-hero"><div class="eyeline">COMPARE WHERE YOU COULD BUY</div><h2 class="serif">Two states. One clear view.</h2><p>Select one state for its complete details, or choose a second to put both agencies and all their listed assistance programs into a comparison grid.</p><div class="state-selector-grid"><div>${statePicker(state.stateCode,'state-primary','State A · Primary')}</div><div>${statePicker(state.compareStateCode,'state-compare','State B · Compare with')}</div></div><div class="state-compare-actions"><button class="secondary mini-btn" data-action="state-swap" ${!compare?'disabled':''}>⇄ Swap states</button><button class="secondary mini-btn" data-action="state-clear-compare" ${!state.compareStateCode?'disabled':''}>× Single-state view</button></div><p class="state-mode-label">${compare?'COMPARING '+escapeHtml(s[1])+' AND '+escapeHtml(cmp[1]):'SINGLE STATE · Choose State B to compare'}</p></div>
 ${s?localResearchControls(s,cmp&&cmp[0]!==s[0]?cmp:null):''}
 ${s&&cmp&&s[0]===cmp[0]?'<div class="panel"><strong>Choose a different State B.</strong><p class="muted small">The two selectors currently show the same state; you can choose another state to compare, or clear State B.</p></div>':''}
 ${!s?'<div class="panel" style="margin-top:14px"><h3>Start with State A</h3><p class="muted small">Select a primary state to see its official housing agency and named assistance programs. Add State B whenever you want a direct comparison.</p></div>':compare?comparisonView(s,cmp):`<div class="state-region"><span class="state-big-code">${s[0]}</span><div><div class="eyeline">STATE A · SINGLE-STATE VIEW</div><h2>${escapeHtml(s[1])}</h2><p class="muted small">Full state information and all program cards are shown below.</p></div></div>${hfaPanel(s)}${programPanel(s)}${localPanel(s)}${stateResearchChecklist(s)}`}
 <div class="panel" style="margin-top:15px"><div class="eyeline">FEDERAL OPTIONS · NATIONWIDE</div><h2 style="margin:8px 0">Financing paths worth comparing</h2>${[
['Conventional','Some programs allow low down payments. Mortgage insurance and pricing depend on qualification.','https://www.consumerfinance.gov/owning-a-home/loan-options/'],
['FHA','As little as 3.5% down for qualifying borrowers; FHA mortgage insurance applies and loan limits vary by county.','https://www.consumerfinance.gov/owning-a-home/fha-loans/'],
['USDA Rural','Eligible people buying in eligible rural areas may qualify for 100% financing; income and property eligibility apply.','https://www.rd.usda.gov/programs-services/single-family-housing-programs/single-family-housing-guaranteed-loan-program'],
['VA','Eligible service members, veterans and certain surviving spouses may qualify without a VA-required down payment.','https://www.va.gov/housing-assistance/home-loans/']].map(([title,detail,url])=>`<div class="state-loan"><strong>${title}</strong><p>${detail}</p><a href="${url}" target="_blank" rel="noopener noreferrer">Read official loan guidance ↗</a></div>`).join('')}</div><div class="panel" style="margin-top:15px"><div class="eyeline">RATE RESEARCH · NATIONAL BENCHMARK</div><h2 style="margin:8px 0">Mortgage rate reference</h2><p class="muted small">Freddie Mac's weekly U.S. averages as of ${STATE_REFERENCE_DATE}. These are historical snapshots, not live rates, state-specific quotes or promises of eligibility.</p><div class="state-rates"><div><small>30-year fixed</small><strong>7.24%</strong></div><div><small>15-year fixed</small><strong>6.60%</strong></div></div><a href="https://www.freddiemac.com/pmms" target="_blank" rel="noopener noreferrer" class="state-link">See latest Freddie Mac weekly averages ↗</a><p class="help">Rates vary by lender, credit, down payment, points, loan type and property. Request comparable Loan Estimates to know actual offers. Weekly figures aren't refreshed automatically in this offline-first app.</p><button class="secondary wide" data-action="state-to-mortgage" style="margin-top:12px">Calculate a payment using your own rate →</button><a href="https://www.consumerfinance.gov/owning-a-home/compare/compare-loan-estimates/" target="_blank" rel="noopener noreferrer" class="state-underlink">Learn to compare lender quotes ↗</a></div><div class="panel" style="margin-top:15px"><div class="eyeline">FURTHER OFFICIAL DIRECTORIES</div><div class="state-links"><a href="https://www.ncsha.org/housing-help/" target="_blank" rel="noopener noreferrer">NCSHA — All state housing agencies ↗</a><a href="https://www.hud.gov/states/" target="_blank" rel="noopener noreferrer">HUD — State/local housing information ↗</a><a href="https://www.rd.usda.gov/programs-services/single-family-housing-programs" target="_blank" rel="noopener noreferrer">USDA — Rural eligibility tools ↗</a><a href="https://www.consumerfinance.gov/owning-a-home/" target="_blank" rel="noopener noreferrer">CFPB — Mortgage education and comparisons ↗</a></div><p class="help">Source directory checked October 30, 2026; program availability, legal rules and terms can change without notice.</p></div><div class="state-chat"><strong>Ready to investigate ${compare?escapeHtml(s[1]+" vs "+cmp[1]):escapeHtml(name)}?</strong><p>Copy a detailed research prompt for ${compare?"both selected states":"the selected state"}, including the programs, repayment conditions, current funding, rates and restrictions.</p><button class="primary wide" data-action="state-chat">${compare?"Copy two-state comparison question →":"Copy state research question →"}</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ↗</a></div><p class="footer-note">Wealth Lab v2.1 · 81 named program entries · 50 states + D.C. · Verify availability, terms and qualification.</p></section>`}
async function stateChatCopy(){
 const a=chosenState(state.stateCode),b=chosenState(state.compareStateCode);
 if(!a){toast('Choose State A first.');return}
 const comparison=!!(b&&a[0]!==b[0]);
 const overview=x=>`${x[1]} (${x[0]}); selected local area: ${localArea(x)||'not specified'}; agency: ${x[2]} (${x[3]}); catalog programs: ${statePrograms(x).map(p=>`${p.name}: ${p.amount}; structure ${p.type}; status ${p.status}; notes ${p.note}; source ${p.url}`).join(' | ')}.`;
 const request=comparison?`Build a current side-by-side comparison of ${a[1]} and ${b[1]} for first-time homebuying. Show named programs, realistic available amounts, grant vs forgivable vs deferred vs repayable and shared-appreciation conditions, income/credit/price limits, agency funding status, local city/county options, required lender, fees, closing costs, refinancing, occupancy, deed/trust transfer limitations and mortgage rates from dated lender sources. Do not confuse program advertised amounts with guaranteed funds. State clearly where current terms are uncertain and cite official current sources. Include two comparable purchase examples using the same home price/financial assumptions. The app's catalog snapshot is October 2026 and must be reverified.\nState A: ${overview(a)}\nState B: ${overview(b)}`:`Investigate current housing and first-time homebuyer programs in ${a[1]}, including available amounts, eligibility, assistance repayment, restrictions, current mortgage rates from dated lender sources, local programs, property taxes, and trust/deed transfer issues. Verify the October 2026 catalog against agency sources, and show numerical examples. State A: ${overview(a)}`;
 const success=await copyText('Wealth Lab v2.1 · State Explorer comparison research\n'+request);
 toast(success?(comparison?'Two-state comparison prompt copied. Paste it into ChatGPT.':'State research prompt copied. Paste it into ChatGPT.'):'Copy unavailable; try again in your browser.');
}
function render(scroll=true){const view={home,learn,reader,tools,notebook,more,states:stateExplorer}[state.view]||home;$('#app').innerHTML=topBar()+view()+bottomNav();document.documentElement.style.setProperty('--reader-size',state.font+'px');if(scroll)window.scrollTo({top:0,behavior:'instant'});document.title=state.view==='reader'?`${activeSection().id} · ${activeSection().title} — Wealth Lab`:'Wealth Lab — Learn. Plan. Build.';persist()}
function routeSection(id,tab='Learn'){if(!SECTION_BY_ID[id])return;state.view='reader';state.section=id;state.module=moduleOf(id).id;state.tab=tab;render()}
function routeModule(id){if(!CURRICULUM.find(x=>x.id===id))return;state.module=id;state.view='learn';render()}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){try{let a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}}
function chatDialog(id){const s=SECTION_BY_ID[id];if(!s)return;pendingChat=id;const dlg=document.createElement('div');dlg.className='dialog-back';dlg.id='chatDialog';dlg.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="Discuss Wealth Lab ${id}"><div class="eyeline">WEALTH LAB · ${s.id}</div><h2>Take this deeper.</h2><p>We'll package the section's explanation and your saved note so ChatGPT can understand exactly which idea you're referring to.</p><textarea id="chatQuestion" aria-label="Your question" placeholder="How would this apply to buying a home in the state I selected?"></textarea><div class="note-actions"><button class="secondary" data-action="close-chat">Cancel</button><button class="primary" data-action="copy-chat">Copy question</button></div><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:14px">Open ChatGPT ↗</a><p class="help" style="margin-top:10px">Paste into our existing conversation to preserve its context. Opening the site alone doesn't select this exact conversation.</p></div>`;document.body.appendChild(dlg);$('#chatQuestion').focus()}
async function doChatCopy(){const s=SECTION_BY_ID[pendingChat];if(!s)return;let q=$('#chatQuestion')?.value?.trim()||`Help me explore how this section applies to a home purchase and inheritance plan in the selected state.`;let text=`Wealth Lab curriculum v1.2 · Selected state: ${state.stateCode&&STATE_HFAS.find(x=>x[0]===state.stateCode)?.[1]||'Not selected'} · ${s.id} · ${s.title}\nSection summary: ${s.lead}\nConcepts:\n${s.points.map(([a,b])=>`- ${a}: ${b}`).join('\n')}\nWorked example: ${s.example.title}. ${s.example.lines.map(x=>x.join(' ')).join('; ')}. ${s.example.bottom}\nMy notes: ${state.notes[s.id]||'None saved.'}\nMy question: ${q}\nPlease explain clearly with realistic numerical examples, compare alternatives and risks, and verify any current laws, mortgage rates, program eligibility or tax rules.`;let ok=await copyText(text);if(ok){$('#chatDialog')?.remove();toast('Context copied. Paste it into our ChatGPT conversation.')}else{let box=$('#chatQuestion');box.value=text;box.select();toast('Select and copy this text, then paste into ChatGPT.')}}
function exportBackup(){const obj={app:'Wealth Lab',schema:1,curriculum:'1.0',exportedAt:new Date().toISOString(),state:{completed:state.completed,notes:state.notes,bookmarks:state.bookmarks,section:state.section,module:state.module,calc:state.calc,font:state.font,quiz:state.quiz,chapterPages:state.chapterPages,chapterAnswers:state.chapterAnswers,stateCode:state.stateCode,compareStateCode:state.compareStateCode,localAreas:state.localAreas}};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='wealth-lab-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup created — save the downloaded file.')}
async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='Wealth Lab'||obj.schema!==1||!obj.state)throw Error('This is not a compatible Wealth Lab backup');let b=obj.state;state.completed=b.completed&&typeof b.completed==='object'?b.completed:state.completed;state.notes=b.notes&&typeof b.notes==='object'?b.notes:state.notes;state.bookmarks=Array.isArray(b.bookmarks)?b.bookmarks.filter(id=>SECTION_BY_ID[id]):[];state.quiz=b.quiz&&typeof b.quiz==='object'?b.quiz:state.quiz;state.chapterPages=b.chapterPages&&typeof b.chapterPages==='object'?b.chapterPages:state.chapterPages;state.chapterAnswers=b.chapterAnswers&&typeof b.chapterAnswers==='object'?b.chapterAnswers:state.chapterAnswers;state.calc={...state.calc,...(b.calc||{})};state.font=[16,18,20].includes(b.font)?b.font:16;state.stateCode=STATE_HFAS.some(x=>x[0]===b.stateCode)?b.stateCode:state.stateCode;state.compareStateCode=STATE_HFAS.some(x=>x[0]===b.compareStateCode)?b.compareStateCode:'';state.localAreas=b.localAreas&&typeof b.localAreas==='object'?b.localAreas:state.localAreas;if(SECTION_BY_ID[b.section])state.section=b.section;state.view='home';render();toast('Backup imported successfully.')}catch(e){toast('Could not import this file: '+e.message)}}
function refreshTool(){for(let el of document.querySelectorAll('[data-value]')){let key=el.dataset.value,val=state.calc[key];el.textContent=['rate','investRate'].includes(key)?Number(val).toFixed(2)+'%':key==='down'?Number(val).toFixed(2)+'%':['years','investYears'].includes(key)?val+' years':money(val)}let output=$('#tool-live');if(output)output.innerHTML=state.tool==='mortgage'?mortgageLive():state.tool==='equity'?equityLive():state.tool==='invest'?investLive():affordLive()}
function handleClick(e){const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.go){state.view=d.go;render();return}if(d.module){routeModule(d.module);return}if(d.section){routeSection(d.section,d.tabNext||'Learn');return}if(d.tab){state.tab=d.tab;render(false);return}if(d.tool){state.tool=d.tool;render(false);return}if(d.filter){state.noteFilter=d.filter;render(false);return}if(d.chat){chatDialog(d.chat);return}if(d.chapterPage!==undefined){let id=activeSection().id,chapter=TEXTBOOK[id];if(chapter){let n=Number(d.chapterPage);if(Number.isInteger(n)&&n>=0&&n<chapter.pages.length){state.chapterPages[id]=n;render(false);document.querySelector('#textbook-reading')?.scrollIntoView({block:'start',behavior:'instant'});}}return}if(d.chapterAnswer!==undefined){let id=activeSection().id,q=TEXTBOOK_CHECKS[id]?.[Number(d.chapterAnswer)];if(q){state.chapterAnswers[id+'#'+Number(d.chapterAnswer)]=Number(d.chapterChoice);persist();const el=document.querySelector('.textbook-practice');if(el)el.outerHTML=textbookPractice(activeSection());}return}if(d.localCopy){localChatCopy(d.localCopy);return}if(d.answer!==undefined){let s=activeSection();state.quiz[s.id]=Number(d.answer);persist();const parent=t.closest('.article');if(parent){parent.outerHTML=articlePractice(s)}return}if(!d.action)return;switch(d.action){case 'complete':{let s=activeSection();state.completed[s.id]=!state.completed[s.id];render(false);toast(state.completed[s.id]?'Section complete.':'Section marked as incomplete.');break}case 'bookmark':{let id=activeSection().id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];render(false);toast(state.bookmarks.includes(id)?'Bookmarked.':'Bookmark removed.');break}case 'font':{state.font=state.font===16?18:state.font===18?20:16;render(false);toast('Reading text set to '+state.font+'px');break}case 'copy-chat':doChatCopy();break;case 'state-chat':stateChatCopy();break;case 'local-apply':{for(const e of document.querySelectorAll('[data-local-input]')){state.localAreas[e.dataset.localInput]=e.value.trim().slice(0,90)}persist();render(false);toast('Local research areas saved. Expand the local results within each state.');break}case 'state-swap':{if(state.stateCode&&state.compareStateCode&&state.stateCode!==state.compareStateCode){const tmp=state.stateCode;state.stateCode=state.compareStateCode;state.compareStateCode=tmp;render(false);toast('State A and State B swapped.')}break}case 'state-clear-compare':{state.compareStateCode='';render(false);toast('Single-state view restored.');break}case 'state-to-mortgage':state.tool='mortgage';state.view='tools';render();break;case 'close-chat':$('#chatDialog')?.remove();break;case 'export':exportBackup();break;case 'import':$('#importFile')?.click();break;case 'reset':{if(window.confirm('Remove ALL saved notes, bookmarks, and progress from this browser? Export a backup first.')){localStorage.removeItem(STORE);state=clone(defaults);render();toast('Local learning data cleared.')}break}case 'resources':state.view='more';render();setTimeout(()=>$('.panel a')?.scrollIntoView({behavior:'smooth',block:'center'}),80);break;}}
$('#app').addEventListener('click',handleClick);
document.addEventListener('click',e=>{if(e.target.id==='chatDialog')$('#chatDialog')?.remove();if(e.target.closest('#chatDialog'))handleClick(e)});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.localInput){state.localAreas[t.dataset.localInput]=t.value.slice(0,90);persist()}else if(t.dataset.range){state.calc[t.dataset.range]=Number(t.value);persist();refreshTool()}else if(t.dataset.note){state.notes[t.dataset.note]=t.value;persist()}else if(t.hasAttribute('data-search')){state.search=t.value;persist();/* Preserve cursor: filter matching note cards in place. */for(let card of document.querySelectorAll('.note-card')){let text=card.innerText.toLowerCase();card.style.display=text.includes(state.search.toLowerCase())?'':'none'}}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){importBackup(e.target.files[0]);e.target.value=''}else if(e.target.dataset.statePick==='state-primary'){state.stateCode=e.target.value;persist();render(false)}else if(e.target.dataset.statePick==='state-compare'){state.compareStateCode=e.target.value;persist();render(false)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// Deep link to a lesson: index.html#L2.S3
const hash=decodeURIComponent(location.hash.slice(1));if(SECTION_BY_ID[hash]){state.section=hash;state.module=moduleOf(hash).id;state.view='reader'}else if(hash==='states'){state.view='states'}
render(false);
})();
</script></body>
