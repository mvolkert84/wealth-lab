 {id:'M3',title:'Trusts & Inheritance',short:'Plan for the next generation',deck:'The difference between building assets and legally transferring them.',symbol:'♧',sections:[

</script><script>/* Wealth Lab — accessible, local-first mobile learning PWA. No external JS dependencies. */

function completed(module){return module.sections.filter(x=>!!state.completed[x.id]).length}

function activeSection(){return SECTION_BY_ID[state.section]||ALL_SECTIONS[0]}

p class="footer-note">Wealth Lab v1.0 · Educational, not personalized legal, tax, or investment advice.</p></section>`}

function articleLearn(s){return `<div class="article"><div class="eyebrow" style="color:#537f62">THE CORE IDEA</div><h2>${escapeHtml(s.title)}</h2><p class="intro">${escapeHtml(s.lead)}</p><h3>What you need to know</h3>${s.points.map(([k,v])=>`<div class="definition"><strong>${escapeHtml(k)}</strong><p>${escapeHtml(v)}</p></div>`).join('')}${s.action?`<div class="inside"><strong>Put it to work</strong><p>${escapeHtml(s.action)}</p></div>`:''}<div class="inside"><strong>The bottom line</strong><p>Remember the principle, test the numbers, and check the fine print before acting.</p></div></div>`}
function articleExample(s){return `<div class="article"><div class="eyebrow" style="color:#537f62">WORKED EXAMPLE · ${s.id}</div><h2>${escapeHtml(s.example.title)}</h2><p>Follow the numbers below. These are teaching assumptions, not an offer or a forecast.</p><table class="table-lite"><tbody>${s.example.lines.map(([a,b])=>`<tr><td>${escapeHtml(a)}</td><td>${escapeHtml(b)}</td></tr>`).join('')}</tbody></table><div class="inside"><strong>Why this matters</strong><p>${escapeHtml(s.example.bottom)}</p></div><p class="disclaimer">Examples are rounded and simplified; additional costs, eligibility requirements, and tax details may apply.</p></div>`}
function articlePractice(s){let ans=state.quiz[s.id];return `<div class="article"><div class="eyebrow" style="color:#537f62">CHECK YOUR UNDERSTANDING</div><h2>Apply what you learned.</h2><p class="intro">${escapeHtml(s.quiz.q)}</p><div class="quizard">${s.quiz.options.map((a,i)=>`<button type="button" class="answer ${ans===i?'chosen':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(a)}</button>`).join('')}</div>${ans!==undefined?`<div class="feedback"><strong>${ans===s.quiz.answer?'Exactly right.':'Here is the reasoning.'}</strong><br>${escapeHtml(s.quiz.feedback)}</div>`:'<p class="disclaimer" style="margin-top:11px">Choose an answer to see the reasoning. There is no penalty for getting it wrong.</p>'}<div style="margin-top:20px"><button class="secondary wide" data-go="tools">Explore the calculators ↗</button></div></div>`}
function articleNotes(s){return `<div class="noteeditor"><div class="eyeline">YOUR NOTES · ${s.id}</div><h3 style="margin:9px 0">What did this make you think about?</h3><p class="muted small">Questions, calculations, and things to investigate. Saved only in this browser.</p><textarea class="note-input" data-note="${s.id}" placeholder="For a home purchase, I wonder whether…">${escapeHtml(state.notes[s.id]||'')}</textarea><div class="note-actions" style="margin-top:12px"><button class="secondary mini-btn" data-chat="${s.id}">Ask ChatGPT ↗</button><button class="secondary mini-btn" data-action="export">Export backup ↓</button></div><p class="help" style="margin-top:12px">Keep your private financial figures out of public repositories. Export backups before switching devices.</p></div>`}
function reader(){const s=activeSection(),m=moduleOf(s.id),idx=sectionIndex(s),p=prog(m),globalIndex=ALL_SECTIONS.findIndex(x=>x.id===s.id),prev=ALL_SECTIONS[globalIndex-1],next=ALL_SECTIONS[globalIndex+1];return `<section class="page"><div class="reader-overhead"><button class="back" data-module="${m.id}">← ${escapeHtml(m.title)}</button><span class="eyeline">${s.id}</span><button class="circle-btn" style="width:31px;height:31px;font-size:17px" data-action="bookmark" title="Toggle bookmark" aria-label="Toggle bookmark">${state.bookmarks.includes(s.id)?'★':'☆'}</button></div><div class="reader-hero"><div class="hero-lesson-meta">CHAPTER ${CURRICULUM.indexOf(m)+1} · SECTION ${idx+1} OF ${m.sections.length}</div><h1>${escapeHtml(s.title)}</h1><p>${escapeHtml(s.subtitle)}</p></div><div class="lesson-progress"><span>${p}% complete</span><div class="meter"><span style="width:${p}%"></span></div><span>${completed(m)}/${m.sections.length}</span></div><div class="segmented" role="tablist" aria-label="Lesson views">${['Learn','Examples','Try It','Notes'].map(tab=>`<button role="tab" aria-selected="${state.tab===tab}" data-tab="${tab}">${tab}</button>`).join('')}</div>${state.tab==='Learn'?articleLearn(s):state.tab==='Examples'?articleExample(s):state.tab==='Try It'?articlePractice(s):articleNotes(s)}<div class="reader-actions"><button class="secondary mini-btn" data-action="complete">${state.completed[s.id]?'✓ Completed · Undo':'✓ Mark section complete'}</button><button class="secondary mini-btn" data-chat="${s.id}">◉ Discuss in ChatGPT</button></div><div class="reader-actions"><button class="ghost" ${!prev?'disabled':''} data-section="${prev?prev.id:''}">← Previous</button><button class="primary" ${!next?'disabled':''} data-section="${next?next.id:''}">Next section →</button></div><details class="sources"><summary>View the original references and reading sources</summary>${s.sourceKeys.map(k=>SOURCES[k]).filter(Boolean).map(x=>`<a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(x.name)} ↗</a>`).join('')}<p class="help">Source pages can change. Review current rules and actual contracts for time-sensitive decisions.</p></details><p class="footer-note">Stable reference ${s.id} · Curriculum v1.0 · Discuss this section in ChatGPT using the button above.</p></section>`}
const COLORS=['#4dd69a','#dfc58a','#789f95','#b7a4a0','#7589ae'];
function payment(){let c=state.calc,pr=c.price*(1-c.down/100),r=c.rate/1200,n=c.years*12,pi=r>0?pr*r/(1-Math.pow(1+r,-n)):pr/n;return {pr,pi,tax:c.tax,insurance:c.insurance,pmi:c.pmi,maint:c.maint,total:pi+c.tax+c.insurance+c.pmi,all:pi+c.tax+c.insurance+c.pmi+c.maint,interest:pi*n-pr}}
function range(name,key,min,max,step,fmt,label){const val=state.calc[key];let out=fmt==='money'?money(val):fmt==='percent'?Number(val).toFixed(2)+'%':`${val}${fmt==='years'?' years':''}`;return `<div class="range-row"><div class="range-header"><label for="r-${key}">${escapeHtml(name)}</label><strong data-value="${key}">${out}</strong></div><input type="range" data-range="${key}" id="r-${key}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${escapeHtml(label||name)}"></div>`}
function moneyBreakdown(p){let items=[['Principal + interest',p.pi],['Property tax',p.tax],['Home insurance',p.insurance],['Mortgage insurance',p.pmi]],colors=COLORS,total=p.total;return `<div class="breakdown" aria-label="Monthly housing cost breakdown">${items.map((x,i)=>`<span style="width:${x[1]/total*100}%;background:${colors[i]}"></span>`).join('')}</div><div class="breaklist">${items.map((x,i)=>`<div class="breakline"><span><span class="swatch" style="background:${colors[i]}"></span>${x[0]}</span><strong>${money(x[1])}</strong></div>`).join('')}</div>`}
function compound(){let c=state.calc,r=c.investRate/1200,n=c.investYears*12,monthly=c.investMonthly,initial=c.investStart,principal=initial+monthly*n,total=initial*Math.pow(1+r,n)+(r===0?monthly*n:monthly*(Math.pow(1+r,n)-1)/r);return {total,principal,gain:total-principal}}
function toolContent(){const c=state.calc,p=payment();if(state.tool==='mortgage')return `<div class="panel tool-panel"><span class="eyeline">TOOL 01 · COMPLETE MORTGAGE PAYMENT</span><h2 style="margin:9px 0">What does the house really cost?</h2><p class="muted small">Adjust the assumptions. This is not a mortgage quote.</p>${range('House price','price',150000,600000,5000,'money')}${range('Down payment','down',3,30,1,'percent')}${range('Illustrative fixed rate','rate',3,10,0.25,'percent')}${range('Mortgage term','years',15,30,15,'years')}${range('Monthly property taxes','tax',0,1200,25,'money')}${range('Homeowners insurance / month','insurance',50,500,10,'money')}${range('Mortgage insurance / month','pmi',0,250,5,'money')}${range('Maintenance reserve / month','maint',0,600,10,'money')}<div id="tool-live">${mortgageLive()}</div><p class="help">Property taxes and insurance vary. Mortgage insurance is a manual assumption, not a lender quote. HOA, utilities, and transaction costs are excluded.</p></div>`;
if(state.tool==='equity')return `<div class="panel tool-panel"><span class="eyeline">TOOL 02 · HOME EQUITY</span><h2 style="margin:9px 0">How much of the home is yours?</h2>${range('Estimated current value','value',100000,700000,10000,'money')}${range('Remaining mortgage','balance',0,650000,5000,'money')}<div id="tool-live">${equityLive()}</div><p class="help">This represents value minus the mortgage balance before selling fees, other liens, or taxes. Negative equity is possible.</p></div>`;
if(state.tool==='invest')return `<div class="panel tool-panel"><span class="eyeline">TOOL 03 · COMPOUNDING</span><h2 style="margin:9px 0">What could regular investing grow into?</h2>${range('Starting amount','investStart',0,25000,500,'money')}${range('Monthly contribution','investMonthly',0,1000,25,'money')}${range('Years','investYears',1,40,1,'years')}${range('Illustrative annual return','investRate',0,10,0.5,'percent')}<div id="tool-live">${investLive()}</div><p class="help">A constant nominal return compounded monthly is only a mathematical scenario, not a prediction. It ignores taxes, fees, inflation, and volatility.</p></div>`;
return `<div class="panel tool-panel"><span class="eyeline">TOOL 04 · AFFORDABILITY LENS</span><h2 style="margin:9px 0">Does the payment fit the budget?</h2>${range('Monthly take-home income','homeIncome',1000,12000,100,'money')}${range('Other monthly debt payments','homeDebt',0,2500,50,'money')}<div id="tool-live">${affordLive()}</div><p class="help">This is a cash-flow view, not a lender qualification or a debt-to-income calculation. Lenders generally evaluate gross income, credit, debts, assets, and program rules.</p></div>`}
function mortgageLive(){let p=payment();return `<hr class="divider"><div class="value-box"><div><div class="value-label">Estimated mortgage + escrow / month</div><div class="value-big">${money(p.total)}</div></div><div class="pill">${money(p.pr)} loan</div></div>${moneyBreakdown(p)}<div class="value-box"><div class="value-label">Including maintenance reserve</div><strong style="color:var(--gold);font-size:20px">${money(p.all)}/mo</strong></div><div class="value-box"><div class="value-label">Total scheduled interest over ${state.calc.years} years</div><strong>${money(p.interest)}</strong></div><div class="small-warning">A low advertised mortgage payment can leave out thousands in annual ownership expenses.</div>`}
function equityLive(){let c=state.calc,e=c.value-c.balance,pct=Math.max(0,Math.min(100,e/c.value*100));return `<hr class="divider"><div class="value-label">Estimated home equity</div><div class="value-big">${money(e)}</div><div class="breakdown"><span style="width:${pct}%;background:${COLORS[0]}"></span></div><p class="muted small">Equity as share of estimated value: ${pct.toFixed(1)}%. ${e<0?'The mortgage exceeds the estimated property value.':'Equity is not the same as cash available to spend.'}</p>`}
function investLive(){let c=compound();return `<hr class="divider"><div class="value-label">Illustrative future balance</div><div class="value-big">${money(c.total)}</div><div class="breakdown"><span style="width:${c.total?c.principal/c.total*100:0}%;background:#84aa9b"></span><span style="width:${c.total?c.gain/c.total*100:0}%;background:${COLORS[0]}"></span></div><div class="breakline"><span>Money contributed</span><strong>${money(c.principal)}</strong></div><div class="breakline"><span>Illustrative growth</span><strong>${money(c.gain)}</strong></div><div class="small-warning">Returns may be negative for extended periods. Fees, taxes, inflation and market timing alter actual outcomes.</div>`}
function affordLive(){let c=state.calc,p=payment(),remaining=c.homeIncome-p.all-c.homeDebt,share=p.all/c.homeIncome*100;return `<hr class="divider"><div class="value-label">Illustrative monthly housing cost + maintenance</div><div class="value-big">${money(p.all)}</div><div class="breakline"><span>Share of take-home pay</span><strong>${share.toFixed(1)}%</strong></div><div class="breakline"><span>Income left after housing and other debt</span><strong>${money(remaining)}</strong></div><p class="muted small">This leaves out food, transport, utilities, healthcare, and saving. Adjust mortgage assumptions under the Mortgage tool.</p>`}
function tools(){return `<section class="page"><div class="top-intro"><div class="eyebrow">YOUR MONEY LAB</div><h1>Tools & Calculators</h1><p class="muted">Move the numbers. Explore what changes—and what's missing from the headline.</p></div><div class="tool-chooser" role="tablist">${[['mortgage','Mortgage payment'],['equity','Home equity'],['invest','Investment growth'],['afford','Budget fit']].map(([id,name])=>`<button data-tool="${id}" class="${state.tool===id?'active':''}" aria-selected="${state.tool===id}">${name}</button>`).join('')}</div>${toolContent()}<p class="footer-note">All outputs are hypothetical and educational. Not a loan approval or financial recommendation.</p></section>`}
function notebook(){let all=ALL_SECTIONS.filter(s=>state.notes[s.id]&&state.notes[s.id].trim()),items=state.noteFilter==='saved'?all:state.noteFilter==='bookmarks'?ALL_SECTIONS.filter(s=>state.bookmarks.includes(s.id)):ALL_SECTIONS.filter(s=>s.id.toLowerCase().includes(state.search.toLowerCase())||s.title.toLowerCase().includes(state.search.toLowerCase()));return `<section class="page"><div class="top-intro"><div class="eyebrow">YOUR PRIVATE RESEARCH</div><h1>My Notebook</h1><p class="muted">Save insights, bookmark important sections, and carry your questions into ChatGPT.</p></div><div class="segmented" role="tablist">${[['all','All sections'],['saved','My notes'],['bookmarks','Bookmarks']].map(([id,label])=>`<button role="tab" aria-selected="${state.noteFilter===id}" data-filter="${id}">${label}</button>`).join('')}</div>${state.noteFilter==='all'?`<input class="searchbox" aria-label="Search lesson sections" placeholder="Search topics or section IDs..." data-search value="${escapeHtml(state.search)}">`:''}${items.length===0?'<div class="empty"><strong>Nothing here yet.</strong>Read a section, add a note, or bookmark an idea to start your research notebook.</div>':items.map(s=>`<div class="note-card"><div class="progress-row"><span class="tag">${s.id}</span><button class="linkish" data-section="${s.id}">Open ↗</button></div><h3 style="margin-top:9px">${escapeHtml(s.title)}</h3>${state.notes[s.id]?`<p>${escapeHtml(state.notes[s.id])}</p>`:'<p>This section is ready for your notes and questions.</p>'}<div class="note-actions"><button class="secondary mini-btn" data-section="${s.id}" data-tab-next="Notes">✎ ${state.notes[s.id]?'Edit':'Add'} note</button><button class="secondary mini-btn" data-chat="${s.id}">◉ Discuss</button></div></div>`).join('')}<button class="secondary wide" style="margin-top:15px" data-action="export">↓ Export notes and progress</button><p class="help" style="margin-top:9px">Your notes and progress are stored on this device/browser only. They do not sync with ChatGPT or GitHub automatically.</p></section>`}
function more(){return `<section class="page"><div class="top-intro"><div class="eyebrow">YOUR WEALTH LAB</div><h1>Settings & Resources</h1><p class="muted">Control the reading experience and keep a backup of your work.</p></div><div class="panel"><h3>Reading preferences</h3><div class="settings-row"><span>Lesson text size</span><button class="toggle" data-action="font">${state.font}px · Change</button></div><div class="settings-row"><span>Completed sections</span><strong>${totalDone()}/${ALL_SECTIONS.length}</strong></div><div class="settings-row"><span>Saved notes</span><strong>${Object.values(state.notes).filter(x=>x.trim()).length}</strong></div><div class="settings-row" style="border:0"><span>Bookmarked sections</span><strong>${state.bookmarks.length}</strong></div></div><div class="panel" style="margin-top:14px"><h3>Keep your work safe</h3><p class="muted" style="margin-top:9px;font-size:12px">Data stays in this browser's local storage. If you clear site data or change phones, it may be lost unless you export a backup.</p><div class="note-actions"><button class="primary mini-btn" data-action="export">↓ Export backup</button><button class="secondary mini-btn" data-action="import">↑ Import backup</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><button class="linkish" style="margin-top:12px" data-action="reset">Clear local learning data (confirmation required)</button></div><div class="panel" style="margin-top:14px"><h3>Verified source library</h3><p class="muted small" style="margin-top:9px">Official agencies are linked below. Verify current rules before any financial decision.</p>${Object.values(SOURCES).map(x=>`<div class="settings-row"><a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12px">${escapeHtml(x.name)} ↗</a></div>`).join('')}</div><div class="install-tip"><strong>Install on Android</strong><br>Once Wealth Lab is hosted over HTTPS, open it in Chrome and choose “Install app” or “Add to Home screen” from the browser menu. The downloaded HTML file can be previewed locally but cannot be installed as a full PWA from a file link.</div><div class="panel"><h3>Curriculum details</h3><p class="muted small" style="margin-top:9px">Version 1.0 · 6 chapters · 19 complete beginner sections · no tracking, ads, accounts, or external JavaScript.</p><p class="help">Lessons are general financial education and not a substitute for legal, tax, lending, insurance, or investment advice. Calculator values are hypothetical by default.</p></div><p class="footer-note">Made for learning deeply, deciding carefully, and building a lasting foundation.</p></section>`}
function render(scroll=true){const view={home,learn,reader,tools,notebook,more}[state.view]||home;$('#app').innerHTML=topBar()+view()+bottomNav();document.documentElement.style.setProperty('--reader-size',state.font+'px');if(scroll)window.scrollTo({top:0,behavior:'instant'});document.title=state.view==='reader'?`${activeSection().id} · ${activeSection().title} — Wealth Lab`:'Wealth Lab — Learn. Plan. Build.';persist()}
function routeSection(id,tab='Learn'){if(!SECTION_BY_ID[id])return;state.view='reader';state.section=id;state.module=moduleOf(id).id;state.tab=tab;render()}
function routeModule(id){if(!CURRICULUM.find(x=>x.id===id))return;state.module=id;state.view='learn';render()}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){try{let a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}}
function chatDialog(id){const s=SECTION_BY_ID[id];if(!s)return;pendingChat=id;const dlg=document.createElement('div');dlg.className='dialog-back';dlg.id='chatDialog';dlg.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="Discuss Wealth Lab ${id}"><div class="eyeline">WEALTH LAB · ${s.id}</div><h2>Take this deeper.</h2><p>We'll package the section's explanation and your saved note so ChatGPT can understand exactly which idea you're referring to.</p><textarea id="chatQuestion" aria-label="Your question" placeholder="How would this apply to buying a home in Connecticut?"></textarea><div class="note-actions"><button class="secondary" data-action="close-chat">Cancel</button><button class="primary" data-action="copy-chat">Copy question</button></div><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;margin-top:14px">Open ChatGPT ↗</a><p class="help" style="margin-top:10px">Paste into our existing conversation to preserve its context. Opening the site alone doesn't select this exact conversation.</p></div>`;document.body.appendChild(dlg);$('#chatQuestion').focus()}
async function doChatCopy(){const s=SECTION_BY_ID[pendingChat];if(!s)return;let q=$('#chatQuestion')?.value?.trim()||`Help me explore how this section applies to a Connecticut home purchase and an inheritance plan.`;let text=`Wealth Lab curriculum v1.0 · ${s.id} · ${s.title}\nSection summary: ${s.lead}\nConcepts:\n${s.points.map(([a,b])=>`- ${a}: ${b}`).join('\n')}\nWorked example: ${s.example.title}. ${s.example.lines.map(x=>x.join(' ')).join('; ')}. ${s.example.bottom}\nMy notes: ${state.notes[s.id]||'None saved.'}\nMy question: ${q}\nPlease explain clearly with realistic numerical examples, compare alternatives and risks, and verify any current laws, mortgage rates, program eligibility or tax rules.`;let ok=await copyText(text);if(ok){$('#chatDialog')?.remove();toast('Context copied. Paste it into our ChatGPT conversation.')}else{let box=$('#chatQuestion');box.value=text;box.select();toast('Select and copy this text, then paste into ChatGPT.')}}
function exportBackup(){const obj={app:'Wealth Lab',schema:1,curriculum:'1.0',exportedAt:new Date().toISOString(),state:{completed:state.completed,notes:state.notes,bookmarks:state.bookmarks,section:state.section,module:state.module,calc:state.calc,font:state.font,quiz:state.quiz}};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='wealth-lab-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup created — save the downloaded file.')}
async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='Wealth Lab'||obj.schema!==1||!obj.state)throw Error('This is not a compatible Wealth Lab backup');let b=obj.state;state.completed=b.completed&&typeof b.completed==='object'?b.completed:state.completed;state.notes=b.notes&&typeof b.notes==='object'?b.notes:state.notes;state.bookmarks=Array.isArray(b.bookmarks)?b.bookmarks.filter(id=>SECTION_BY_ID[id]):[];state.quiz=b.quiz&&typeof b.quiz==='object'?b.quiz:state.quiz;state.calc={...state.calc,...(b.calc||{})};state.font=[16,18,20].includes(b.font)?b.font:16;if(SECTION_BY_ID[b.section])state.section=b.section;state.view='home';render();toast('Backup imported successfully.')}catch(e){toast('Could not import this file: '+e.message)}}
function refreshTool(){for(let el of document.querySelectorAll('[data-value]')){let key=el.dataset.value,val=state.calc[key];el.textContent=['rate','investRate'].includes(key)?Number(val).toFixed(2)+'%':key==='down'?Number(val).toFixed(2)+'%':['years','investYears'].includes(key)?val+' years':money(val)}let output=$('#tool-live');if(output)output.innerHTML=state.tool==='mortgage'?mortgageLive():state.tool==='equity'?equityLive():state.tool==='invest'?investLive():affordLive()}
function handleClick(e){const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.go){state.view=d.go;render();return}if(d.module){routeModule(d.module);return}if(d.section){routeSection(d.section,d.tabNext||'Learn');return}if(d.tab){state.tab=d.tab;render(false);return}if(d.tool){state.tool=d.tool;render(false);return}if(d.filter){state.noteFilter=d.filter;render(false);return}if(d.chat){chatDialog(d.chat);return}if(d.answer!==undefined){let s=activeSection();state.quiz[s.id]=Number(d.answer);persist();const parent=t.closest('.article');if(parent){parent.outerHTML=articlePractice(s)}return}if(!d.action)return;switch(d.action){case 'complete':{let s=activeSection();state.completed[s.id]=!state.completed[s.id];render(false);toast(state.completed[s.id]?'Section complete.':'Section marked as incomplete.');break}case 'bookmark':{let id=activeSection().id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];render(false);toast(state.bookmarks.includes(id)?'Bookmarked.':'Bookmark removed.');break}case 'font':{state.font=state.font===16?18:state.font===18?20:16;render(false);toast('Reading text set to '+state.font+'px');break}case 'copy-chat':doChatCopy();break;case 'close-chat':$('#chatDialog')?.remove();break;case 'export':exportBackup();break;case 'import':$('#importFile')?.click();break;case 'reset':{if(window.confirm('Remove ALL saved notes, bookmarks, and progress from this browser? Export a backup first.')){localStorage.removeItem(STORE);state=clone(defaults);render();toast('Local learning data cleared.')}break}case 'resources':state.view='more';render();setTimeout(()=>$('.panel a')?.scrollIntoView({behavior:'smooth',block:'center'}),80);break;}}
$('#app').addEventListener('click',handleClick);
document.addEventListener('click',e=>{if(e.target.id==='chatDialog')$('#chatDialog')?.remove();if(e.target.closest('#chatDialog'))handleClick(e)});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.range){state.calc[t.dataset.range]=Number(t.value);persist();refreshTool()}else if(t.dataset.note){state.notes[t.dataset.note]=t.value;persist()}else if(t.hasAttribute('data-search')){state.search=t.value;persist();/* Preserve cursor: filter matching note cards in place. */for(let card of document.querySelectorAll('.note-card')){let text=card.innerText.toLowerCase();card.style.display=text.includes(state.search.toLowerCase())?'':'none'}}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){importBackup(e.target.files[0]);e.target.value=''}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// Deep link to a lesson: index.html#L2.S3
const hash=decodeURIComponent(location.hash.slice(1));if(SECTION_BY_ID[hash]){state.section=hash;state.module=moduleOf(hash).id;state.view='reader'}
render(false);
})();
</script></body>
