const TEXTBOOK={"L1.S1":{"title":"The Wealth Equation","pages":[{"heading":"Three different questions about money","concept":"Wealth is a balance-sheet idea, not a paycheck.","paragraphs":["Income measures money received over a period. Cash flow measures what comes in and goes out over the same period. Net worth measures what remains after subtracting liabilities from assets at a particular moment. A person can have strong income but weak net worth after years of spending; another can own a valuable property yet struggle to buy groceries.","Imagine two pictures. The first is a snapshot of everything you own and owe on October 31. That is the balance sheet. The second is a movie showing each paycheck, insurance bill, grocery purchase, debt payment, and savings deposit throughout October. That is cash flow. A financial planner needs both to understand what a person can afford and what risks they face.","The goal is not automatically to maximize net worth today. A sensible plan considers access to cash, stability of income, the timing of bills, and future obligations. A single net-worth total can hide a dangerous situation."],"example":[["Assets","Cash $8,000 + retirement $12,000 + car $10,000 = $30,000"],["Liabilities","Car loan $7,000 + cards $3,000 = $10,000"],["Net worth","$30,000 − $10,000 = $20,000"]],"pitfall":null,"exercise":"Try writing a balance sheet using broad categories only. Do not confuse an asset value with cash available tomorrow."},{"heading":"How assets and liabilities interact","concept":"Assets have different quality, costs, and liquidity.","paragraphs":["An asset is anything with economic value you control or own, but owning it does not guarantee a return. Cash may be stable in dollar terms but lose purchasing power to inflation. A car helps you travel and may be necessary for work, yet its market value typically declines and maintenance consumes cash. A stock offers partial ownership of a business, with uncertain future profits and prices. A home can appreciate, stagnate, or decline while generating ongoing tax, insurance, and repair bills.","A liability is an obligation, not a judgment about whether borrowing was smart. A low-rate mortgage can help a family acquire an asset; a high-interest revolving balance may reduce future options. But both impose future payments, and the benefit depends on what was financed, terms, resilience and opportunity cost.","A useful personal balance sheet records each asset at a realistic estimated market value and each liability at its payoff balance. Do not count a home at its original price forever or list a retirement account at a value that ignores its market movements."],"example":null,"pitfall":"A vehicle worth $14,000 with a $17,000 loan contributes negative $3,000 to net worth. Monthly payments do not prove the asset is worth what you owe.","exercise":null},{"heading":"Buying a home does not create instant wealth","concept":"Follow every dollar through a purchase.","paragraphs":["Suppose a buyer starts with $25,000 in cash and no debt. Their net worth is $25,000. They purchase a $250,000 home with a $12,500 down payment, borrow $237,500 and incur $7,500 of assumed costs. Immediately afterward, they have $5,000 cash and a house worth $250,000, offset by $237,500 of mortgage debt.","The new net worth is $17,500: $5,000 cash plus $12,500 equity. The purchase did not create $250,000 of wealth. Under these simplified assumptions, $7,500 in transaction costs reduced net worth. Actual accounting can vary with prepaid costs, property valuation and items that retain economic value.","Equity is home value minus mortgage debt. Equity can increase through principal repayment or appreciation, but appreciation is never guaranteed. Moreover, selling usually costs money. You should not equate appraised equity with proceeds you could put into your bank account today."],"example":[["Starting wealth","$25,000 cash"],["Closing cash used","$12,500 down + $7,500 costs = $20,000"],["After purchase","$5,000 cash + $12,500 equity = $17,500 net worth"]],"pitfall":"If the home value falls 10% before meaningful principal payments, the $25,000 price decline more than wipes out the initial equity.","exercise":null},{"heading":"Cash flow can make you property-rich and cash-poor","concept":"Owning an asset creates obligations.","paragraphs":["Suppose the same household takes home $4,000 per month. Housing consumes $2,350 after taxes and insurance, and all other essential costs consume $1,450. The monthly margin is $200. On paper, their equity may grow as the mortgage is paid down, but a $3,000 furnace repair could require fifteen months of that entire surplus.","That is why planners distinguish solvency from liquidity. Solvency asks whether total assets exceed total debts. Liquidity asks how quickly money can cover a bill. Your financial position can be positive but fragile if most assets are inaccessible without penalties, borrowing, sale costs or market risk.","Emergency savings are not wasted just because a mortgage down payment could have been larger. The cash reserve can prevent expensive borrowing or forced asset sales. A home purchase is a collection of decisions about price, financing, insurance, monthly cash margin and reserves—not just whether a lender offers approval."],"example":[["Net monthly income","$4,000"],["Housing and other essentials","$2,350 + $1,450 = $3,800"],["Monthly margin","$200"],["$3,000 repair","15 months of that margin"]],"pitfall":null,"exercise":"Calculate how many months your available cash could cover core expenses if income stopped."},{"heading":"Changes in net worth have several causes","concept":"Distinguish progress from market movement.","paragraphs":["If a $200,000 investment portfolio rises 8%, its value goes up $16,000 without new savings. If the market then falls 20%, the same portfolio might be worth $172,800. Neither change tells you what cash the owner earned from work. Conversely, depositing $500 a month can increase net worth while markets do nothing.","Debt principal repayment generally moves value from cash into equity, ignoring interest and other costs. Interest payments are expenses; they do not directly build equity. A good financial review separates new savings, market gains or losses, debt reduction, income, taxes and fees so the sources of progress are visible.","Inflation complicates the picture. A nominal net worth of $100,000 now and $120,000 many years later is not necessarily 20% more buying power. Real wealth depends on what that money will purchase, not merely the account balance. This leads directly to lessons on time value of money, investing and financial planning."],"example":null,"pitfall":"Do not call an increase in property value “guaranteed retirement income.” You must still decide whether and how to turn value into spendable resources.","exercise":null},{"heading":"From personal wealth to generational wealth","concept":"Ownership, transfer and protection are separate problems.","paragraphs":["Generational planning starts by determining what is actually owned, what debts encumber it, and who depends on it. Then it asks how ownership or benefits should pass to other people, whether a will, beneficiary designation, trust or another legal arrangement is appropriate, and how taxes, disability benefits and creditors may affect the outcome.","A trust is not an investment return. It is a legal arrangement that can control management and distribution of assets. Putting a home into a trust does not eliminate its mortgage, property tax, insurance or maintenance. Depending on the trust and loan agreement, transfers and retained control can have important consequences.","A practical legacy plan considers sufficient insurance, an emergency fund, records of assets and debts, beneficiary coordination, and a plan for the person receiving the property. A daughter inheriting a house also needs resources to pay insurance, taxes and repairs. A valuable asset without a cash plan can become a burden."],"example":null,"pitfall":null,"exercise":"Explain in your own words: what is the difference between passing a house to someone and giving that person enough resources to keep it?"}],"sources":["https://www.consumerfinance.gov/owning-a-home/","https://www.investor.gov/introduction-investing/investing-basics/investment-products","https://www.cfp.net/certification-process/education-requirement"]},"L2.S3":{"title":"The Anatomy of a Mortgage","pages":[{"heading":"The mortgage has several separate moving parts","concept":"The payment advertisement is not the ownership budget.","paragraphs":["A fixed-rate mortgage has a principal balance, an interest rate and a term. The scheduled principal-and-interest payment is calculated so the loan amortizes over its term. But homeownership adds property tax, homeowners insurance, possible mortgage insurance, association fees, maintenance, utilities and one-time closing costs.","Banks often collect property taxes and insurance through an escrow account. Escrow is not an extra loan payment: it is money set aside to pay those bills as they come due. The combined total sent to the lender may rise even if the interest rate is fixed, because taxes and insurance can change. Some costs, such as HOA dues, may be billed outside the lender payment entirely.","Always look for the estimated total payment and cash to close on the Loan Estimate, then build your own budget for additional ownership costs. A lender approval is not the same as a guarantee that the home suits your circumstances."],"example":null,"pitfall":"Comparing two offers by the advertised principal-and-interest amount can hide much higher taxes, insurance, mortgage insurance or upfront points.","exercise":null},{"heading":"Why the first payments barely reduce debt","concept":"Interest is based on the balance still outstanding.","paragraphs":["For a $237,500 mortgage at an illustrative 6.5% annual fixed rate for 30 years, the monthly principal-and-interest payment is about $1,501.16. In the first month, interest equals $237,500 multiplied by 6.5% divided by 12, or about $1,286.46. Only about $214.70 of the first payment reduces the balance.","That pattern is called amortization. The scheduled payment stays constant, but each payment reduces principal, leaving less balance on which to charge the following month’s interest. Over time, the interest share falls and principal share rises. If you sell early, you may have paid substantial interest while reducing relatively little principal.","A payment calculator can estimate the schedule, but your actual loan contract governs. Adjustable-rate loans, interest-only periods, balloon clauses, lender fees and prepayment terms can change the results."],"example":[["Illustrative original balance","$237,500"],["Monthly P&I","$1,501.16"],["Month 1 interest","$1,286.46"],["Month 1 principal","$214.70"]],"pitfall":null,"exercise":"Why is “I made twelve payments” not the same as “my debt fell by twelve payments”?"},{"heading":"Escrow, insurance and the true monthly budget","concept":"Your total monthly cost has more categories than the loan.","paragraphs":["Suppose monthly property taxes are $525, homeowners insurance is $150 and mortgage insurance is $95. Add those to the $1,501.16 principal-and-interest payment and the amount routed through the lender might be about $2,271.16. Now assume you separately reserve $210 a month toward maintenance. Your planning cost is approximately $2,481.16 before utilities and any HOA dues.","A maintenance reserve is not a bank bill, but the cash eventually becomes necessary. Roofs, heating systems and plumbing do not wait for convenient paycheck dates. An affordable purchase must include expected repairs and adequate savings for emergencies, not just the monthly loan payment.","Taxes should be estimated from the actual property and jurisdiction rather than broad state averages. Insurance premiums depend on risk, coverage, deductible and insurer. Ask for property-specific quotes and any flood or other special coverage requirements before committing."],"example":[["Principal + interest","$1,501.16"],["Taxes + insurance + mortgage insurance","$525 + $150 + $95"],["Estimated lender payment","$2,271.16"],["Plus maintenance reserve","$2,481.16 planned housing cost"]],"pitfall":"A seller’s tax bill may not reflect taxes after a sale or reassessment. Local rules matter.","exercise":null},{"heading":"APR, points and closing costs","concept":"The lowest advertised interest rate may cost more.","paragraphs":["The interest rate controls the interest calculation on principal. Annual percentage rate (APR) is a broader standardized measure that incorporates specified finance charges under lending rules. The APR helps compare offers but is not the same as your contractual note rate, and it does not capture every cost of owning the property.","Some lenders offer a lower rate if you pay discount points upfront. A point typically means 1% of the loan amount, so one point on a $237,500 loan is $2,375. Whether it is worth paying depends on the actual payment savings, how long you keep the loan and the competing uses of that cash.","Imagine a discount saves $45 monthly but costs $2,375 upfront. The simple break-even is about 53 months, ignoring time value, tax differences and other factors. Refinancing or selling earlier can eliminate the expected benefit. Ask both lenders for comparable Loan Estimates on the same day with the same loan type, term and assumptions."],"example":[["Upfront point cost","$2,375"],["Hypothetical monthly saving","$45"],["Simple break-even","$2,375 ÷ $45 ≈ 53 months"]],"pitfall":"Lender credits work in the opposite direction: less cash at closing may come with a higher rate. There is no universally cheapest structure.","exercise":null},{"heading":"Assistance programs interact with the mortgage","concept":"A down-payment grant and a second lien are not interchangeable.","paragraphs":["A first-time buyer program can help reduce initial cash needed, but assistance may be a grant, a forgivable loan, a deferred loan, or a repayable second mortgage. The headline amount does not reveal who must repay, when repayment starts or which events trigger it.","For example, a $15,000 deferred second loan may require no monthly payment while you remain in the home but come due upon sale, refinancing or other specified events. A $10,000 grant might have no repayment obligation if all conditions are satisfied. The $15,000 headline looks larger, but it may create a future debt and restrictions on your options.","Some programs require occupancy for a minimum period, approved lenders, homebuyer education or location and household-income criteria. A deed transfer into a trust may create extra issues under the assistance agreement even where other mortgage laws provide certain transfer protections. Never transfer title without reviewing both sets of documents."],"example":null,"pitfall":null,"exercise":"For any assistance offer, write four questions: Who owns the debt? When is it repayable? What triggers repayment? What happens if we refinance or transfer title?"},{"heading":"A mortgage is a long-term cash-flow commitment","concept":"Evaluate resilience rather than the maximum approval.","paragraphs":["A family might qualify for a $250,000 purchase yet struggle when insurance rises, a car breaks down or one paycheck is missed. Build three scenarios: normal month, income-reduction month and major-repair month. Check the home payment and minimum expenses in each scenario, as well as how much liquid cash remains after closing.","Consider the opportunity cost of a larger down payment. Paying extra toward principal can reduce interest but also ties up cash that is expensive to access again. A smaller down payment preserves reserves but can increase interest, mortgage insurance and exposure to falling property prices. The best choice depends on loan pricing, job stability, liquidity and personal risk tolerance.","The financial planner’s job is to compare written offers and constraints—not to make assumptions based on a slogan such as “rent is throwing money away.” Renting can preserve flexibility and reduce maintenance risk; ownership can offer stability and potential appreciation, but involves transaction costs and concentrated risk."],"example":null,"pitfall":null,"exercise":"Create two purchase budgets with different down payments. Include cash remaining at closing and a major repair. Decide which is more survivable, not merely which has the lower payment."}],"sources":["https://www.consumerfinance.gov/ask-cfpb/how-does-paying-down-a-mortgage-work-en-1943/","https://www.consumerfinance.gov/ask-cfpb/on-a-mortgage-whats-the-difference-between-my-principal-and-interest-payment-and-my-total-monthly-payment-en-1941/","https://www.consumerfinance.gov/owning-a-home/loan-estimate/"]},"L8.S2":{"title":"Reading the Three Financial Statements","pages":[{"heading":"A business tells three connected financial stories","concept":"Profit, financial position and cash movement are related but not identical.","paragraphs":["Before buying an individual stock, ask what economic activity you are buying. A business sells goods or services, pays costs, invests in assets, borrows or repays money and may distribute cash to owners. The income statement, balance sheet and cash flow statement describe different dimensions of these activities.","The income statement measures revenue and expenses over a period. The balance sheet is a snapshot of assets, liabilities and shareholders’ equity on a date. The cash flow statement explains where cash came from and where it went over a period. A separate shareholders’ equity statement describes changes in owners’ claims.","You need all three because a company can report accounting profits while running short of cash, hold plenty of cash while losing money, or own valuable equipment financed with risky debt. No single number proves investment quality."],"example":null,"pitfall":null,"exercise":"When a company says “sales increased,” ask whether margins, cash flow and debt improved too."},{"heading":"Follow the income statement from sales to profit","concept":"Revenue is not earnings, and earnings are not automatically cash.","paragraphs":["Suppose a company reports $1.2 million of revenue and $720,000 cost of goods sold. Gross profit is $480,000, producing a gross margin of 40%. The company still pays salaries, rent, technology, advertising and other operating costs. If those amount to $300,000, operating income is $180,000.","Now assume $20,000 of interest expense and a hypothetical $40,000 income-tax expense. Net income becomes $120,000. That is 10% of sales. But taxes depend on actual jurisdictions and accounting, and every line must be checked for one-time items, estimates and changing business conditions.","Margins help compare businesses. Gross margin focuses on the economics of delivering a product; operating margin incorporates recurring operating costs; net margin reflects financing, taxes and other items too. A great company may have low margins and huge volume; a seemingly high margin may conceal fragile demand."],"example":[["Revenue","$1,200,000"],["Gross profit","$1,200,000 − $720,000 = $480,000"],["Operating income","$480,000 − $300,000 = $180,000"],["Net income","$180,000 − $20,000 − $40,000 = $120,000"]],"pitfall":"Never compare a retailer’s gross margin to a software firm’s as though the underlying cost structure were identical.","exercise":null},{"heading":"The balance sheet reveals obligations","concept":"Resources and claims must balance.","paragraphs":["The fundamental relationship is assets = liabilities + shareholders’ equity. Imagine a business with $900,000 of assets, $530,000 of liabilities and $370,000 of equity. Assets might include inventory, receivables, cash and machinery. Liabilities might include bank loans, supplier bills, taxes and lease obligations.","Some assets may not be easy to turn into cash. Accounts receivable are amounts customers owe; collection can be delayed or uncertain. Inventory may be slow-moving or obsolete. Meanwhile, short-term debt and supplier bills can become due soon. An analyst pays attention to timing, not just totals.","Working capital is current assets minus current liabilities. It helps you ask whether near-term obligations can be met with near-term resources, but a large working-capital figure is not always positive if it consists of unsellable inventory. Cash availability and cash conversion matter."],"example":[["Assets","$900,000"],["Liabilities","$530,000"],["Shareholders’ equity","$370,000"]],"pitfall":null,"exercise":"List three reasons a company could show positive equity but still struggle to make payroll."},{"heading":"Cash flow catches problems income misses","concept":"Accounting earnings and cash movement follow different timing rules.","paragraphs":["Accrual accounting often recognizes revenue when goods or services are delivered rather than when cash is collected, and records expenses in the periods they relate to. If a customer buys on credit, revenue can appear before cash arrives. Buying inventory also uses cash, even if the goods have not yet been sold and expensed through cost of goods sold.","Take the $120,000 net income example. Add back $25,000 of noncash depreciation, subtract a $70,000 increase in receivables and a $40,000 increase in inventory, then add a $10,000 increase in payables. Under this simplified reconciliation, operating cash flow is just $45,000.","If the company also spent $80,000 on capital equipment, a rough operating-cash-flow-minus-capital-expenditure measure is negative $35,000. Different businesses have different needs for reinvestment, and “free cash flow” is not defined identically by every company. Read the calculation they actually use."],"example":[["Net income","$120,000"],["+ depreciation − receivables − inventory + payables","+$25,000 − $70,000 − $40,000 + $10,000"],["Cash from operations","$45,000"],["Less capital expenditure","$80,000"],["Simplified free cash flow","−$35,000"]],"pitfall":"A company reporting record earnings can still need new borrowing or share issuance to finance growth.","exercise":null},{"heading":"Read the 10-K as a skeptical investor","concept":"Narrative, footnotes and accounting choices explain the numbers.","paragraphs":["For U.S. public companies, the annual Form 10-K provides a business description, risk factors, management discussion and analysis (MD&A), audited financial statements and notes. Start with what the company does, what makes customers pay it and why rivals cannot easily take the business. Then connect that story to reported sales, cash flow, leverage and investment.","Look for debt maturity schedules, customer concentration, stock-based compensation, changes in accounting assumptions, share dilution, pension obligations, acquisition-related charges and management’s definition of adjusted earnings. Neither “adjusted” nor “GAAP” automatically tells the whole story without context.","Compare at least three periods where available. Is growth consistent? Are receivables growing faster than sales? Are earnings supported by cash? Is share count rising? Does management discuss risks honestly? The goal is to build a defensible explanation of the business, not find a magical valuation ratio."],"example":null,"pitfall":null,"exercise":"Open a public company’s 10-K on SEC EDGAR. In your own words, summarize its business, one major risk and one possible mismatch between earnings and cash flow."},{"heading":"Convert financial analysis into an investment decision","concept":"A profitable business is not automatically a cheap stock.","paragraphs":["Market price is what someone will pay for ownership today; intrinsic value is an estimate of what the enterprise’s future economics are worth. A company may be excellent but overpriced. Another may appear inexpensive because its profits are about to deteriorate. Estimating value requires assumptions about growth, margins, reinvestment, interest rates and competitive risks.","Ratios such as price-to-earnings, debt-to-equity and return on invested capital can help frame a question, but are easy to misuse. A company with temporary earnings may show a distorted price-to-earnings ratio. Debt ratios differ by industry and lease treatment. Strong returns may reflect a mature franchise or an accounting denominator with unusual history.","Before investing, write a thesis: what must happen for the stock to justify its current price, what could go wrong, what evidence would prove the thesis wrong, and what share of a diversified portfolio you are willing to risk. Good analysis includes a decision not to invest when uncertainty or price is too high."],"example":null,"pitfall":null,"exercise":"Prepare a one-page investment note with business model, profit trend, cash-flow trend, risks, valuation assumptions and reasons for waiting."}],"sources":["https://www.sec.gov/files/investor/pubs/begfinstmtguide.htm","https://www.investor.gov/introduction-investing/getting-started/researching-investments/how-read-10-k","https://www.sec.gov/edgar/search/"]},"L11.S3":{"title":"Capital Gains, Basis & Dividends","pages":[{"heading":"Taxes depend on what happened and where the asset is held","concept":"The same stock can create different tax results in different accounts.","paragraphs":["In a regular taxable brokerage account, interest, dividends, sales and some fund distributions can create tax consequences. In a qualified retirement account, the tax timing may follow a different set of rules. A Roth IRA and a traditional IRA are not identical; contributions, withdrawals, qualifications and exceptions matter.","The first distinction is between an unrealized change in market value and a realized disposition. If stock you bought for $5,000 is now worth $7,000 and you still hold it, the $2,000 price increase generally has not yet created a sale-based capital gain. Selling may realize a gain, while dividends may be taxable even if reinvested. Special transactions and rules can change outcomes.","A tax-aware investor asks which asset is held in which account, expected trading frequency, available losses, state residence and future withdrawal plans. “Tax-free” is a term to verify carefully, not a blanket description of investing."],"example":null,"pitfall":"Do not mistake a lack of sales for a lack of investment tax reporting. Dividends and fund distributions can be taxable while holdings remain in the account.","exercise":null},{"heading":"Cost basis determines your gain or loss","concept":"Reconstruct the money invested before calculating tax.","paragraphs":["Suppose you purchase 100 shares at $50 each and pay $10 of purchase transaction fees included in basis. Your total cost basis is $5,010, or $50.10 per share. Later, you sell all 100 shares at $70 each and incur $10 of selling costs. Your amount realized is $6,990, so the illustrated capital gain is $1,980.","Real tax basis can be adjusted by stock splits, reinvested dividends, certain corporate actions, return-of-capital distributions and other events. Each new dividend-reinvestment purchase generally creates an additional tax lot with its own cost basis and holding period. This is one reason why records matter even when a brokerage displays a simple average.","If you sell only some shares, identifying which lot was sold can affect reported gain, within permitted rules and your broker’s procedures. A gain calculation is not the same as the tax amount; applicable rates and offsets depend on your circumstances."],"example":[["Purchase basis","$5,000 shares + $10 qualifying transaction costs = $5,010"],["Amount realized","$7,000 proceeds − $10 selling costs = $6,990"],["Illustrated capital gain","$1,980"]],"pitfall":null,"exercise":"If another 100-share lot cost $60 per share, why could choosing which lot is sold matter to taxes?"},{"heading":"Holding period changes federal capital-gain treatment","concept":"The calendar and the type of asset matter.","paragraphs":["For ordinary investment stock, a holding period of more than one year generally produces a long-term capital gain or loss; one year or less generally means short-term. Long-term gains for individuals can receive preferential federal rates depending on income and other rules. Short-term gains are generally taxed at ordinary income rates.","The sale date and purchase date matter, and the rules have detailed exceptions for special transactions and types of property. Some taxpayers may face additional taxes such as the net investment income tax. States can impose their own income taxes, often without replicating federal preferential rates.","Do not plan using a tax-rate table without checking the correct tax year, filing status, taxable income, asset category and state. Tax thresholds change, and most tax decisions interact with the rest of the return."],"example":null,"pitfall":"A person who expects a 15% federal long-term capital-gains rate may still owe additional state tax or other applicable federal taxes; “15% total” is not a safe assumption.","exercise":null},{"heading":"Dividends are not all the same","concept":"What is distributed may affect tax treatment and basis.","paragraphs":["Companies may pay dividends from earnings, and mutual funds or ETFs may distribute dividend income or capital gains. Certain dividends qualify for preferential federal rates when statutory requirements are met, including rules concerning the paying company and how long the investor held the shares. Other dividends are taxed as ordinary income.","If you receive a $200 dividend and use it to purchase additional shares in a taxable account, that reinvestment usually does not make the original dividend nontaxable. The dividend may create taxable income; the new shares generally have their own cost basis and purchase date.","Some distributions are classified as returns of capital, which can reduce basis rather than being treated like ordinary dividends, subject to applicable rules. Your brokerage’s Forms 1099 and issuer information are a starting point, but the classifications can sometimes be corrected."],"example":[["Dividend received","$200"],["Automatically reinvested","$200 buys additional shares"],["Tax consideration","Reinvestment generally does not itself erase taxable dividend income"]],"pitfall":null,"exercise":"Explain why choosing “reinvest dividends” is an investment setting, not a promise that dividends will be tax-free."},{"heading":"Losses and wash sales require care","concept":"Selling at a loss is not a universal tax deduction.","paragraphs":["Capital losses can offset capital gains under federal rules, and a limited amount of net capital loss may generally offset certain other income, with unused amounts carried forward in many circumstances. The amount and ordering depend on the taxpayer and transaction, so losses should be tracked as carefully as gains.","The wash-sale rule may disallow an immediate loss deduction when you sell or trade stock or securities at a loss and acquire substantially identical stock or securities during the applicable window around the sale. The rule can be triggered by purchases in other accounts, including certain retirement-account transactions, with potentially different consequences.","Do not purposely manufacture losses without understanding fees, market exposure, tracking of substantially identical assets, and the rules for basis adjustments. An apparent tax saving can be much smaller than the economic cost or risk."],"example":null,"pitfall":"A brokerage 1099 may not identify every wash sale across different accounts or institutions. The taxpayer remains responsible for accurate reporting.","exercise":null},{"heading":"Estate and gifting strategies change the analysis","concept":"Basis planning and ownership transfer are intertwined.","paragraphs":["Inherited property commonly receives a basis measured under rules tied to fair market value at death, subject to important exceptions. Gifted property often carries over all or part of the donor’s basis for gain computations, with special rules for losses and other adjustments. These differences can be substantial when assets have appreciated for decades.","That does not mean “put assets into a trust and they automatically get a step-up.” Basis treatment can depend on ownership, estate inclusion, type of trust and the transfer. Likewise, transferring appreciated stock to a child can create tax, control, financial-aid or benefit eligibility consequences.","Good tax planning begins with the full family objective: who needs income now, who should control assets, what tax brackets may apply later, and which legal instrument actually meets the goal. Coordinate investment taxes, estate law, account beneficiaries and trust documents before making transfers."],"example":null,"pitfall":null,"exercise":"Describe how selling an appreciated asset, gifting it during life and leaving it at death could lead to different basis and control outcomes. Identify what must be verified by a tax professional."}],"sources":["https://www.irs.gov/publications/p550","https://www.irs.gov/publications/p551","https://www.irs.gov/publications/p590b"]},"L4.S1":{"title":"Stocks, Funds, and Ownership","pages":[{"heading":"What you actually own","concept":"Investing is purchasing financial claims with uncertain future outcomes.","paragraphs":["Common stock generally represents an ownership interest in a company, potentially including voting rights and residual claims on future profits. Shares can rise or fall because of changing business fundamentals, interest rates, industry conditions or investor expectations. Stock ownership is different from making a bank deposit; investors are not promised repayment of the original amount.","A bond usually represents a debt claim with specified payment terms, although an issuer can default. A mutual fund or exchange-traded fund pools investor money to hold multiple underlying assets according to a defined strategy. An ETF share is a claim on the fund, not a direct personal certificate for every stock it holds.","The first investment question is not “Which stock will jump?” It is what job the money must do, when it may be needed, and how much loss the investor could withstand without abandoning the plan."],"example":null,"pitfall":null,"exercise":"Label three different dollars: emergency money needed soon, home down-payment money within two years and retirement money decades away. Why might each need a different approach?"},{"heading":"Index funds and active funds","concept":"Diversification changes exposure, not the existence of risk.","paragraphs":["A broad stock index fund seeks to follow a basket of securities through a published index methodology. It can reduce single-company concentration, but may remain exposed to large market declines, sector concentration or other risks. An actively managed fund uses manager decisions to choose holdings, potentially outperforming or underperforming its benchmark after costs.","Funds have different investment objectives, expense ratios, turnover, tax distributions and holdings. Two products labeled “S&P 500 fund” may differ in fees, structure and tracking quality; products labeled “balanced fund” may take very different amounts of risk. Read the prospectus and portfolio rather than just the category name.","Owning several funds does not guarantee real diversification if they all hold the same large stocks. Look through the underlying holdings and asset classes: domestic equities, international equities, government bonds, corporate credit, cash and other assets behave differently across conditions."],"example":null,"pitfall":"Buying five technology-focused funds may concentrate your money in the same companies rather than diversify it.","exercise":null},{"heading":"Returns include both price and cash distributions","concept":"Price charts alone can understate or overstate the investing experience.","paragraphs":["A stock bought at $80 and sold at $92 has a $12 price gain per share. If it also distributed $3 in dividends while held, the pre-tax, pre-fee total economic return is $15 per $80 invested, or 18.75%, assuming distributions are not reinvested and ignoring timing effects.","Dividends are not free additional wealth detached from the value of the company. Prices commonly adjust when shares begin trading without the right to receive a declared dividend, while market movements can obscure the adjustment. A dividend-focused investment can still lose money overall.","Use total-return figures when comparing investments, and be precise about whether dividends are reinvested and how fees and taxes are treated. Historical total returns are observations, not forecasts."],"example":[["Purchase price","$80"],["Sale proceeds","$92"],["Cash dividends received","$3"],["Simplified total return","($92 + $3 − $80) / $80 = 18.75%"]],"pitfall":null,"exercise":"Why might a high dividend yield be a warning sign if a company’s share price collapsed because of financial trouble?"},{"heading":"Fees and compounding compound together","concept":"Small annual percentages become large long-term differences.","paragraphs":["Assume someone invests $250 at the end of each month for 20 years. At a hypothetical consistent annual return of 6%, compounded monthly, the balance is about $115,510 before taxes and fees. At 5%, it is about $102,758. Just one percentage point of annualized difference produces roughly $12,752 less at the end of this example.","That difference could result from fees or from investment performance. It is not a promise that a particular fund will return either rate. Real markets move unpredictably, and fund fees are not always the only cost: trading expenses, spreads and taxable distributions can matter.","Long time horizons magnify growth and also magnify the effects of investment decisions. Lower expense ratios can be useful when products provide genuinely comparable exposure, but fee minimization alone is not a complete investment strategy."],"example":[["Contributions","250 × 240 months = $60,000"],["Hypothetical 6% balance","$115,510"],["Hypothetical 5% balance","$102,758"],["Illustrative difference","$12,752"]],"pitfall":null,"exercise":"Compare two genuinely similar funds by their expense ratio, tracking performance and underlying holdings."},{"heading":"Losses require disproportionate recovery","concept":"Volatility matters because decisions are made by humans.","paragraphs":["If a $10,000 investment falls 30%, it is worth $7,000. A 30% recovery on $7,000 would only restore $2,100, leaving $9,100. To get back to $10,000, the remaining balance must gain approximately 42.86%. This math matters because a large drawdown can delay a near-term goal or cause a frightened investor to sell at a bad time.","An investment plan should specify the mix of stocks, bonds and accessible cash appropriate to goals and risk capacity. Rebalancing means periodically restoring target allocations instead of letting winners or losses unintentionally dictate all future exposure.","Risk tolerance is the emotional willingness to handle volatility. Risk capacity is the financial ability to survive a loss. A person may enjoy speculation but lack the capacity to risk money needed for a near-term home purchase."],"example":[["Starting balance","$10,000"],["After 30% decline","$7,000"],["Gain needed to break even","$3,000 / $7,000 ≈ 42.86%"]],"pitfall":"Past average stock returns cannot justify placing a required near-term down payment entirely in equities.","exercise":null},{"heading":"Construct a portfolio for a goal, not a story","concept":"A repeatable policy beats chasing headlines.","paragraphs":["A simple investment policy identifies the objective, planned contributions, time horizon, target asset mix, maximum acceptable drawdown, rebalancing rule, tax-account placement and conditions for changing the strategy. It can include broad low-cost funds, but there is no single portfolio appropriate for everyone.","Before adding a product, ask which risk or return source it introduces, what it costs, how liquid it is, how it is taxed and which alternatives perform the same job. Be cautious with leverage, options, illiquid private investments and products described as safe or guaranteed without a clear explanation of the guarantor and restrictions.","The strongest beginner skill is not guessing winners. It is understanding what you own, why you own it, how the investment fits your life and what you will do if the market drops sharply."],"example":null,"pitfall":null,"exercise":"Draft an investment policy for a fictional household saving for retirement in 25 years and a house in three years. Keep those two objectives separate."}],"sources":["https://www.investor.gov/introduction-investing/investing-basics/investment-products/mutual-funds-and-exchange-traded-funds","https://www.investor.gov/introduction-investing/investing-basics/investment-products/stocks","https://www.investor.gov/introduction-investing/investing-basics/investment-products/bonds"]},"L3.S2":{"title":"Revocable vs. Irrevocable","pages":[{"heading":"The trust is a set of rules, not an asset class","concept":"Learn who owns, controls and benefits from property.","paragraphs":["A trust is a legal relationship: someone establishes terms, a trustee holds or manages assets under those terms, and beneficiaries receive rights or benefits. A trust can own a bank account, home, brokerage account or other property, but creating a document does not automatically fund it. Title changes and beneficiary designations must be coordinated.","The trust’s name does not reveal what it accomplishes. Important questions include who may amend it, who may distribute assets, who pays income taxes, who can remove the trustee, and what occurs when the person establishing the trust dies or becomes incapacitated.","A trust can be useful for continuity and distribution control, but it does not create an investment return. The assets still experience market risk, expenses and legal obligations."],"example":null,"pitfall":null,"exercise":"Name the grantor, trustee, beneficiary and property in a hypothetical family trust. Could one person fill more than one role?"},{"heading":"Revocable trust: flexibility with limits","concept":"Control has a cost when creditor or tax planning is the goal.","paragraphs":["A revocable living trust generally lets the creator change or revoke its terms while capable. It is commonly used for management during incapacity and distribution after death, and may avoid probate for assets correctly titled to the trust. However, property still needs to be legally transferred to the trust or otherwise coordinated; an unfunded trust cannot control an asset it does not own.","Because the creator often retains substantial control and benefit, a revocable trust typically does not protect their own assets from their creditors. For federal income-tax purposes, a standard revocable grantor trust is generally treated as owned by the grantor. It normally does not make income disappear from taxation.","A will may still be needed to handle property left outside the trust and other matters. Probate and trust rules differ by state, including how debts are paid and when information becomes public."],"example":null,"pitfall":"A document labeled “living trust” is not proof that a house was deeded correctly or that mortgage and insurance obligations were coordinated.","exercise":null},{"heading":"Irrevocable trust: different tradeoffs","concept":"Giving up powers can change legal and tax treatment, but details govern.","paragraphs":["An irrevocable trust generally cannot be changed or revoked as freely as a revocable one, though state law and the document may offer modification mechanisms. Some structures can support specific estate, charitable or asset-protection objectives; others are designed for a beneficiary with special needs or particular distribution restrictions.","Whether assets are protected from a creditor or excluded from an estate depends on retained powers, beneficial interests, applicable state law, timing, fraudulent-transfer rules, and federal tax provisions. Simply declaring a trust irrevocable does not guarantee those outcomes.","Irrevocable structures may introduce separate tax reporting, professional fees, trustee responsibilities, constraints on selling property and difficult decisions for a family. The relevant question is not “Which trust is better?” but which legal powers you need to keep and which you may be willing or permitted to relinquish."],"example":null,"pitfall":null,"exercise":"Write down one practical advantage and one disadvantage of allowing someone else to control property distributions."},{"heading":"The trust’s tax identity is not a magic shield","concept":"Grantor, non-grantor and estate rules must be separated.","paragraphs":["Federal tax rules distinguish grantor trusts, where certain income may be attributed to the grantor, from non-grantor trusts, which can have their own income-tax obligations. Trusts may also face compressed federal income-tax brackets compared with individuals, and state rules may impose additional consequences.","Estate inclusion and income-tax ownership are related questions but not interchangeable. A transfer can be complete for one purpose and still have different consequences for basis, gift tax or estate tax. Basis rules for inherited property also have exceptions and must not be assumed from the name of the trust.","Tax outcomes require analysis of actual governing documents, property, beneficiaries and timing. A strategy that reduces one tax can create another tax, legal cost, loss of control or benefit-eligibility problem."],"example":null,"pitfall":"“Put your house in an irrevocable trust and it becomes tax-free” is not a reliable legal statement.","exercise":null},{"heading":"Mortgages, benefits and transfers create constraints","concept":"Property does not escape its existing contracts.","paragraphs":["A mortgage lien generally remains against real estate when title is transferred. Certain federal protections restrict a lender’s ability to enforce a due-on-sale clause for some transfers into an inter vivos trust where the borrower remains a beneficiary and occupancy rights do not change. That does not guarantee every trust transfer is safe: loan details, assistance-program second liens, insurance and other agreements still need review.","Transfers can matter for Medicaid long-term-care planning and its look-back/transfer rules; Supplemental Security Income and other means-tested programs have their own trust and asset rules. Eligibility questions are technical and highly fact dependent.","A family preparing to help a child should also think about the child’s age, decision-making abilities, creditor exposure, existing benefits, trustee suitability and how distributions will be managed. For a minor or beneficiary with disabilities, the trust design can have consequences far beyond probate."],"example":null,"pitfall":null,"exercise":"Before changing title to a house, identify the mortgage holder, any down-payment assistance lien, insurance provider, tax consequences and beneficiary needs."},{"heading":"Build the decision tree before hiring counsel","concept":"Define the goal, then compare legal tools.","paragraphs":["Start by writing the goal in plain language: avoid a court process after death, plan for incapacity, set age-based distributions for a daughter, manage a home as a family asset, reduce taxes when legally appropriate, or protect a vulnerable beneficiary. Different objectives can require different instruments.","Next, inventory property and debts; collect existing deeds, loan documents and beneficiary designations; then compare wills, revocable trusts, irrevocable trusts, transfer-on-death tools where available and insurance arrangements. Evaluate fees, loss of flexibility, administration and what happens if the family moves to another state.","The best outcome is not necessarily the most complicated trust. A professional estate-planning attorney licensed in the relevant state should be able to explain, in writing, what each recommended clause accomplishes and what it does not."],"example":null,"pitfall":null,"exercise":"Draft three questions for an estate attorney: what objective are we solving, what control do we lose, and which loans or benefits could be affected?"}],"sources":["https://www.irs.gov/instructions/i1041","https://www.irs.gov/publications/p551","https://www.law.cornell.edu/uscode/text/12/1701j-3","https://www.ctprobate.gov/"]}};
const TEXTBOOK_CHECKS={"L1.S1":[{"q":"After buying a $250,000 home with $12,500 down and $7,500 in assumed transaction costs from $25,000 cash, what is simplified net worth immediately afterward?","options":["$250,000","$25,000","$17,500","$12,500"],"answer":2,"why":"The $237,500 mortgage offsets most home value; $5,000 cash plus $12,500 equity equals $17,500. The costs reduced wealth."},{"q":"Which situation best demonstrates a liquidity problem?","options":["Strong net worth but not enough accessible money to cover repairs","All bills paid with substantial cash reserves","Income exceeding expenses with no debt","Home equity increasing due to principal repayment"],"answer":0,"why":"A home or retirement account can contribute to positive net worth while accessible cash remains insufficient."},{"q":"Which payment directly reduces the balance of a typical amortizing mortgage?","options":["Homeowners insurance","Mortgage principal","Property tax escrow","Mortgage interest"],"answer":1,"why":"Principal repayment reduces the debt. Interest, taxes and insurance are separate costs."}],"L2.S3":[{"q":"About how much of the first $1,501.16 payment on a $237,500 mortgage at 6.5% goes to principal?","options":["$1,286","$1,501","$215","$525"],"answer":2,"why":"First-month interest is about $1,286.46, leaving $214.70 of the principal-and-interest payment to reduce the balance."},{"q":"Which mortgage cost may change even when the note rate and scheduled principal-and-interest payment are fixed?","options":["Property tax escrow","The original loan term","The fixed contractual rate","The original principal balance"],"answer":0,"why":"Property taxes and insurance premiums can change, raising the total payment collected in escrow."},{"q":"A point costs $2,375 and saves $45 a month. What is the simple break-even, ignoring time value and other effects?","options":["About 26 months","About 53 months","About 12 months","About 100 months"],"answer":1,"why":"$2,375 divided by $45 per month is approximately 52.8 months."}],"L8.S2":[{"q":"A company has $1.2 million sales and $720,000 cost of goods sold. What is its gross profit?","options":["$480,000","$720,000","$1,200,000","$180,000"],"answer":0,"why":"Gross profit equals revenue minus cost of goods sold: $1,200,000 − $720,000 = $480,000."},{"q":"Which event can make accounting profit larger than operating cash inflow?","options":["Collecting an old receivable","Selling products on credit without immediate cash collection","Paying off trade payables","Raising new common stock"],"answer":1,"why":"Accrual revenue may be recognized before customers pay, increasing receivables and not current cash."},{"q":"If operating cash flow is $45,000 and capital expenditure is $80,000, what is simple free cash flow?","options":["$125,000","$45,000","$35,000 negative","$80,000"],"answer":2,"why":"Under operating-cash-flow-minus-capex, $45,000 − $80,000 = −$35,000."}],"L11.S3":[{"q":"A purchase basis of $5,010 and sale amount realized of $6,990 imply which gain before further adjustments?","options":["$1,980","$2,000","$6,990","$5,010"],"answer":0,"why":"Amount realized minus adjusted basis is $6,990 − $5,010 = $1,980."},{"q":"What generally happens when a taxable-account dividend is automatically reinvested?","options":["Reinvestment always cancels dividend income tax","The dividend may still be taxable and new shares acquire basis","A dividend becomes a deductible capital loss","The shares always qualify for long-term rates immediately"],"answer":1,"why":"Reinvesting buys shares; it does not generally erase taxable dividend income. The purchase creates basis in the new lot."},{"q":"Which statement best reflects the wash-sale issue?","options":["Loss deductions are always allowed if a position is repurchased immediately","It only concerns cash accounts, never retirement accounts","It may disallow an immediate loss when substantially identical securities are acquired during the applicable window","Any 30% market decline creates a wash sale"],"answer":2,"why":"The wash-sale rule can affect loss recognition when substantially identical securities are acquired around a loss sale."}],"L4.S1":[{"q":"An asset bought at $80, sold at $92 and paying $3 cash dividends has what simplified total return?","options":["15%","18.75%","12%","3.75%"],"answer":1,"why":"Total return is ($92 + $3 − $80) / $80 = $15 / $80 = 18.75%."},{"q":"An investment drops from $10,000 to $7,000. About what percent must it then gain to recover to $10,000?","options":["30%","23.08%","42.86%","70%"],"answer":2,"why":"It needs $3,000 on a $7,000 base, or about 42.86%."},{"q":"Which collection is most likely to be broadly diversified by asset class?","options":["Three different funds all concentrated in the same ten technology firms","A mix of broad global stocks, high-quality bonds and liquidity reserves","Only the shares of the investor’s employer","Five leveraged funds in one sector"],"answer":1,"why":"Diversification across economic exposures means different asset classes, not simply holding multiple product labels."}],"L3.S2":[{"q":"What usually describes a basic revocable living trust during the grantor’s life?","options":["The grantor often retains the power to amend or revoke it","The grantor automatically pays no federal income tax","The home mortgage always disappears","It is always protected from all grantor creditors"],"answer":0,"why":"A standard revocable trust generally preserves grantor control, which limits several creditor and tax outcomes."},{"q":"Which statement about an irrevocable trust is most accurate?","options":["Its label alone guarantees tax-free growth","It can support certain objectives, depending on retained rights, state law, tax treatment and terms","It must invest only in insurance policies","It cancels existing property liens automatically"],"answer":1,"why":"Specific legal rights and rules determine outcomes; the irrevocable label is not a blanket guarantee."},{"q":"Before transferring a financed home into a trust, what needs review?","options":["Only the furniture inventory","Only the current market valuation","Mortgage terms, assistance liens, insurance, beneficiary needs and legal/tax rules","Only whether the house has increased in value"],"answer":2,"why":"Existing contracts and property obligations continue to matter after title transfers."}]};

function textbookPageIndex(s){

function textbookReader(s){

  <div class="book-navigation"><button type="button" class="secondary" data-chapter-page="${i-1}" ${i===0?'disabled':''}>← Earlier part</button><button type="button" class="primary" data-chapter-page="${i+1}" ${i===total-1?'disabled':''}>Next part →</button></div>
  ${i===total-1?`<div class="book-finished"><strong>End of the chapter</strong><p>You've reached the final reading part. Continue into Examples to connect the cases, then Try It to test your understanding. Mark the section complete when you're satisfied you understand it.</p><div class="note-actions"><button type="button" class="secondary mini-btn" data-tab="Examples">Review cases →</button><button type="button" class="secondary mini-btn" data-tab="Try It">Chapter check →</button></div></div>`:''}
  <details class="book-glossary"><summary>Terminology quick reference</summary>${s.points.map(([k,v])=>`<div class="definition"><strong>${escapeHtml(k)}</strong><p>${escapeHtml(v)}</p></div>`).join('')}</details>

 </div>`;
}
function textbookCases(s){

 return `<div class="article textbook-case"><span class="eyeline">CHAPTER LAB · ${s.id}</span><h2>Work the numbers. Explain the result.</h2><p class="intro">Read the calculation, then describe what it means to a family or investor. Financial reasoning is more than getting the arithmetic right.</p>${cases.map((c,i)=>`<section class="book-case-card"><div class="book-part-label">CASE ${i+1}</div><h3>${escapeHtml(c.heading)}</h3><table class="table-lite"><tbody>${c.example.map(([k,v])=>`<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('')}</tbody></table><p class="book-case-note">${escapeHtml(c.concept)}</p></section>`).join('')}<div class="book-finished"><strong>Practice explaining, not memorizing</strong>${questions.map((q,i)=>`<p><strong>${i+1}.</strong> ${escapeHtml(q.exercise)}</p>`).join('')}<p>Use the Notes tab to write an answer and the ChatGPT handoff to challenge your assumptions.</p></div></div>`;

function textbookPractice(s){
 const qs=TEXTBOOK_CHECKS[s.id];let initial=state.quiz[s.id];

 const answered=qs.filter((q,i)=>a[s.id+'#'+i]!==undefined).length;
 const firstCorrect=initial===s.quiz.answer?1:0;
 return `<div class="article textbook-practice"><div class="eyeline">CHAPTER ASSESSMENT · ${s.id}</div><h2>Prove you understand the decisions.</h2><p class="intro">Four independent checks, including a calculation or practical judgment. Explanations appear after choosing an answer; you can revise your choices.</p><div class="book-score">${answered+(initial!==undefined?1:0)} of ${qs.length+1} answered · ${extraCorrect+firstCorrect} correct so far</div>
 <div class="book-quiz-card"><div class="eyeline">QUESTION 1 OF ${qs.length+1}</div><h3>${escapeHtml(s.quiz.q)}</h3><div class="quizard">${s.quiz.options.map((choice,i)=>`<button class="answer ${initial===i?'chosen':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(choice)}</button>`).join('')}</div>${initial!==undefined?`<div class="feedback"><strong>${initial===s.quiz.answer?'Good reasoning.':'Review the reasoning.'}</strong><p>${escapeHtml(s.quiz.feedback)}</p></div>`:''}</div>
 ${qs.map((q,k)=>{const ans=a[s.id+'#'+k];return `<div class="book-quiz-card"><div class="eyeline">QUESTION ${k+2} OF ${qs.length+1}</div><h3>${escapeHtml(q.q)}</h3><div class="quizard">${q.options.map((choice,i)=>`<button type="button" class="answer ${ans===i?'chosen':''}" data-chapter-answer="${k}" data-chapter-choice="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(choice)}</button>`).join('')}</div>${ans!==undefined?`<div class="feedback"><strong>${ans===q.answer?'Correct application.':'Study this part again.'}</strong><p>${escapeHtml(q.why)}</p></div>`:''}</div>`}).join('')}
 <div class="book-finished"><strong>Recommended mastery target: 3 of 4 correct</strong><p>A score is feedback, not a qualification. If you missed an item, return to the relevant chapter part and explain the reasoning in your own words.</p><button class="secondary wide" data-tab="Notes">Reflect in your notebook →</button></div></div>`;
}
function articleLearn(s){if(TEXTBOOK[s.id])return textbookReader(s);return `<div class="article"><div class="eyebrow" style="color:#537f62">THE CORE IDEA · ${s.id}</div><h2>${escapeHtml(s.title)}</h2><p class="intro">${escapeHtml(s.lead)}</p><h3>What you need to know</h3>${s.points.map(([k,v])=>`<div class="definition"><strong>${escapeHtml(k)}</strong><p>${escapeHtml(v)}</p></div>`).join('')}${deepDive(s)}${academyLearnDepth(s)}${s.action?`<div class="inside"><strong>Put it to work</strong><p>${escapeHtml(s.action)}</p></div>`:''}<div class="inside"><strong>The bottom line</strong><p>Separate the benefits, costs, liquidity and downside risks before making a decision.</p></div></div>`}
function articleExample(s){if(TEXTBOOK[s.id])return textbookCases(s);return `<div class="article"><div class="eyebrow" style="color:#537f62">WORKED EXAMPLE · ${s.id}</div><h2>${escapeHtml(s.example.title)}</h2><p>Work through each input. These are teaching assumptions, not a quote, offer, or forecast.</p><table class="table-lite"><tbody>${s.example.lines.map(([a,b])=>`<tr><td>${escapeHtml(a)}</td><td>${escapeHtml(b)}</td></tr>`).join('')}</tbody></table><div class="inside"><strong>What the numbers mean</strong><p>${escapeHtml(s.example.bottom)}</p></div>${deepCompare(s)}${academyAssignment(s)}<p class="disclaimer">Illustrative figures. Relevant taxes, loan terms, market losses, transaction fees, and legal exceptions may not be included.</p></div>`}
function articlePractice(s){if(TEXTBOOK[s.id])return textbookPractice(s);let ans=state.quiz[s.id];return `<div class="article"><div class="eyebrow" style="color:#537f62">CHECK YOUR UNDERSTANDING</div><h2>Apply what you learned.</h2><p class="intro">${escapeHtml(s.quiz.q)}</p><div class="quizard">${s.quiz.options.map((a,i)=>`<button type="button" class="answer ${ans===i?'chosen':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${escapeHtml(a)}</button>`).join('')}</div>${ans!==undefined?`<div class="feedback"><strong>${ans===s.quiz.answer?'Exactly right.':'Here is the reasoning.'}</strong><br>${escapeHtml(s.quiz.feedback)}</div>`:'<p class="disclaimer" style="margin-top:11px">Choose an answer to see the reasoning. There is no penalty for getting it wrong.</p>'}${academyAssignment(s)}<div style="margin-top:20px"><button class="secondary wide" data-go="tools">Explore the calculators ↗</button></div></div>`}
function articleNotes(s){return `<div class="noteeditor"><div class="eyeline">YOUR NOTES · ${s.id}</div><h3 style="margin:9px 0">What did this make you think about?</h3><p class="muted small">Questions, calculations, and things to investigate. Saved only in this browser.</p><textarea class="note-input" data-note="${s.id}" placeholder="For a home purchase, I wonder whether…">${escapeHtml(state.notes[s.id]||'')}</textarea><div class="note-actions" style="margin-top:12px"><button class="secondary mini-btn" data-chat="${s.id}">Ask ChatGPT ↗</button><button class="secondary mini-btn" data-action="export">Export backup ↓</button></div><p class="help" style="margin-top:12px">Keep your private financial figures out of public repositories. Export backups before switching devices.</p></div>`}
function reader(){const s=activeSection(),m=moduleOf(s.id),idx=sectionIndex(s),p=prog(m),globalIndex=ALL_SECTIONS.findIndex(x=>x.id===s.id),prev=ALL_SECTIONS[globalIndex-1],next=ALL_SECTIONS[globalIndex+1];return `<section class="page"><div class="reader-overhead"><button class="back" data-module="${m.id}">← ${escapeHtml(m.title)}</button><span class="eyeline">${s.id}</span><button class="circle-btn" style="width:31px;height:31px;font-size:17px" data-action="bookmark" title="Toggle bookmark" aria-label="Toggle bookmark">${state.bookmarks.includes(s.id)?'★':'☆'}</button></div><div class="reader-hero ${s.academy?'academy-hero academy-hero-'+m.id.toLowerCase():''}"><div class="hero-lesson-meta">CHAPTER ${CURRICULUM.indexOf(m)+1} · SECTION ${idx+1} OF ${m.sections.length}</div><h1>${escapeHtml(s.title)}</h1><p>${escapeHtml(s.subtitle)}</p></div><div class="lesson-progress"><span>${p}% complete</span><div class="meter"><span style="width:${p}%"></span></div><span>${completed(m)}/${m.sections.length}</span></div><div class="segmented" role="tablist" aria-label="Lesson views">${['Learn','Examples','Try It','Notes'].map(tab=>`<button role="tab" aria-selected="${state.tab===tab}" data-tab="${tab}">${tab}</button>`).join('')}</div>${state.tab==='Learn'?articleLearn(s):state.tab==='Examples'?articleExample(s):state.tab==='Try It'?articlePractice(s):articleNotes(s)}${m.id==='M2'?`<button class="state-tool-link" data-go="states" style="margin-top:14px">⌖ Explore ${escapeHtml(chosenState(state.stateCode)?.[1]||'your state')} programs & rates →</button>`:''}<div class="reader-actions"><button class="secondary mini-btn" data-action="complete">${state.completed[s.id]?'✓ Completed · Undo':'✓ Mark section complete'}</button><button class="secondary mini-btn" data-chat="${s.id}">◉ Discuss in ChatGPT</button></div><div class="reader-actions"><button class="ghost" ${!prev?'disabled':''} data-section="${prev?prev.id:''}">← Previous</button><button class="primary" ${!next?'disabled':''} data-section="${next?next.id:''}">Next section →</button></div><details class="sources"><summary>View the original references and reading sources</summary>${s.sourceKeys.map(k=>SOURCES[k]).filter(Boolean).map(x=>`<a href="${escapeHtml(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(x.name)} ↗</a>`).join('')}<p class="help">Source pages can change. Review current rules and actual contracts for time-sensitive decisions.</p></details><p class="footer-note">Stable reference ${s.id} · Curriculum v2.0 · Discuss this section in ChatGPT using the button above.</p></section>`}
const COLORS=['#4dd69a','#dfc58a','#789f95','#b7a4a0','#7589ae'];
function payment(){let c=state.calc,pr=c.price*(1-c.down/100),r=c.rate/1200,n=c.years*12,pi=r>0?pr*r/(1-Math.pow(1+r,-n)):pr/n;return {pr,pi,tax:c.tax,insurance:c.insurance,pmi:c.pmi,maint:c.maint,total:pi+c.tax+c.insurance+c.pmi,all:pi+c.tax+c.insurance+c.pmi+c.maint,interest:pi*n-pr}}
function range(name,key,min,max,step,fmt,label){const val=state.calc[key];let out=fmt==='money'?money(val):fmt==='percent'?Number(val).toFixed(2)+'%':`${val}${fmt==='years'?' years':''}`;return `<div class="range-row"><div class="range-header"><label for="r-${key}">${escapeHtml(name)}</label><strong data-value="${key}">${out}</strong></div><input type="range" data-range="${key}" id="r-${key}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${escapeHtml(label||name)}"></div>`}
function moneyBreakdown(p){let items=[['Principal + interest',p.pi],['Property tax',p.tax],['Home insurance',p.insurance],['Mortgage insurance',p.pmi]],colors=COLORS,total=p.total;return `<div class="breakdown" aria-label="Monthly housing cost breakdown">${items.map((x,i)=>`<span style="width:${x[1]/total*100}%;background:${colors[i]}"></span>`).join('')}</div><div class="breaklist">${items.map((x,i)=>`<div class="breakline"><span><span class="swatch" style="background:${colors[i]}"></span>${x[0]}</span><strong>${money(x[1])}</strong></div>`).join('')}</div>`}
function compound(){let c=state.calc,r=c.investRate/1200,n=c.investYears*12,monthly=c.investMonthly,initial=c.investStart,principal=initial+monthly*n,total=initial*Math.pow(1+r,n)+(r===0?monthly*n:monthly*(Math.pow(1+r,n)-1)/r);return {total,principal,gain:total-principal}}
function toolContent(){const c=state.calc,p=payment();if(state.tool==='mortgage')return `<div class="panel tool-panel"><span class="eyeline">TOOL 01 · COMPLETE MORTGAGE PAYMENT</span><h2 style="margin:9px 0">What does the house really cost?</h2><p class="muted small">Adjust the assumptions. This is not a mortgage quote.</p>${range('House price','price',150000,600000,5000,'money')}${range('Down payment','down',3,30,1,'percent')}${range('Illustrative fixed rate','rate',3,10,0.25,'percent')}${range('Mortgage term','years',15,30,15,'years')}${range('Monthly property taxes','tax',0,1200,25,'money')}${range('Homeowners insurance / month','insurance',50,500,10,'money')}${range('Mortgage insurance / month','pmi',0,250,5,'money')}${range('Maintenance reserve / month','maint',0,600,10,'money')}<div id="tool-live">${mortgageLive()}</div><p class="help">Property taxes and insurance vary. Mortgage insurance is a manual assumption, not a lender quote. HOA, utilities, and transaction costs are excluded.</p></div>`;
if(state.tool==='equity')return `<div class="panel tool-panel"><span class="eyeline">TOOL 02 · HOME EQUITY</span><h2 style="margin:9px 0">How much of the home is yours?</h2>${range('Estimated current value','value',100000,700000,10000,'money')}${range('Remaining mortgage','balance',0,650000,5000,'money')}<div id="tool-live">${equityLive()}</div><p class="help">This represents value minus the mortgage balance before selling fees, other liens, or taxes. Negative equity is possible.</p></div>`;
if(state.tool==='invest')return `<div class="panel tool-panel"><span class="eyeline">TOOL 03 · COMPOUNDING</span><h2 style="margin:9px 0">What could regular investing grow into?</h2>${range('Starting amount','investStart',0,25000,500,'money')}${range('Monthly contribution','investMonthly',0,1000,25,'money')}${range('Years','investYears',1,40,1,'years')}${range('Illustrative annual return','investRate',0,10,0.5,'percent')}<div id="tool-live">${investLive()}</div><p class="help">A constant nominal return compounded monthly is only a mathematical scenario, not a prediction. It ignores taxes, fees, inflation, and volatility.</p></div>`;
return `<div class="panel tool-panel"><span class="eyeline">TOOL 04 · AFFORDABILITY LENS</span><h2 style="margin:9px 0">Does the payment fit the budget?</h2>${range('Monthly take-home income','homeIncome',1000,12000,100,'money')}${range('Other monthly debt payments','homeDebt',0,2500,50,'money')}<div id="tool-live">${affordLive()}</div><p class="help">This is a cash-flow view, not a lender qualification or a debt-to-income calculation. Lenders generally evaluate gross income, credit, debts, assets, and program rules.</p></div>`}
function mortgageLive(){let p=payment();return `<hr class="divider"><div class="value-box"><div><div class="value-label">Estimated mortgage + escrow / month</div><div class="value-big">${money(p.total)}</div></div><div class="pill">${money(p.pr)} loan</div></div>${moneyBreakdown(p)}<div class="value-box"><div class="value-label">Including maintenance reserve</div><strong style="color:var(--gold);font-size:20px">${money(p.all)}/mo</strong></div><div class="value-box"><div class="value-label">Total scheduled interest over ${state.calc.years} years</div><strong>${money(p.interest)}</strong></div><div class="small-warning">A low advertised mortgage payment can leave out thousands in annual ownership expenses.</div>`}
function equityLive(){let c=state.calc,e=c.value-c.balance,pct=Math.max(0,Math.min(100,e/c.value*100));return `<hr class="divider"><div class="value-label">Estimated home equity</div><div class="value-big">${money(e)}</div><div class="breakdown"><span style="width:${pct}%;background:${COLORS[0]}"></span></div><p class="muted small">Equity as share of estimated value: ${pct.toFixed(1)}%. ${e<0?'The mortgage exceeds the estimated property value.':'Equity is not the same as cash available to spend.'}</p>`}

function affordLive(){let c=state.calc,p=payment(),remaining=c.homeIncome-p.all-c.homeDebt,share=p.all/c.homeIncome*100;return `<hr class="divider"><div class="value-label">Illustrative monthly housing cost + maintenance</div><div class="value-big">${money(p.all)}</div><div class="breakline"><span>Share of take-home pay</span><strong>${share.toFixed(1)}%</strong></div><div class="breakline"><span>Income left after housing and other debt</span><strong>${money(remaining)}</strong></div><p class="muted small">This leaves out food, transport, utilities, healthcare, and saving. Adjust mortgage assumptions under the Mortgage tool.</p>`}
