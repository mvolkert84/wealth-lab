ct the purchase after closing","concept":"A home can be affordable on paper but fragile in practice.","paragraphs":["Reserves are assets that remain available after the transaction. A family that empties every account for a down payment has little ability to absorb a roof leak, temporary unemployment or moving costs that exceed the original estimate. The risk is higher when the house needs work or income is unstable.","Take the example of $30,000 available for a purchase. A scenario requiring $20,000 at closing leaves $10,000. Another requiring $28,000 leaves $2,000. If essential monthly spending is $3,000, the first leaves a little over three months of coverage while the second leaves less than one month. Neither figure alone decides whether to buy; one must consider other obligations, insurance and likely repairs.","A good homebuying plan records reserves before the purchase, estimated cash at settlement and a realistic post-closing forecast. Avoid calling money that is committed to next month’s mortgage “extra emergency savings.”"],"example":[["Available before settlement","$30,000"],["Scenario A cash to close","$20,000 → $10,000 remains"],["Scenario B cash to close","$28,000 → $2,000 remains"]],"pitfall":null,"exercise":"Write a purchase decision using a down-payment alternative and explicit minimum post-closing cash target."},{"heading":"Assistance is not always free money","concept":"Grants, forgivable loans and deferred second mortgages differ.","paragraphs":["Assistance can reduce immediate cash needed, but its legal and economic character matters. A grant may not require repayment if all conditions are met. A forgivable loan might become forgiven over years, with repayment triggered by early sale, refinance or moving. A deferred loan delays payments until a specified event; it is still debt unless forgiven under its terms.","Some offers also restrict income, location, purchase price, owner occupancy, homebuyer education or use of approved lenders. A buyer intending to place the property in a trust, move out, refinance or convert it into a rental must confirm how the assistance agreement treats that event. Generic descriptions rarely contain all controlling clauses.","When comparing assistance, calculate cash saved today, any second-loan balance, additional required monthly payments, restrictions, first-mortgage pricing and the amount that could be due if plans change. A $15,000 headline can be less advantageous than a smaller award with safer terms."],"example":null,"pitfall":null,"exercise":"Compare a $10,000 repayable program and a $7,500 forgivable program using a hypothetical sale after three years."},{"heading":"Build the closing-and-after model","concept":"Decide using all cash flows, not a down-payment percentage.","paragraphs":["A useful decision worksheet presents three scenarios: buy with a small down payment, buy with a larger down payment, or wait and save. For each scenario, show initial cash required, actual lender payment, tax and insurance estimates, maintenance reserves, money remaining after closing and potential assistance restrictions.","Next include stress events: a delayed paycheck, unexpected $2,000 expense, higher insurance, and a need to sell in two years. A scenario that saves $150 a month but leaves zero reserves might be less resilient than one with slightly higher scheduled costs and a healthy buffer.","Explain the result using the family's priorities. If the goal includes passing an asset to the next generation, a sustainable property with affordable carrying costs and clear legal title is more useful than a house acquired through a program the family does not understand. Avoid confusing the largest property that can be financed with the best asset to own."],"example":null,"pitfall":null,"exercise":"Produce a three-scenario recommendation with assumptions, calculations and one reason to reject each option."}],"sources":["https://www.consumerfinance.gov/owning-a-home/prepare/decide-how-much-you-want-spend/","https://www.consumerfinance.gov/owning-a-home/loan-estimate/"]},"L7.S1":{"title":"Inflation and Real Wealth","pages":[{"heading":"What inflation actually measures","concept":"A change in the general price level does not describe every purchase.","paragraphs":["Inflation refers to changes in the overall price level over time. One widely used U.S. measure is the Consumer Price Index, constructed from a basket of goods and services and published by the Bureau of Labor Statistics. It is not the same as a single grocery item rising in price or the value of an individual home increasing.","Every household experiences its own mix of housing, transport, medical costs, education and other spending. If a large share of expenses is rent or insurance, the household's actual cost increase may differ from a national CPI report. The index helps economic comparison, but it should not be treated as a perfect forecast of a person's bills.","Inflation also interacts with wages and interest. Higher nominal pay can leave purchasing power flat if prices rise by a similar amount. Conversely, a fixed contractual payment may become smaller relative to future nominal income, though real affordability also depends on whether wages actually grow."],"example":null,"pitfall":null,"exercise":"Compare annual cost increases for rent, food and medical expenses for a fictional household."},{"heading":"Compute real return, not just nominal growth","concept":"Money can increase while purchasing power barely changes.","paragraphs":["A nominal investment return reports percentage growth before accounting for inflation. A real return describes growth in purchasing power. The exact formula is (1 + nominal return) / (1 + inflation) − 1. This matters because simple subtraction is an approximation and becomes less accurate with larger percentage changes.","If a portfolio grows 7% while a price index rises 4%, the exact real increase is approximately 2.88%. The dollar statement can rise considerably while the underlying buying-power progress is far more modest. Taxes and investment expenses may reduce the effective outcome further.","Choose a consistent period for both rates. A one-year portfolio return should be compared with one-year inflation; mixing monthly inflation with annual investment performance gives a misleading conclusion. And remember that a portfolio may lose value independently of inflation even when the overall economy is healthy."],"example":[["Investment factor","1.07"],["Price factor","1.04"],["Exact real return","1.07 / 1.04 − 1 ≈ 2.88%"]],"pitfall":null,"exercise":"Calculate nominal and real returns for 3%, 6% and 9% hypothetical nominal rates under 4% inflation."},{"heading":"Why interest rates and inflation interact","concept":"Borrowing costs, savings yields and policy decisions are connected.","paragraphs":["Interest rates reflect many influences, including monetary policy, credit risk, maturity, liquidity and inflation expectations. The Federal Reserve sets a target range for the federal funds rate, affecting short-term financing conditions, but mortgage rates and long-term bond yields also respond to market expectations and other factors. They do not move in perfect lockstep with the policy rate.","A lender accepting repayment in future dollars wants compensation for time, default risk and expected purchasing-power loss. That helps explain why high inflation expectations can coexist with higher nominal borrowing rates. But it does not justify predicting a precise mortgage quote from one inflation release.","For households, the useful lesson is to distinguish nominal and real borrowing costs, variable versus fixed-rate exposure, and the cash-flow risks of each. Inflation can erode the real value of fixed-rate debt, but rising prices can still harm a family if wages fail to keep up."],"example":null,"pitfall":null,"exercise":"Create a diagram: inflation expectation → nominal yields → consumer loan terms, and label other influencing factors."},{"heading":"Inflation affects different kinds of assets differently","concept":"No investment is a perfect universal inflation hedge.","paragraphs":["Cash remains stable in nominal dollars but can lose purchasing power if interest fails to keep up with inflation. Fixed-rate bonds can fall in market value when yields rise, while individual bonds held to maturity have their own credit and reinvestment considerations. Stock ownership is a claim on businesses whose profits and valuations may respond differently to rising prices.","Real estate may see rents and values adjust over time, but insurance, repairs, property taxes and financing costs can rise too. Inflation does not guarantee that every property appreciates or that a landlord can increase rent fast enough to offset costs. Concentrating all savings in one leveraged property introduces other risks.","Some U.S. Treasury securities are specifically designed with inflation adjustments, such as Treasury Inflation-Protected Securities, while I Bonds follow their own rules and purchase limits. Compare maturity, liquidity, interest calculation and tax treatment before treating any of them as a universal solution."],"example":null,"pitfall":null,"exercise":"Compare cash, stocks, bonds and housing under a hypothetical inflation shock; list at least two risks per asset."},{"heading":"Plan in today’s dollars and future dollars","concept":"The unit used on your projection must be explicit.","paragraphs":["If living costs of $3,000 monthly grow 3% per year for 20 years, the nominal monthly amount required at the end is approximately $5,418. This does not mean the person will necessarily earn that much or that every expense grows at 3%. It describes how a stated cost changes under one mathematical assumption.","Retirement and education plans should make clear whether a target is expressed in today's purchasing power or future nominal dollars. Comparing a future nominal investment balance directly with today's expenses mixes different units. Adjusting for inflation makes the comparison more meaningful.","Build both views when planning: future dollars help with cash needs in the future, today's dollars help you understand what those amounts represent. Test at least two inflation scenarios and include the possibility of expenses growing at different rates."],"example":[["Monthly cost today","$3,000"],["Annual assumed inflation","3%"],["Future factor","1.03^20 ≈ 1.806"],["Future monthly cost","≈ $5,418"]],"pitfall":null,"exercise":"Project housing and healthcare separately at different inflation assumptions."},{"heading":"Avoid being fooled by nominal results","concept":"A planning memo should explicitly state what was gained in real terms.","paragraphs":["A financial analysis should state the starting amount, nominal changes, time horizon, inflation measure, fees, taxes and result in comparable units. When evaluating a savings account or bond, ask what the yield buys after inflation and any applicable tax, rather than praising the highest interest rate without regard to purchasing power.","For debt, distinguish a fixed contractual payment from the future household income available to make it. Inflation alone does not make repayment easy. If wages stay flat while insurance and food costs rise, a fixed mortgage payment can remain difficult even as its real burden slowly declines.","End with sensitivity analysis, not a one-number prophecy. Present how the household fares under 2%, 3% and 5% inflation, and identify which decisions would change. This approach keeps a financial plan honest when economic conditions move unexpectedly."],"example":null,"pitfall":null,"exercise":"Write a short investment outlook showing both nominal and inflation-adjusted outcomes in three scenarios."}],"sources":["https://www.bls.gov/cpi/","https://www.federalreserve.gov/faqs/economy_14419.htm","https://www.investor.gov/financial-tools-calculators/calculators/compound-interest-calculator"]}};
const PART_TERMS={"L1.S1":[[["Income","Money received during a period, such as a month."],["Cash flow","Money moving into and out of an account over time."],["Net worth","Assets minus liabilities measured at one moment."]],[["Market value","A defensible estimate of what an asset could sell for."],["Secured debt","Debt backed by specific collateral."],["Negative equity","When the associated debt is greater than an asset’s value."]],[["Down payment","Buyer cash applied to the purchase price."],["Closing costs","Transaction expenses paid to complete a purchase."],["Equity","Property value minus outstanding secured debt."]],[["Liquidity","Ability to access money quickly without a large loss."],["Housing carrying costs","Recurring costs such as taxes, insurance and maintenance."],["Emergency reserve","Accessible cash set aside for unplanned expenses."]],[["Appreciation","An increase in estimated market value."],["Principal reduction","A decrease in outstanding loan balance."],["Unrealized gain","Growth in value not yet captured through a sale."]],[["Beneficiary","Person or entity designated to benefit from an asset or arrangement."],["Estate plan","Instructions and legal arrangements for managing or transferring property."],["Upkeep reserve","Funds set aside for recurring and unexpected ownership costs."]]],"L2.S3":[[["Principal","The unpaid amount borrowed."],["Interest","Charge for borrowing outstanding principal."],["Escrow","Funds collected by a servicer for taxes or insurance."]],[["Amortization","Scheduled reduction of loan principal over time."],["Monthly rate","Annual note rate divided by 12 for standard monthly calculations."],["Principal portion","Part of a payment that reduces debt rather than paying interest."]],[["PITI","Principal, interest, taxes and insurance."],["Mortgage insurance","Coverage for the lender, often required with small down payments."],["Escrow shortage","Difference when tax/insurance disbursements exceed escrow collections."]],[["APR","Estimated annualized cost metric incorporating certain loan charges."],["Discount point","Upfront loan fee often paid to reduce the interest rate."],["Break-even period","Time required for payment savings to offset an upfront cost."]],[["Second lien","Additional mortgage or secured claim behind a first mortgage."],["Forgiveness period","Time or conditions needed for some assistance debt to be waived."],["Repayment trigger","Event, such as sale or refinancing, that can require payoff."]],[["Cash-to-close","Money due at settlement after credits and deposits."],["Debt-to-income ratio","Qualifying debt payments relative to gross income."],["Payment shock","A sudden increase in housing expense after a change."]]],"L8.S2":[[["Income statement","Report of revenue, costs and profit over a period."],["Balance sheet","Snapshot of assets, liabilities and equity on a date."],["Cash-flow statement","Report of operating, investing and financing cash flows."]],[["Revenue","Sales recognized under accounting rules."],["COGS","Direct cost of goods or services sold."],["Gross margin","Gross profit divided by revenue."]],[["Assets","Resources controlled by the business."],["Liabilities","Amounts owed or other present obligations."],["Working capital","Current assets minus current liabilities."]],[["Accrual accounting","Recording revenue or expense when earned or incurred, not necessarily paid."],["Accounts receivable","Customer amounts billed but not collected."],["Capital expenditure","Cash spent acquiring or improving longer-lived assets."]],[["Form 10-K","Annual report containing audited financial statements and risks."],["MD&A","Management discussion of results, liquidity and trends."],["Footnotes","Disclosures explaining accounting policies, estimates and obligations."]],[["Free cash flow","A common simplified measure: operating cash flow minus capital expenditure."],["Valuation","Process of assessing what a security is worth."],["Margin of safety","Discount to an estimated value intended to absorb error, not eliminate risk."]]],"L11.S3":[[["Taxable account","Investment account where dividends and realized gains may be taxable currently."],["Tax-deferred account","Account with generally delayed tax recognition subject to distribution rules."],["Tax-free qualified withdrawal","Distribution meeting conditions for favorable treatment, e.g. from a Roth account."]],[["Cost basis","Original or adjusted investment amount used in gain/loss calculations."],["Amount realized","Sale proceeds adjusted for qualifying selling costs."],["Tax lot","Specific group of shares with its own acquisition date and basis."]],[["Short-term gain","Gain on a capital asset generally held one year or less."],["Long-term gain","Gain on a capital asset generally held more than one year."],["Net investment income tax","Additional federal tax applying to certain taxpayers and investment income."]],[["Qualified dividend","Distribution meeting conditions for preferential federal rates."],["Dividend reinvestment","Using a distribution to buy additional shares."],["Return of capital","Distribution that may reduce basis rather than being current dividend income."]],[["Tax-loss harvesting","Realizing investment losses when useful under tax rules."],["Wash sale","Loss-disallowance rule triggered by specified substantially identical purchases."],["Disallowed loss","Loss not currently deductible, sometimes added to replacement shares’ basis."]],[["Carryover basis","Often the donor’s adjusted basis transferred with a lifetime gift."],["Basis adjustment at death","Certain inherited assets may receive a basis tied to date-of-death value."],["Estate inclusion","Whether property is included in a decedent’s gross estate under applicable rules."]]],"L4.S1":[[["Common stock","Ownership shares with residual claim on business value."],["Bond","Debt security promising payments under agreed terms, subject to credit risk."],["ETF","Exchange-traded fund holding a portfolio of assets."]],[["Index fund","Fund tracking a specified securities index."],["Active management","Management attempting to outperform a benchmark or meet another mandate."],["Concentration risk","Large exposure to a single asset, company or sector."]],[["Total return","Price change plus income distributions, generally assuming reinvestment when specified."],["Dividend yield","Annualized dividends divided by price."],["Capital appreciation","Increase in the market price of an investment."]],[["Expense ratio","Annual fund operating expenses as a percentage of average assets."],["Compounding","Earnings or losses affecting a larger accumulated base over time."],["Tracking difference","Gap between a fund’s return and its benchmark return."]],[["Drawdown","Decline from a previous portfolio peak."],["Recovery return","Gain needed to return to an earlier value after a loss."],["Sequence risk","Importance of when returns occur when money is added or withdrawn."]],[["Asset allocation","How a portfolio is divided among asset categories."],["Investment policy","Written rules for goals, risk, allocations and rebalancing."],["Rebalancing","Restoring target asset weights after market movements."]]],"L3.S2":[[["Grantor","Person who creates a trust."],["Trustee","Person or institution administering trust assets."],["Beneficiary","Person or entity for whose benefit a trust operates."]],[["Revocable trust","Trust the grantor generally retains power to amend or revoke."],["Funding a trust","Actually transferring assets or title into the trust arrangement."],["Successor trustee","Person who administers the trust after an identified transition."]],[["Irrevocable trust","Trust with legally limited ability to revoke or amend."],["Distribution standard","Rules governing when beneficiaries can receive assets."],["Retained power","Authority the trust creator keeps that can change tax/legal outcomes."]],[["Grantor trust","Trust treated as owned by grantor for some income tax purposes."],["Non-grantor trust","Trust generally treated as a separate federal income taxpayer."],["Form 1041","Federal income-tax return used for estates and certain trusts."]],[["Due-on-sale clause","Loan term allowing acceleration after some transfers, subject to laws and exceptions."],["Title","Legal ownership evidence in an asset, especially property."],["Assistance lien","Security interest that can require repayment upon specified events."]],[["Probate","Court-supervised process involving aspects of a decedent’s estate."],["Beneficiary designation","Contractual direction about who receives a specified asset."],["Estate attorney","Lawyer who advises on laws, ownership and transfer documents."]]],"L1.S2":[[["Balance sheet","List of assets, liabilities and resulting net worth at a specific date."],["Cash-flow statement","Record of cash inflows and outflows during a period."],["Liquidity","Ability to access money quickly at limited loss."]],[["Pay-period planning","Matching expenses to the paycheck or balance that must cover them."],["Sinking fund","Money accumulated gradually for a known future expense."],["Cash timing gap","Period when bills come due before expected money arrives."]],[["Fixed expense","Payment that is relatively stable or contracted over a period."],["Variable expense","Payment that changes with use or circumstances."],["Discretionary expense","Cost that can more readily be reduced without losing essentials."]],[["Emergency reserve","Accessible assets set aside for unexpected financial disruptions."],["Months of coverage","Liquid reserve divided by essential monthly spending."],["Forced sale","Selling an asset because cash is needed rather than timing the sale by choice."]],[["Stress test","Recalculation of finances under adverse assumptions."],["Minimum cash balance","Lowest projected cash level during the planning period."],["Margin of safety","Extra capacity beyond the bare minimum needed for obligations."]],[["Reconciliation","Matching projected or recorded balances with actual account activity."],["Double counting","Treating a transfer or repeated accounting entry as additional income or spending."],["Variance","Difference between expected and actual financial outcomes."]]],"L1.S3":[[["Principal","Original money invested or deposited."],["Compound growth","Returns earned on prior returns as well as principal."],["Growth factor","One plus the periodic rate, used to carry a balance forward."]],[["Contribution","Additional money added to an account."],["Future value","Projected value after growth and contributions."],["Dollar-cost averaging","Investing fixed amounts over time, purchasing more shares when prices are lower and fewer when higher."]],[["APR","Annual percentage rate; its precise calculation depends on the product."],["APY","Annual percentage yield, which incorporates interest compounding for a deposit product."],["Periodic rate","Interest or modeled return rate for one compounding interval."]],[["Nominal return","Return expressed in dollars before adjusting for inflation."],["Real return","Increase or decrease in purchasing power."],["Purchasing power","Quantity of goods or services that money can purchase."]],[["Expense ratio","Recurring fund operating costs expressed as a percentage of assets."],["Net return","Return after specified fees, and sometimes taxes depending on the definition."],["Drawdown","Decline from a previous peak value."]],[["Sensitivity analysis","Testing how a result changes when assumptions change."],["Time horizon","Period before invested money is needed."],["Sequence risk","Impact of the order of returns, particularly when withdrawing funds."]]],"L1.S4":[[["Principal","Amount owed before future interest accrues."],["Leverage","Use of borrowing to gain exposure to a larger asset or expenditure."],["Equity","Asset value minus associated debt."]],[["Term","Length of time allowed for repayment."],["Amortization","Scheduled reduction of loan principal through payments."],["APR","Standardized annual cost measure; inclusions vary by credit product."]],[["Revolving credit","Credit arrangement where balances can be repaid and borrowed again."],["Grace period","Conditional period during which qualifying purchases may avoid interest."],["Daily periodic rate","Daily interest rate derived from an annual percentage rate under an issuer agreement."]],[["Avalanche method","Directing extra debt payments to the highest interest rate first."],["Snowball method","Directing extra debt payments to the smallest outstanding balance first."],["Minimum payment","Contractually required payment needed to keep an account current."]],[["Collateral","Property pledged as security for a loan."],["Default","Failure to meet a contractual obligation."],["Personal guarantee","Promise by a person to repay a debt if the primary obligor fails."]],[["Debt service","Scheduled principal and interest payments on obligations."],["Debt-to-income ratio","Debt payment obligations compared with qualifying income under a specified calculation."],["Opportunity cost","Value of the next-best use of money or borrowing capacity given up."]]],"L2.S1":[[["Promissory note","Borrower’s agreement to repay debt."],["Mortgage lien","Security interest connected to repayment of a loan."],["Deed","Legal instrument used to convey an interest in real property."]],[["Fixed-rate mortgage","Mortgage with a note rate fixed for its contractual term."],["Adjustable-rate mortgage","Mortgage rate that may adjust under stated rules."],["Rate cap","Contractual limit on how much the interest rate may change."]],[["PITI","Principal, interest, property taxes and insurance."],["Mortgage insurance","Coverage protecting lender/guarantor that may be required under loan rules."],["Maintenance reserve","Cash set aside for property repairs and replacements."]],[["Loan Estimate","Standardized mortgage disclosure provided under applicable requirements."],["Discount point","Upfront payment sometimes used to reduce a mortgage rate."],["Lender credit","Credit offsetting some closing costs, often connected to pricing."]],[["Underwriting","Evaluation of whether a borrower and property meet lending requirements."],["DTI","Debt payment obligations divided by qualifying income under lender rules."],["Preapproval","Conditional lender evaluation before final loan approval."]],[["Earnest money","Deposit associated with a purchase contract."],["Appraisal","Opinion of property value used for a defined purpose."],["Contingency","Contractual condition affecting obligations or termination rights."]]],"L2.S2":[[["Down payment","Buyer’s upfront contribution toward the purchase price."],["Cash to close","Amount buyer must bring at settlement after credits and deposits."],["Prepaid expense","Cost paid in advance such as initial insurance premium or prepaid interest."]],[["Loan-to-value (LTV)","Loan amount divided by property value used for underwriting."],["Private mortgage insurance (PMI)","Insurance sometimes required for conventional loans with limited equity."],["Opportunity cost","Value of the alternative use of cash committed to the down payment."]],[["Mortgage insurance premium","Fee for mortgage-default insurance or guarantee protection."],["Cancellation rules","Conditions under which specified mortgage insurance charges may end."],["Upfront premium","Mortgage insurance or guarantee cost due at origination under certain products."]],[["Post-closing reserves","Accessible assets remaining after purchase completion."],["Reserve coverage","Accessible reserves divided by essential monthly expenses."],["Cash cushion","Funds available beyond immediately scheduled commitments."]],[["Forgivable second loan","Second mortgage whose balance may be forgiven if contract conditions are met."],["Deferred loan","Loan with payments postponed until specified triggers."],["Recapture","Requirement to repay assistance under agreed triggering circumstances."]],[["Cash-to-close model","Estimate of required purchase cash after credits and deposits."],["Holding period","Expected time before selling or refinancing an asset."],["Resilience","Ability to meet obligations under adverse financial changes."]]],"L7.S1":[[["CPI","Price index measuring changes for a defined basket of consumer goods and services."],["Inflation rate","Rate of change in a broad price index over a stated period."],["Purchasing power","Amount of goods or services a sum of money can purchase."]],[["Nominal return","Change measured before purchasing-power adjustment."],["Real return","Return after adjusting for inflation."],["Fisher relationship","Exact multiplicative relationship linking nominal and real rates with inflation."]],[["Federal funds rate","Short-term policy rate targeted by the Federal Reserve."],["Inflation expectations","Anticipated future price-level changes."],["Real interest rate","Approximate borrowing or saving rate after inflation adjustment."]],[["TIPS","U.S. Treasury Inflation-Protected Securities with principal adjustments tied to inflation."],["Duration risk","Sensitivity of bond price to changes in interest rates."],["Concentration risk","Risk from investing too heavily in one asset, issuer or sector."]],[["Future nominal cost","Projected future amount in dollars of that future date."],["Present purchasing-power value","Equivalent value measured in today’s consumption terms."],["Inflation assumption","Hypothetical price growth rate used in planning."]],[["Real burden","Cost expressed relative to purchasing power or real income."],["Scenario analysis","Comparison of outcomes under alternative assumptions."],["Assumption disclosure","Explicit statement of inputs that drive a forecast."]]]};
const PART_CHECKS={"L1.S1":[[{"q":"A person has $30,000 in assets and $10,000 in liabilities. Their net worth is:","options":["$40,000","$30,000","$20,000","$10,000"],"answer":2,"why":"Net worth subtracts the obligations ($10,000) from the assets ($30,000)."},{"q":"Which information would best reveal whether this household can pay rent next week?","options":["Last year’s car purchase price","Current accessible cash and near-term bills","Current home appraisal alone","Retirement balance alone"],"answer":1,"why":"A balance sheet cannot replace a dated cash-flow forecast of cash on hand and upcoming payments."}],[{"q":"A vehicle could sell for $14,000 but has a $17,000 loan. Its contribution to net worth is:","options":["$3,000","−$3,000","$14,000","$17,000"],"answer":1,"why":"The asset minus the associated loan is $14,000 − $17,000 = −$3,000."},{"q":"Which is the soundest way to value assets on a personal balance sheet?","options":["Use what was originally paid","Use realistic current estimated values","Use only the insurance coverage limits","Use what you hope to receive in five years"],"answer":1,"why":"The balance sheet should represent a defensible snapshot, not historic cost or optimistic predictions."}],[{"q":"Cash starts at $25,000. You put $12,500 down and spend $7,500 on closing costs. How much cash remains?","options":["$5,000","$12,500","$17,500","$20,000"],"answer":0,"why":"$25,000 − $12,500 − $7,500 = $5,000 remaining cash."},{"q":"Why did the buyer’s net worth fall by $7,500 in the simplified purchase?","options":["Because the house was not an asset","Because transaction expenses did not automatically create equity","Because the mortgage was forgiven","Because the down payment disappeared entirely"],"answer":1,"why":"The down payment changed the form of wealth; the assumed $7,500 of costs were spent."}],[{"q":"A household earns $4,000 and spends $4,250 a month. Its monthly cash flow is:","options":["+$250","+$4,000","−$250","−$4,250"],"answer":2,"why":"Money received less money spent equals −$250 per month."},{"q":"A home-owning household has high net worth but only $500 cash and a $3,000 repair. What is the immediate challenge?","options":["Lack of liquidity","Lack of a home title","High book profit","Automatic negative equity"],"answer":0,"why":"Net worth can be positive while cash available for urgent expenses is inadequate."}],[{"q":"You pay $400 of loan principal using $400 cash. Ignoring fees, what happens to net worth?","options":["Rises by $400","Falls by $400","Stays unchanged","Rises by $800"],"answer":2,"why":"Cash falls $400, but liabilities also fall $400, so net worth is unchanged at that moment."},{"q":"A house’s estimated market value rises $30,000 without a sale. Which statement is most accurate?","options":["The homeowner received $30,000 cash","The debt is automatically forgiven","Estimated equity rose, but it is not yet spendable cash","Property taxes cannot change"],"answer":2,"why":"Appreciation changes estimated net worth, not automatically liquid funds."}],[{"q":"A daughter inherits a debt-free property worth $250,000, but cannot pay its taxes. What was missing from the plan?","options":["A way to meet ongoing carrying costs","A larger mortgage","A guarantee of stock returns","A lower purchase appraisal"],"answer":0,"why":"Generational plans require cash flow, maintenance and administration as well as transferred ownership."},{"q":"Which action best coordinates estate planning with financial reality?","options":["Sign any trust without listing assets","Inventory debts, ownership, beneficiaries and expenses before selecting tools","Assume a trust eliminates property taxes","Transfer all accounts without reading their terms"],"answer":1,"why":"The estate plan should start with goals and a complete inventory of assets, debts and contractual designations."}]],"L2.S3":[[{"q":"Which amount is excluded from a lender’s quoted principal-and-interest payment?","options":["Principal","Note interest","Property taxes","Scheduled amortization"],"answer":2,"why":"Property taxes are a separate housing cost, often collected through escrow."},{"q":"A mortgage quote says $1,500 P&I, with $500 taxes, $150 insurance and $100 mortgage insurance. Total monthly collection is:","options":["$1,500","$2,250","$2,000","$1,750"],"answer":1,"why":"$1,500 + $500 + $150 + $100 = $2,250 before maintenance and utilities."}],[{"q":"A $237,500 balance carries 6.5% annual interest. Approximate first-month interest is:","options":["$215","$1,286","$1,501","$2,375"],"answer":1,"why":"Monthly interest is approximately $237,500 × 0.065 ÷ 12 = $1,286.46."},{"q":"If the payment is $1,501 and interest is $1,286, approximately how much reduces principal?","options":["$215","$1,286","$1,501","$2,787"],"answer":0,"why":"Payment minus interest is $215 paid toward principal, before rounding."}],[{"q":"P&I is fixed at $1,500, but taxes increase by $90 a month. All else equal, what happens to total collected?","options":["Decreases $90","Stays fixed","Increases $90","Mortgage principal jumps $90"],"answer":2,"why":"Escrow payments can increase independently of a fixed contractual principal-and-interest schedule."},{"q":"Which cost is often missing from an advertised total lender payment?","options":["Principal","Interest","Home maintenance reserve","Mortgage insurance charged with the loan"],"answer":2,"why":"Repairs and maintenance often are not included in the mortgage servicer’s collection."}],[{"q":"A discount point costs $2,400 and saves $40 monthly. Simple break-even is:","options":["12 months","24 months","60 months","120 months"],"answer":2,"why":"$2,400 ÷ $40 = 60 months without time value or tax effects."},{"q":"Two otherwise similar offers have different note rates and fees. Which comparison is more complete?","options":["Rate only","Upfront cost, projected holding period and total borrowing cost","Advertised monthly taxes only","Property listing price only"],"answer":1,"why":"A lower rate is not necessarily cheaper over the expected time you keep the loan."}],[{"q":"An assistance program is a deferred second mortgage. What should you assume?","options":["It is automatically free money","Repayment is delayed and contract triggers must be read","There is never a lien","It eliminates the first mortgage"],"answer":1,"why":"Deferred means payments are postponed under specified terms, not waived."},{"q":"What may happen when refinancing a first mortgage linked to down-payment assistance?","options":["All assistance is always forgiven","Assistance contract may require repayment or consent","Property taxes end","Refinancing automatically transfers title to a trust"],"answer":1,"why":"Second-lien and assistance agreements can restrict refinance or require payoff."}],[{"q":"A lender approves $2,500 monthly housing, but your budget leaves $100 after essentials. Best conclusion?","options":["Approval proves it is affordable","Approval says little about your cash-flow resilience","No reserve is necessary","Home repairs are guaranteed not to happen"],"answer":1,"why":"Underwriting approval is not the same as a household’s capacity to absorb emergencies."},{"q":"Buyer A has $1,000 saved after closing. Buyer B has $12,000 after closing but a slightly higher payment. What must be examined?","options":["Only the lowest payment","Only the largest down payment","Payment difference and emergency resilience together","Only the appraised value"],"answer":2,"why":"Compare total cash-to-close, sustainable monthly budget and reserves rather than one isolated number."}]],"L8.S2":[[{"q":"Which statement best shows what the company owns and owes on a date?","options":["Income statement","Balance sheet","Cash-flow statement","Dividend announcement"],"answer":1,"why":"A balance sheet reports assets, liabilities and owners’ equity at a specific date."},{"q":"A company reports strong profit but low operating cash. What should an analyst do?","options":["Assume fraud immediately","Inspect receivables, inventory and cash conversion","Ignore the cash statement","Value it by revenue alone"],"answer":1,"why":"Profit may not yet have been collected as cash; working-capital changes matter."}],[{"q":"Revenue is $1,200,000 and cost of goods sold is $720,000. Gross profit is:","options":["$480,000","$720,000","$1,200,000","$1,920,000"],"answer":0,"why":"$1,200,000 − $720,000 = $480,000."},{"q":"Using those numbers, gross margin is:","options":["20%","40%","60%","67%"],"answer":1,"why":"$480,000 gross profit divided by $1,200,000 revenue equals 40%."}],[{"q":"A company has $900,000 in assets and $530,000 in liabilities. Equity is:","options":["$370,000","$530,000","$900,000","$1,430,000"],"answer":0,"why":"Assets less liabilities equal $370,000 owners’ equity."},{"q":"What is a likely short-term warning sign despite positive equity?","options":["Bills due exceed readily available current assets","Equipment has a useful life","Stockholders own shares","Revenues are reported quarterly"],"answer":0,"why":"Timing and liquidity can cause inability to pay even with positive net assets."}],[{"q":"Net income is $120,000. Add depreciation $25,000, subtract receivable growth $70,000 and inventory growth $40,000, add payables growth $10,000. Operating cash flow is:","options":["$45,000","$85,000","$120,000","$265,000"],"answer":0,"why":"$120,000 + $25,000 − $70,000 − $40,000 + $10,000 = $45,000."},{"q":"If operating cash flow is $45,000 and capex is $80,000, simplified free cash flow is:","options":["+$125,000","+$35,000","−$35,000","−$80,000"],"answer":2,"why":"Operating cash flow less capex is $45,000 − $80,000 = −$35,000."}],[{"q":"Where should you first look for company-reported material business risks?","options":["Risk Factors in the 10-K","A social media stock tip","Only the share price chart","The quarterly dividend amount"],"answer":0,"why":"SEC filings present risk disclosures in the Risk Factors section of Form 10-K."},{"q":"A company changes a key accounting estimate. What is a useful place to investigate the impact?","options":["Financial statement footnotes and MD&A","Only the opening bell price","Only the CEO biography","Only analyst price targets"],"answer":0,"why":"Footnotes and management discussion can reveal assumptions affecting reported results."}],[{"q":"A highly profitable firm trades at an extremely high valuation. Which conclusion is soundest?","options":["Its stock is automatically a bargain","Business quality does not guarantee an attractive purchase price","Its shares cannot decline","Profits always translate into dividends"],"answer":1,"why":"Excellent company performance can already be reflected or overreflected in the share price."},{"q":"Which pair best tests cash generation and pricing together?","options":["Free cash flow and valuation assumptions","Revenue only and social mentions","Dividend yield and logo recognition","P/E only and last week’s return"],"answer":0,"why":"Cash-flow economics and price paid should both be part of investment analysis."}]],"L11.S3":[[{"q":"In which account are ordinary stock dividends generally potentially taxable in the year paid?","options":["Taxable brokerage account","Traditional IRA holding the stock","Roth IRA holding the stock","A 401(k) account"],"answer":0,"why":"Dividends in ordinary brokerage accounts may be taxable currently; retirement accounts follow different tax timing rules."},{"q":"An investor receives a taxable dividend and immediately reinvests it. Which is true?","options":["Reinvestment generally erases tax","Reinvestment can create a new tax lot and basis","Dividend becomes a bank loan","Old shares lose their basis"],"answer":1,"why":"The distribution may still be taxable; reinvestment purchases additional shares with their own basis."}],[{"q":"A sale produces $6,990 amount realized and adjusted basis of $5,010. Gain is:","options":["$2,010","$1,980","$5,010","$6,990"],"answer":1,"why":"$6,990 − $5,010 = $1,980 realized gain."},{"q":"You bought different lots of the same stock at different prices. Why identify the shares being sold?","options":["Different lots can have different basis and gain amounts","Share identification changes the market price","It guarantees no taxes","Brokers cannot hold multiple lots"],"answer":0,"why":"Specific-lot choices may change realized gain and holding period if tax requirements are met."}],[{"q":"For most capital assets, what holding period generally qualifies a gain as long term?","options":["More than one year","At least 30 days","Exactly six months","Less than one year"],"answer":0,"why":"Long-term treatment generally requires holding a capital asset for more than one year."},{"q":"A taxpayer assumes a federal 15% capital gains rate equals the total tax burden. What is missing?","options":["Possible state tax and additional federal taxes","Cost basis always becomes zero","A dividend cancellation rule","The buyer’s credit score"],"answer":0,"why":"Total liability can involve state income tax and other federal taxes depending on circumstances."}],[{"q":"A $200 taxable cash dividend is reinvested in more stock. Which statement best describes it?","options":["No tax can be owed because no cash leaves the account","Dividend income may be reportable and newly purchased shares gain basis","The broker automatically refunds the dividend","The old shares gain $200 in market value by law"],"answer":1,"why":"Reinvestment is a purchase with dividend proceeds and generally does not itself avoid recognition."},{"q":"Why might a large advertised dividend yield be misleading?","options":["A falling stock price can inflate the percentage","The yield guarantees future cash distributions","Dividends always equal net profit","Yield measures only the bond coupon"],"answer":0,"why":"Dividend yield is annual dividend divided by price; falling share prices can make it appear unusually high."}],[{"q":"You sell shares at a $250 loss and buy substantially identical shares 15 days later. What e"],"answer":0,"why":"A short time horizon makes loss and accessibility risk particularly important."}],[{"q":"A fund tracks a broad stock index. What is its primary investment method?","options":["Passive index tracking","Guaranteeing positive returns","Holding cash only","Automatically avoiding taxes"],"answer":0,"why":"Index funds seek to track an identified benchmark; they are not risk-free."},{"q":"You own three funds all dominated by the same five technology firms. What is the concern?","options":["Overlapping holdings and concentration","Too many brokerage accounts","A required minimum dividend","Lack of any market exposure"],"answer":0,"why":"Different fund labels do not ensure materially different underlying positions."}],[{"q":"You buy stock at $80, sell at $92 and collect $3 dividends. Total dollar return is:","options":["$12","$15","$3","$95"],"answer":1,"why":"Price gain $12 plus $3 dividend equals $15 before costs and taxes."},{"q":"Using those values, simple percentage total return on the $80 cost is:","options":["15%","18.75%","3.75%","11.25%"],"answer":1,"why":"($92 − $80 + $3) ÷ $80 = 0.1875 or 18.75%."}],[{"q":"A fund charges 0.80% and another comparable fund charges 0.05%. Annual fee difference on $10,000 is:","options":["$7.50","$75","$800","$5"],"answer":1,"why":"Difference is 0.75% of $10,000, or $75 per year, before compounding."},{"q":"Two similar funds differ on fees. Which statement is correct?","options":["Fees are a predictable drag on returns","Higher fees guarantee better performance","Low fees eliminate risk","Fees apply only in years with gains"],"answer":0,"why":"All else equal, expenses reduce the amount of investment growth the owner keeps."}],[{"q":"A $10,000 account falls 30%. How much remains?","options":["$3,000","$7,000","$13,000","$9,700"],"answer":1,"why":"$10,000 × 70% = $7,000."},{"q":"After the account falls from $10,000 to $7,000, gain required to recover to $10,000 is approximately:","options":["30%","42.9%","70%","23. alance","The highest annual interest rate","The newest account","The account with the lowest required payment"],"answer":1,"why":"The avalanche method targets higher rates to reduce modeled interest costs."},{"q":"Which premise should be checked before accelerated payoff?","options":["That all essential bills and minimums remain funded","That the lender will forgive debt","That stock prices will rise","That extra principal increases total interest"],"answer":0,"why":"Paying extra is counterproductive if it causes missed essentials or new expensive borrowing."}],[{"q":"A vehicle is pledged for a loan. The loan is generally:","options":["Unsecured","Secured by collateral","Automatically forgiven","An equity investment"],"answer":1,"why":"The lender has a security interest in the vehicle, subject to applicable law."},{"q":"Why does a business owner review a personal guarantee?","options":["It may expose personal finances if the business defaults","It always eliminates interest","It creates government mortgage insurance","It makes a loan a grant"],"answer":0,"why":"A guarantee can create personal responsibility beyond the business entity."}],[{"q":"A loan funds equipment but its payments exceed the added reliable cash flow and leave no reserve. Best conclusion?","options":["The loan is risk-free because it buys equipment","Evaluate downside and financing alternatives first","Borrow more to cover every payment","Ignore the loan term"],"answer":1,"why":"Economic benefit does not remove repayment and liquidity risk."},{"q":"A decision memo should include:","options":["Only the advertised monthly payment","Only the highest possible upside","Total cost, cash-flow effect, collateral and risk assumptions","Only the borrower’s credit limit"],"answer":2,"why":"A robust comparison includes total cost and potential adverse outcomes."}]],"L2.S1":[[{"q":"Which document generally evidences a borrower’s promise to repay?","options":["The promissory note","A property tax bill","A home / $250,000 = 80%."},{"q":"What is a possible downside of paying substantially more down?","options":["It may reduce available emergency reserves","It always increases the mortgage payment","It erases all taxes","It guarantees a higher home value"],"answer":0,"why":"More cash in equity can reduce liquid reserves."}],[{"q":"Who is ordinarily protected by lender-required mortgage insurance?","options":["The borrower’s repair budget","The lender or loan guarantor","The property tax authority","The home inspector"],"answer":1,"why":"Mortgage insurance typically protects lender/guarantor from certain default losses."},{"q":"Which comparison is most reliable?","options":["Using a universal guessed PMI fee","Comparing actual lender quotes with loan details and insurance costs","Assuming every FHA fee ends after five years","Counting mortgage insurance as an investment"],"answer":1,"why":"Terms vary by program and must be quoted and checked."}],[{"q":"Savings $30,000 less cash to close $20,000 leaves:","options":["$2,000","$10,000","$20,000","$50,000"],"answer":1,"why":"$30,000 − $20,000 = $10,000 remaining."},{"q":"If essential monthly costs are $3,000, a $2,000 reserve covers approximately:","options":["Two-thirds of a month","Two months","Three months","Six months"],"answer":0,"why":"$2,000 / $3,000 ≈ 0.67 month."}],[{"q":"A 0% deferred $10,000 second mortgage with no current payment is best categorized as:","options":["Always a gift","Debt with postponed repayment","Immediate house equity with no liability","An investment dividend"],"answer":1,"why":"Payment deferral does not by itself erase an obligation."},{"q":"Which event should be checked in an assistance agreement before putting a house into a trust?","options":["Ownership and transfer restrictions","Kitchen paint choice","Neighborhood restaurant prices","Future stock dividends"],"answer":0,"why":"Transfer restrictions may matter even when a trust strategy is otherwise valid."}],[{"q":"Which information belongs in the final buying comparison?","options":["Only down-payment percentage","Total payment, cash to close, reserves and constraints","Only property listing price","Only a lender’s maximum approval"],"answer":1,"why":"Sustainable purchase choices require full costs and remaining reserves."},{"q":"Why model selling after two years?","options":["Home prices can never fall","Selling costs and assistance recapture may change the result","Mortgage payments automatically stop without payoff","Title insurance pays every loss"],"answer":1,"why":"A short holding period can magnify transaction costs and trigger assistance repayment."}]],"L7.S1":[[{"q":"CPI is best described as:","options":["A single home-price index","A broad consumer price basket measure","A promise of future wage increases","A bank mortgage rate"],"answer":1,"why":"The CPI measures a defined basket of consumer prices."},{"q":"A household’s personal inflation rate can differ from national CPI mainly because:","options":["Everyone buys exactly the same basket","Actual spending mix differs from the index basket","CPI is calculated only once per decade","Borrowing eliminates price increases"],"answer":1,"why":"Different spending patterns expose households to different price changes."}],[{"q":"Nominal return 7%, inflation 4%. Exact real return is closest to:","options":["3.00%","2.88%","7.00%","11.00%"],"answer":1,"why":"1.07 / 1.04 − 1 ≈ 2.88%."},{"q":"Which formula computes exact one-period real growth?","options":["Nominal × inflation","(1 + nominal) / (1 + inflation) − 1","Nominal + inflation","1 / nominal"],"answer":1,"why":"The formula divides growth of money by growth of prices."}],[{"q":"A lower policy rate guarantees which mortgage outcome?","options":["A specific 30-year mortgage quote","No guaranteed one-for-one mortgage change","The elimination of fees","Automatic refinance eligibility"],"answer":1,"why":"Mortgage pricing also reflects longer-term market conditions and borrower factors."},{"q":"Why might lenders charge more when expected inflation is higher?","options":["Future repayment dollars may buy less","All assets become worthless","Credit risk disappears","Loan terms shorten by law"],"answer":0,"why":"Inflation expectations can affect the compensation required for lending."}],[{"q":"Which statement is most accurate about owning rental real estate during inflation?","options":["Rent and price gains are guaranteed","Operating costs and financing can also rise","Mortgage debt is automatically forgiven","Property taxes become fixed nationwide"],"answer":1,"why":"Costs can rise even if rent or value also rises."},{"q":"A fund holding long-maturity fixed-rate bonds often has which exposure?","options":["Interest-rate risk","Guaranteed stock dividends","No market-value variation","Unlimited FDIC insurance"],"answer":0,"why":"Bond market values can respond significantly to changing yields."}],[{"q":"Monthly cost $3,000 grows 3% annually for 20 years. Future monthly cost is closest to:","options":["$3,600","$4,200","$5,418","$8,000"],"answer":2,"why":"$3,000 × 1.03^20 ≈ $5,418."},{"q":"Why compare future balances with future expenses?","options":["To keep values in consistent dollar units","Because prices never change","Because tax rules disappear","To guarantee investment performance"],"answer":0,"why":"Future nominal dollars should not be compared directly to today’s costs without adjustment."}],[{"q":"A savings yield is 4% and inflation 5%. Purchasing power is approximately:","options":["Increasing 9%","Increasing 4%","Declining about 1%","Exactly unchanged"],"answer":2,"why":"1.04 / 1.05 − 1 ≈ −0.95% real return."},{"q":"Which is the most transparent projection?","options":["A single unexplained future balance","A future balance with inflation assumptions and alternative scenarios","A guarantee of future stock gains","An inflation rate copied to every bill"],"answer":1,"why":"Assumptions and scenarios reveal risk rather than hiding it."}]]};
const PRACTITIONER_NOTES={"L1.S1":{"0":["Planner method","A net-worth snapshot and a cash-flow forecast answer different questions. Use both before making an irreversible financial move.","CFP Board · Psychology of Financial Planning","https://www.cfp.net/industry-insights/psychology-of-financial-planning"],"2":["Planner method","When assessing a purchase, separate money converted into equity from money permanently spent on transaction costs. Then check remaining liquid cash.","CFPB · Decide what you can afford","https://www.consumerfinance.gov/owning-a-home/prepare/decide-how-much-you-want-spend/"],"3":["Practitioner interview","Christine Benz describes holding near-term spending money apart from volatile long-term assets to avoid forced selling at a bad time. The principle applies beyond retirement.","Morningstar · Christine Benz interview","https://www.morningstar.com/portfolios/retirement-bucket-basics-qa-with-morningstars-christine-benz"],"5":["Estate-planning method","Before writing estate documents, list asset ownership, beneficiary designations, debts, and who could actually manage inherited property.","American Bar Association · Estate planning checklist","https://www.americanbar.org/groups/public_education/resources/law_issues_for_consumers/wills/estate-planning-information/"]},"L2.S3":{"0":["Lender-comparison technique","Compare the Loan Estimates for total monthly payment, lender fees and credits, not just the rate in an advertisement.","CFPB · Loan Estimate explainer","https://www.consumerfinance.gov/owning-a-home/loan-estimate/"],"2":["Lender-comparison technique","Treat tax and insurance estimates as property-specific assumptions, not prices the lender controls. Investigate any difference between quotes.","CFPB · Compare Loan Estimates","https://www.consumerfinance.gov/owning-a-home/compare/compare-loan-estimates/"],"3":["Lender-comparison technique","Use the five-year cost of borrowing and holding period to test discount points; a low advertised rate may require excessive fees.","CFPB · Five-year cost method","https://www.consumerfinance.gov/owning-a-home/compare/compare-loan-estimates/"],"5":["Financial planning method","Do not treat underwriting approval as a spending target. Compare the mortgage against total household expenses and emergency reserves.","CFPB · Determine what you can spend","https://www.consumerfinance.gov/owning-a-home/prepare/decide-how-much-you-want-spend/"]},"L8.S2":{"0":["Investor method","Read the income statement, balance sheet and cash-flow statement together, then cross-check management explanations against actual financial data.","SEC Investor.gov · Form 10-K","https://www.investor.gov/introduction-investing/getting-started/researching-investments/how-read-10-k"],"3":["Investor method","When earnings rise but cash does not, inspect receivables, inventory, capital expenditure and debt. Ask whether growth is financing itself.","SEC Investor.gov · How to read a 10-K","https://www.investor.gov/introduction-investing/getting-started/researching-investments/how-read-10-k"],"4":["Investor method","Read Risk Factors and MD&A before trusting a rosy investor presentation. The filing is not marketing copy and includes material disclosures.","SEC Investor.gov · 10-K and EDGAR","https://www.investor.gov/introduction-investing/getting-started/researching-investments/how-read-10-k"],"5":["Investor method","A business can be high quality but a poor investment at the wrong price. Put assumptions and downside scenarios in writing before buying.","SEC Investor.gov · Researching investments","https://www.investor.gov/introduction-investing/getting-started/researching-investments/using-edgar-research-investments"]},"L11.S3":{"0":["Adviser interview","Michael Kitces argues asset location should consider both tax efficiency and expected return, not just a rigid “bonds in IRA, stocks in taxable” rule.","CFA Institute · Michael Kitces interview","https://rpc.cfainstitute.org/research/multimedia/2018/new-perspectives-on-asset-location-decisions"],"1":["Tax practice","For different tax lots, properly identify shares at sale and keep broker confirmations. Specific identification can change realized tax outcomes.","IRS · Publication 550","https://www.irs.gov/publications/p550"],"4":["Tax practice","Before harvesting a loss, check substantially identical purchases 30 days before and after across accounts and related transactions.","IRS · Publication 550 wash-sales rules","https://www.irs.gov/publications/p550"],"5":["Estate-planning method","Lifetime gifts and inheritances can have different basis consequences. Model the after-tax outcome and ownership objectives before moving appreciated property.","IRS · Publication 551 cost basis","https://www.irs.gov/publications/p551"]},"L4.S1":{"0":["Practitioner interview","Christine Benz uses separate cash reserves and long-term diversified investments to match money to when it is needed, rather than chasing returns for every dollar.","Morningstar · Christine Benz on buckets","https://www.morningstar.com/portfolios/retirement-bucket-basics-qa-with-morningstars-christine-benz"],"1":["Investor method","Look through the fund wrapper to its holdings. Multiple sector funds can be less diversified than one broad-market fund.","SEC Investor.gov · Diversification","https://www.investor.gov/introduction-investing/investing-basics/investment-products/mutual-funds-and-exchange-traded-funds"],"3":["Practitioner perspective","Christine Benz emphasizes saving consistently and limiting costs rather than expecting to win by complex fund choices.","Morningstar · Portfolio lessons","https://www.morningstar.com/portfolios/what-i-got-right"],"5":["Practitioner perspective","Rules chosen before a market decline reduce the chance of reacting impulsively to every headline. Match risk-taking to the actual goal.","CFP Board · Psychology of Financial Planning","https://www.cfp.net/industry-insights/psychology-of-financial-planning"]},"L3.S2":{"0":["Estate practice","Separate the roles of creator, manager and beneficiary. One person can sometimes hold several roles, but the powers and duties still matter.","American Bar Association · Glossary of estate-planning terms","https://www.americanbar.org/groups/real_property_trust_estate/resources/estate-planning/glossary/"],"1":["Estate practice","A trust document and a properly titled asset are different things. Inventory the property actually transferred into the trust.","American Bar Association · Estate planning checklist","https://www.americanbar.org/groups/public_education/resources/law_issues_for_consumers/wills/estate-planning-information/"],"3":["Tax practice","Do not assume “irrevocable” means separately taxed or tax-free. Confirm whether a trust is treated as grantor or non-grantor and who reports the income.","IRS · Form 1041 instructions","https://www.irs.gov/instructions/i1041"],"4":["Estate practice","Check loan documents, beneficiary designations and property insurance before altering ownership. A transfer plan must respect existing contracts.","American Bar Association · Estate planning information","https://www.americanbar.org/groups/public_education/resources/law_issues_for_consumers/wills/estate-planning-information/"]},"L1.S2":{"3":["planning technique","Before deciding a savings target, distinguish money needed for the next scheduled bills from genuinely uncommitted reserves. A budget can look cash-rich days before large payments come due.","CFPB · Budgeting","https://www.consumerfinance.gov/consumer-tools/budgeting/"]},"L1.S3":{"4":["SEC investor bulletin","Fees reduce invested capital and its ability to grow; compare all-in costs rather than assuming a small yearly percentage is harmless.","SEC Investor.gov · Fees and Expenses","https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins/updated"]},"L1.S4":{"2":["CFPB consumer guidance","When carrying a balance, interest may depend on daily balances; paying earlier can reduce accrued interest, subject to the actual card agreement.","CFPB · Credit-card interest","https://www.consumerfinance.gov/ask-cfpb/how-does-my-credit-card-company-calculate-the-amount-of-interest-i-owe-en-51/"]},"L2.S1":{"3":["CFPB comparison method","Compare five-year borrowing costs and upfront costs alongside rate rather than deciding from a rate advertisement.","CFPB · Loan Estimates","https://www.consumerfinance.gov/owning-a-home/loan-estimate/"]},"L2.S2":{"4":["decision technique","Compare restrictions and triggered repayment beside the headline assistance amount; immediate savings are not the same as lifetime benefit.","CFPB · Loan comparison","https://www.consumerfinance.gov/owning-a-home/loan-estimate/"]},"L7.S1":{}};
const CASE_FILES={"L1.S2":{"title":"A two-paycheck household with a cash gap","scenario":"A household receives $2,100 on the 15th and 30th, has $200 cash on the 1st, and owes $1,400 rent on the 5th. Other monthly costs total $2,300. It has $8,000 of home equity but no dedicated cash reserve.","steps":[["Monthly net pay","$2,100 × 2 = $4,200"],["Total monthly expenses","$1,400 + $2,300 = $3,700"],["Monthly margin","+$500, assuming no hidden bills"],["Cash gap on the 5th","$200 opening cash versus $1,400 rent: −$1,200"]],"decision":"A monthly surplus does not solve the early-month rent gap. Explain which bills or pay cycles must change and how the household could rebuild a dedicated reserve without counting home equity as cash."},"L1.S3":{"title":"A saver compares deposits and growth","scenario":"One saver deposits $250 monthly for 20 years and models a 6% nominal annual return compounded monthly; another deposits the same amount but earns no growth. Neither projection includes fees, taxes, inflation or actual market volatility.","steps":[["Total deposits","250 × 12 × 20 = $60,000"],["No-growth outcome","$60,000"],["6% hypothetical outcome","Approximately $115,500"],["Modeled difference","About $55,500 before tax, fees and inflation"]],"decision":"Identify the part within the saver’s control, the uncertain assumptions, and why the model should be rerun under lower returns, higher inflation and different fees."},"L1.S4":{"title":"Borrow for equipment or keep a cash cushion?","scenario":"A small business considers borrowing $12,000 at a fixed 12% APR for three years to purchase equipment. Its expected incremental cash contribution is $350 monthly, but revenue is uncertain and operating cash reserves cover only one month.","steps":[["Illustrative monthly loan payment","Approximately $399 (36 months at 12%)"],["Expected monthly equipment contribution","$350"],["Monthly gap before other costs","Approximately −$49"],["Reserve coverage","One month of existing operating costs"]],"decision":"Explain why projected positive operating benefit is insufficient, how the personal guarantee could matter, and what evidence would justify waiting, reducing price or finding alternatives."},"L2.S1":{"title":"Two mortgage offers, one buyer","scenario":"A buyer compares a low note rate requiring $2,400 in points with a higher-rate option carrying no points. The low-rate choice is estimated to save $40 monthly. The buyer may sell after three years and has limited cash after settlement.","steps":[["Extra upfront point cost","$2,400"],["Assumed monthly saving","$40"],["Simple break-even","60 months"],["Simple savings within 36 months","$1,440, short of upfront cost"]],"decision":"Identify the preferred offer under these assumptions, then name factors that could change the choice, such as other fees, taxes, loan balances or holding period."},"L2.S2":{"title":"5% down versus a larger down payment","scenario":"A buyer has $42,000 available. A $250,000 home can be purchased with 5% down and $7,500 other closing cash, or 10% down with the same other closing cash. Estimated monthly essential spending after buying is $3,000.","steps":[["Option A: 5% down","$12,500 + $7,500 = $20,000 cash to close"],["Option A: cash left","$22,000 = 7.3 months at $3,000"],["Option B: 10% down","$25,000 + $7,500 = $32,500 cash to close"],["Option B: cash left","$9,500 = 3.2 months at $3,000"]],"decision":"Compare payment savings against resilience. Explain why the lower down-payment choice may be sensible despite a larger mortgage, and identify information still missing (PMI, lender rates, tax, planned repairs)."},"L7.S1":{"title":"Compare a nominal savings forecast with rising costs","scenario":"A family expects a $3,000 monthly expense today to increase by 3% annually for 20 years. At the same time a savings forecast quotes a future portfolio in nominal dollars without mentioning inflation.","steps":[["Expense today","$3,000 per month"],["Growth factor","1.03^20 ≈ 1.806"],["Modeled nominal expense in year 20","About $5,418 per month"],["What the balance must be compared with","Future nominal expense or today’s purchasing-power equivalent"]],"decision":"Rebuild the projection under 2%, 3% and 5% inflation and identify the risk of using nominal savings balances against today’s rent and living costs."}};
const TEXTBOOK_CHECKS={"L1.S1":[{"q":"After buying a $250,000 home with $12,500 down and $7,500 in assumed transaction costs from $25,000 cash, what is simplified net worth immediately afterward?","options":["$250,000","$25,000","$17,500","$12,500"],"answer":2,"why":"The $237,500 mortgage offsets most home value; $5,000 cash plus $12,500 equity equals $17,500. The costs reduced wealth."},{"q":"Which situation best demonstrates a liquidity problem?","options":["Strong net worth but not enough accessible money to cover repairs","All bills paid with substantial cash reserves","Income exceeding expenses with no debt","Home equity increasing due to principal repayment"],"answer":0,"why":"A home or retirement account can contribute to positive net worth while accessible cash remains insufficient."},{"q":"Which payment directly reduces the balance of a typical amortizing mortgage?","options":["Homeowners insurance","Mortgage principal","Property tax escrow","Mortgage interest"],"answer":1,"why":"Principal repayment reduces the debt. Interest, taxes and insurance are separate costs."}],"L2.S3":[{"q":"About how much of the first $1,501.16 payment on a $237,500 mortgage at 6.5% goes to principal?","options":["$1,286","$1,501","$215","$525"],"answer":2,"why":"First-month interest is about $1,286.46, leaving $214.70 of the principal-and-interest payment to reduce the balance."},{"q":"Which mortgage cost may change even when the note rate and scheduled principal-and-interest payment are fixed?","options":["Property tax escrow","The original loan term","The fixed contractual rate","The original principal balance"],"answer":0,"why":"Property taxes and insurance premiums can change, raising the total payment collected in escrow."},{"q":"A point costs $2,375 and saves $45 a month. What is the simple break-even, ignoring time value and other effects?","options":["About 26 months","About 53 months","About 12 months","About 100 months"],"answer":1,"why":"$2,375 divided by $45 per month is approximately 52.8 months."}],"L8.S2":[{"q":"A company has $1.2 million sales and $720,000 cost of goods sold. What is its gross profit?","options":["$480,000","$720,000","$1,200,000","$180,000"],"answer":0,"why":"Gross profit equals revenue minus cost of goods sold: $1,200,000 − $720,000 = $480,000."},{"q":"Which event can make accounting profit larger than operating cash inflow?","options":["Collecting an old receivable","Selling products on credit without immediate cash collection","Paying off trade payables","Raising new common stock"],"answer":1,"why":"Accrual revenue may be recognized before customers pay, increasing receivables and not current cash."},{"q":"If operating cash flow is $45,000 and capital expenditure is $80,000, what is simple free cash flow?","options":["$125,000","$45,000","$35,000 negative","$80,000"],"answer":2,"why":"Under operating-cash-flow-minus-capex, $45,000 − $80,000 = −$35,000."}],"L11.S3":[{"q":"A purchase basis of $5,010 and sale amount realized of $6,990 imply which gain before further adjustments?","options":["$1,980","$2,000","$6,990","$5,010"],"answer":0,"why":"Amount realized minus adjusted basis is $6,990 − $5,010 = $1,980."},{"q":"What generally happens when a taxable-account dividend is automatically reinvested?","options":["Reinvestment always cancels dividend income tax","The dividend may still be taxable and new shares acquire basis","A dividend becomes a deductible capital loss","The shares always qualify for long-term rates immediately"],"answer":1,"why":"Reinvesting buys shares; it does not generally erase taxable dividend income. The purchase creates basis in the new lot."},{"q":"Which statement best reflects the wash-sale issue?","options":["Loss deductions are always allowed if a position is repurchased immediately","It only concerns cash accounts, never retirement accounts","It may disallow an immediate loss when substantially identical securities are acquired during the applicable window","Any 30% market decline creates a wash sale"],"answer":2,"why":"The wash-sale rule can affect loss recognition when substantially identical securities are acquired around a loss sale."}],"L4.S1":[{"q":"An asset bought at $80, sold at $92 and paying $3 cash dividends has what simplified total return?","options":["15%","18.75%","12%","3.75%"],"answer":1,"why":"Total return is ($92 + $3 − $80) / $80 = $15 / $80 = 18.75%."},{"q":"An investment drops from $10,000 to $7,000. About what percent must it then gain to recover to $10,000?","options":["30%","23.08%","42.86%","70%"],"answer":2,"why":"It needs $3,000 on a $7,000 base, or about 42.86%."},{"q":"Which collection is most likely to be broadly diversified by asset class?","options":["Three different funds all concentrated in the same ten technology firms","A mix of broad global stocks, high-quality bonds and liquidity reserves","Only the shares of the investor’s employer","Five leveraged funds in one sector"],"answer":1,"why":"Diversification across economic exposures means different asset classes, not simply holding multiple product labels."}],"L3.S2":[{"q":"What usually describes a basic revocable living trust during the grantor’s life?","options":["The grantor often retains the power to amend or revoke it","The grantor automatically pays no federal income tax","The home mortgage always disappears","It is always protected from all grantor creditors"],"answer":0,"why":"A standard revocable trust generally preserves grantor control, which limits several creditor and tax outcomes."},{"q":"Which statement about an irrevocable trust is most accurate?","options":["Its label alone guarantees tax-free growth","It can support certain objectives, depending on retained rights, state law, tax treatment and terms","It must invest only in insurance policies","It cancels existing property liens automatically"],"answer":1,"why":"Specific legal rights and rules determine outcomes; the irrevocable label is not a blanket guarantee."},{"q":"Before transferring a financed home into a trust, what needs review?","options":["Only the furniture inventory","Only the current market valuation","Mortgage terms, assistance liens, insurance, beneficiary needs and legal/tax rules","Only whether the house has increased in value"],"answer":2,"why":"Existing contracts and property obligations continue to matter after title transfers."}],"L1.S2":[{"q":"A household gets paid on the 15th, has $0 cash on the 1st, and owes $1,200 rent on the 5th. Total monthly income exceeds spending by $300. What problem still exists?","options":["The home must have negative equity","A cash-timing shortfall before payday","A guaranteed surplus on the 5th","An interest-rate mismatch"],"answer":1,"why":"Monthly totals hide the balance available when a bill actually becomes due."},{"q":"Starting liquid reserve is $7,000. A repair costs $2,400 and essential monthly expenses are $2,300. How much emergency coverage remains?","options":["One month","Two months","Three months","Four months"],"answer":1,"why":"$7,000 − $2,400 = $4,600; $4,600 / $2,300 = two months."},{"q":"A credit card is used to pay for groceries and the bank transfer later pays the credit card. How should the two events be treated in a spending report?","options":["Count grocery spending and the card payment both as consumption","Count only the bank transfer as groceries","Record consumption once and the card payment as a debt/cash movement","Ignore both because they cancel"],"answer":2,"why":"The grocery purchase represents consumption; the later card payment reduces an obligation. Counting both as consumption double-counts."}],"L1.S3":[{"q":"$10,000 earns 5% annual compounding for two years, no deposits. Ending balance?","options":["$10,500","$11,000","$11,025","$12,000"],"answer":2,"why":"$10,000 × (1.05)^2 = $11,025."},{"q":"An investment loses 20%. What increase on the remaining value would fully recover the starting amount?","options":["20%","22%","25%","40%"],"answer":2,"why":"After a 20% decline, $80 must return to $100; $20/$80 = 25%."},{"q":"A long-term account forecast shows $200,000 in 25 years but is not inflation-adjusted. Which correction improves decision quality?","options":["Assume it buys what $200,000 buys today","Display a real-dollar estimate and assumptions","Assume zero taxes or fees","Increase the forecast to ensure a cushion"],"answer":1,"why":"A nominal amount should be analyzed against future prices or translated into today’s purchasing power."}],"L1.S4":[{"q":"A $5,000 credit card balance carries a simplified 24% nominal APR (2% per month). With a $130 payment and $100 interest, principal reduction is:","options":["$30","$100","$130","$230"],"answer":0,"why":"$130 payment less $100 interest leaves $30 to reduce principal."},{"q":"Borrowed money buys an asset worth exactly the debt and adds no fees. Which is the immediate net-worth effect?","options":["Net worth rises by the loan amount","Net worth falls by the loan amount","No immediate net-worth change","Net worth doubles"],"answer":2,"why":"The asset and liability offset each other."},{"q":"A homeowner is considering a personal-guaranteed loan for a rental property. Which risk belongs in the decision?","options":["Personal financial exposure if the borrower defaults","Loan interest becomes tax-free","Market values cannot decline","All fees are refundable"],"answer":0,"why":"A personal guarantee may expose the individual’s finances, depending on the instrument and law."}],"L2.S1":[{"q":"A purchaser signs a promissory note and grants a mortgage lien. What does the note generally establish?","options":["The title insurance premium","The repayment obligation","The property’s market value","The estate tax exemption"],"answer":1,"why":"The note contains the borrower’s promise to repay; the lien secures debt with the property."},{"q":"P&I $1,600, taxes $400, insurance $150, mortgage insurance $85, and repair reserve $200. The planning monthly total excluding utilities is:","options":["$2,150","$2,235","$2,435","$2,635"],"answer":2,"why":"$1,600+$400+$150+$85+$200 = $2,435."},{"q":"Two offers have different points and lender credits. What is the best next step?","options":["Choose lowest note rate immediately","Compare same-date Loan Estimates and expected holding period","Assume the highest APR always has the lowest closing cash","Ignore fees if the payment fits"],"answer":1,"why":"Points, credits, fees and holding period change the total economic comparison."}],"L2.S2":[{"q":"Available cash $32,000, down payment $12,500, other closing cash $7,500, moving cost $2,000. Remaining cash after moving?","options":["$8,000","$10,000","$12,000","$20,000"],"answer":1,"why":"$32,000 − $12,500 − $7,500 − $2,000 = $10,000."},{"q":"Which describes a deferred down-payment loan correctly?","options":["It is automatically a gift","Its payment may be delayed but debt can remain","It cancels mortgage insurance on all loans","It never has transfer restrictions"],"answer":1,"why":"Deferral postpones repayment until contractually defined events; it is not necessarily forgiven."},{"q":"When weighing 5% versus 20% down, which input is essential beyond principal-and-interest?","options":["The first broker’s slogan","Cash remaining, insurance, fees and property risks","Future appreciation guaranteed","The number of rooms alone"],"answer":1,"why":"A larger down payment reduces borrowing but may sacrifice critical reserves; full cash and cost comparison is required."}],"L7.S1":[{"q":"Nominal return 6%, inflation 4%. Exact real return closest to:","options":["2.00%","1.92%","6.00%","10.00%"],"answer":1,"why":"1.06/1.04−1 ≈ 1.923%."},{"q":"A $2,000 monthly expense rises 5% annually for 10 years. Future monthly nominal cost closest to:","options":["$2,100","$2,500","$3,258","$4,000"],"answer":2,"why":"$2,000×1.05^10≈$3,257.79."},{"q":"Which statement is a reliable general principle of inflation planning?","options":["Every personal expense rises exactly at CPI","Inflation always raises stock prices","Compare future nominal spending with future nominal resources","Fixed mortgage payments always become affordable"],"answer":2,"why":"Consistent units help compare resources and needs; actual costs and wages may vary widely."}]};
