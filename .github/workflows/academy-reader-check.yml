name: Wealth Lab visual and curriculum design check

on:
  push:
    branches: [main]
    paths:
      - index.html
      - reader-v1.css
      - visual-polish-v1.css
      - academy-depth-core.js
      - academy-gold-lab.js
      - academy-gold-standard-core.js
      - academy-gold-foundations-labs.js
      - academy-gold-mortgage-labs.js
      - academy-gold-short-converter.js
      - academy-gold-estate-labs.js
      - academy-gold-investing-labs.js
      - academy-gold-insurance-labs.js
      - academy-gold-tax-labs.js
      - 'academy-chapters/**'
      - sw.js
      - manifest.webmanifest
      - scripts/check-lesson-reader.mjs
      - scripts/check-visual-system.mjs
      - scripts/check-expanded-chapters.mjs
      - scripts/check-gold-standard.mjs
      - scripts/check-gold-foundations.mjs
      - scripts/check-gold-mortgages.mjs
      - scripts/check-gold-estates.mjs
      - scripts/check-gold-investing.mjs
      - scripts/check-gold-insurance.mjs
      - scripts/check-gold-tax.mjs
      - .github/workflows/academy-reader-check.yml
  pull_request:
    paths:
      - index.html
      - reader-v1.css
      - visual-polish-v1.css
      - academy-depth-core.js
      - academy-gold-lab.js
      - academy-gold-standard-core.js
      - academy-gold-foundations-labs.js
      - academy-gold-mortgage-labs.js
      - academy-gold-short-converter.js
      - academy-gold-estate-labs.js
      - academy-gold-investing-labs.js
      - academy-gold-insurance-labs.js
      - academy-gold-tax-labs.js
      - 'academy-chapters/**'
      - sw.js
      - manifest.webmanifest
      - scripts/check-lesson-reader.mjs
      - scripts/check-visual-system.mjs
      - scripts/check-expanded-chapters.mjs
      - scripts/check-gold-standard.mjs
      - scripts/check-gold-foundations.mjs
      - scripts/check-gold-mortgages.mjs
      - scripts/check-gold-estates.mjs
      - scripts/check-gold-investing.mjs
      - scripts/check-gold-insurance.mjs
      - scripts/check-gold-tax.mjs
      - .github/workflows/academy-reader-check.yml

jobs:
  lesson-reader:
    name: Verify shared lesson reader and global visual design
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared lesson design and curriculum
        run: |
          node scripts/check-lesson-reader.mjs
          node scripts/check-visual-system.mjs
          node scripts/check-expanded-chapters.mjs
          node scripts/check-gold-standard.mjs
          node scripts/check-gold-foundations.mjs
          node scripts/check-gold-mortgages.mjs
          node scripts/check-gold-estates.mjs
          node scripts/check-gold-investing.mjs
          node scripts/check-gold-insurance.mjs
          node scripts/check-gold-tax.mjs
